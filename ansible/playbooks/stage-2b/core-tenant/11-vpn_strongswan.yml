---
- name: strongSwan setup
  hosts: all
  become: true
  vars:
    strongswan__con_name: "{{ strongswan_con_name | default('') }}"
    strongswan__left: "{{ strongswan_left | default('') }}"
    strongswan__right: "{{ strongswan_right | default('') }}"
    strongswan__leftsubnet: "{{ strongswan_leftsubnet | default('') }}"
    strongswan__rightsubnet: "{{ strongswan_rightsubnet | default('') }}"
    strongswan__psk: "{{ vault__strongswan__psk | default('') }}"
  pre_tasks:
    - name: Validate required strongSwan inventory variables
      ansible.builtin.assert:
        that:
          - strongswan__con_name is defined
          - strongswan__con_name is not none
          - strongswan__con_name | string | trim | length > 0
          - strongswan__left is defined
          - strongswan__left is not none
          - strongswan__left | string | trim | length > 0
          - strongswan__right is defined
          - strongswan__right is not none
          - strongswan__right | string | trim | length > 0
          - strongswan__leftsubnet is defined
          - strongswan__leftsubnet is not none
          - strongswan__leftsubnet | string | trim | length > 0
          - strongswan__rightsubnet is defined
          - strongswan__rightsubnet is not none
          - strongswan__rightsubnet | string | trim | length > 0
        fail_msg: Required strongSwan connection variables must be provided by inventory.

    - name: Validate required strongSwan secret variable
      no_log: true
      ansible.builtin.assert:
        that:
          - strongswan__psk is defined
          - strongswan__psk is not none
          - strongswan__psk | string | trim | length > 0
        fail_msg: The required strongSwan secret variable must be provided by inventory.
  roles:
    - role: strongswan
