---
- name: Reload the governed 1Password SSH Agent on the macOS controller
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true

  vars:
    ansible_become: false
    _controller_target: "{{ onepassword_controller_target | default('') }}"
    _target_vars: "{{ hostvars[_controller_target] | default({}) }}"
    _reload: >-
      {{ _target_vars.onepassword_controller_ssh_agent_reload | default({}) }}
    _agent: >-
      {{ _target_vars.hetzner_baremetal_onepassword.ssh_agent | default({}) }}

  pre_tasks:
    - name: Require one exact target and a closed reload contract
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit | string | trim == 'localhost'
          - _controller_target in groups['hetzner_baremetal']
          - _reload is mapping
          - _reload.keys() | list | sort == [
              'app_bundle_id',
              'open_path',
              'open_sha256',
              'osascript_path',
              'osascript_sha256',
              'schema_version'
            ] | sort
          - _reload.schema_version | int == 1
          - _reload.app_bundle_id == 'com.1password.1password'
          - _reload.osascript_path == '/usr/bin/osascript'
          - _reload.open_path == '/usr/bin/open'
          - _reload.osascript_sha256 is match('^[a-f0-9]{64}$')
          - _reload.open_sha256 is match('^[a-f0-9]{64}$')
          - _agent.agent_socket_path is match('^/[^\r\n]+/agent\.sock$')
        quiet: true

    - name: Inspect the approved macOS application-control binaries
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: true
        get_checksum: true
        checksum_algorithm: sha256
      loop:
        - path: "{{ _reload.osascript_path }}"
          sha256: "{{ _reload.osascript_sha256 }}"
        - path: "{{ _reload.open_path }}"
          sha256: "{{ _reload.open_sha256 }}"
      register: _reload_binaries

    - name: Require the exact approved application-control bytes
      ansible.builtin.assert:
        that:
          - item.stat.exists | bool
          - item.stat.isreg | bool
          - item.stat.executable | bool
          - item.stat.checksum == item.item.sha256
        quiet: true
      loop: "{{ _reload_binaries.results }}"

  tasks:
    - name: Request a graceful 1Password shutdown
      ansible.builtin.command:
        argv:
          - "{{ _reload.osascript_path }}"
          - -e
          - >-
            tell application id "{{ _reload.app_bundle_id }}" to quit
      changed_when: true

    - name: Allow the desktop process to release the agent socket
      ansible.builtin.pause:
        seconds: 2

    - name: Start the approved 1Password application bundle
      ansible.builtin.command:
        argv:
          - "{{ _reload.open_path }}"
          - -b
          - "{{ _reload.app_bundle_id }}"
      changed_when: true

    - name: Wait for the governed SSH Agent socket
      ansible.builtin.wait_for:
        path: "{{ _agent.agent_socket_path }}"
        state: present
        timeout: 30

    - name: Report the secret-free reload result
      ansible.builtin.debug:
        msg:
          target: "{{ _controller_target }}"
          app_bundle_id: "{{ _reload.app_bundle_id }}"
          agent_socket_present: true
