---
- name: Generate one governed Ubuntu access key directly in 1Password
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true

  vars:
    ansible_become: false
    _controller_target: "{{ onepassword_controller_target | default('') }}"
    _target_vars: "{{ hostvars[_controller_target] | default({}) }}"
    _onepassword: "{{ _target_vars.hetzner_baremetal_onepassword | default({}) }}"
    _identity_name: "{{ onepassword_ubuntu_access_identity | default('') }}"
    _identity_contracts:
      svc_ansible:
        item_title: id_ed25519_lit_svc_ansible
        subject: svc_ansible
        tags: [lit-pis, automation, ssh, ubuntu]
      breakglass:
        item_title: id_ed25519_lit_breakglass
        subject: breakglass
        tags: [lit-pis, breakglass, ssh, ubuntu]
    _identity: "{{ _identity_contracts[_identity_name] | default({}) }}"
    _contract:
      operation: apply
      allow_create: true
      account_id: "{{ _onepassword.account_id }}"
      account_sign_in_address: "{{ _onepassword.account_sign_in_address }}"
      authorized_user_uuids: "{{ _onepassword.authorized_user_uuids }}"
      category: SSH Key
      cli_path: "{{ _onepassword.cli_path }}"
      cli_sha256: "{{ _onepassword.cli_sha256 }}"
      cli_version: "{{ _onepassword.cli_version }}"
      item_id: ""
      item_version: 0
      item_title: "{{ _identity.item_title }}"
      tags: "{{ _identity.tags }}"
      subject: "{{ _identity.subject }}"
      schema_version: 1
      key_type: ed25519
      expected_fingerprint: ""
      ssh_add_path: "{{ _onepassword.ssh_agent.ssh_add_path }}"
      ssh_add_sha256: "{{ _onepassword.ssh_agent.ssh_add_sha256 }}"
      ssh_keygen_path: "{{ _onepassword.ssh_agent.ssh_keygen_path }}"
      ssh_keygen_sha256: "{{ _onepassword.ssh_agent.ssh_keygen_sha256 }}"
      agent_socket_path: "{{ _onepassword.ssh_agent.agent_socket_path }}"

  pre_tasks:
    - name: Require the exact identity-bound generation confirmation
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit | string | trim == 'localhost'
          - _controller_target in groups['hetzner_baremetal']
          - _identity_name in ['svc_ansible', 'breakglass']
          - _identity.keys() | list | sort == ['item_title', 'subject', 'tags'] | sort
          - >-
            onepassword_ubuntu_access_confirmation | default('')
            == 'GENERATE-IN-1PASSWORD:' ~ _identity.item_title
          - not ansible_check_mode
          - onepassword_ubuntu_access_commit_shas is mapping
          - onepassword_ubuntu_access_commit_shas.keys() | list | sort == [
              'automation', 'foundational', 'inventory', 'operations',
              'ubuntu', 'validation'
            ] | sort
          - >-
            onepassword_ubuntu_access_commit_shas.values()
            | select('match', '^[0-9a-f]{40}$') | list | length == 6
        quiet: true

  tasks:
    - name: Inspect the exact SSH Key title before generation
      lit.foundational.onepassword_ssh_key_item:
        operation: plan
        cli_path: "{{ _onepassword.cli_path }}"
        cli_sha256: "{{ _onepassword.cli_sha256 }}"
        cli_version: "{{ _onepassword.cli_version }}"
        account_id: "{{ _onepassword.account_id }}"
        account_sign_in_address: "{{ _onepassword.account_sign_in_address }}"
        authorized_user_uuids: "{{ _onepassword.authorized_user_uuids }}"
        vault_id: "{{ _onepassword.vault_id }}"
        item_id: ""
        item_version: 0
        item_title: "{{ _identity.item_title }}"
        category: SSH Key
        tags: "{{ _identity.tags }}"
        subject: "{{ _identity.subject }}"
        schema_version: 1
        key_type: ed25519
        expected_fingerprint: ""
        allow_create: false
        approval_authority: {}
        approval: {}
        ssh_add_path: ""
        ssh_add_sha256: ""
        ssh_keygen_path: ""
        ssh_keygen_sha256: ""
        agent_socket_path: ""
      register: _before
      no_log: true

    - name: Require the exact title to be absent
      ansible.builtin.assert:
        that:
          - not (_before.exists | bool)
        fail_msg: >-
          The exact 1Password title already exists; review and pin it instead
          of generating another key.
        quiet: true

    - name: Sign the identity-bound one-time creation approval
      lit.foundational.onepassword_approval:
        approval_authority: "{{ _onepassword.approval_authority }}"
        binding: "{{ _contract }}"
        commit_shas: "{{ onepassword_ubuntu_access_commit_shas }}"
        execution_id_prefix: WBX-1P-UBUNTU-SSH
        operation: create-onepassword-ssh-key
        signing_agent_socket_path: "{{ _onepassword.ssh_agent.agent_socket_path }}"
        signing_ssh_add_path: "{{ _onepassword.ssh_agent.ssh_add_path }}"
        signing_ssh_add_sha256: "{{ _onepassword.ssh_agent.ssh_add_sha256 }}"
        target: "{{ _identity.subject }}"
        validity_seconds: 600
      register: _approval
      no_log: true

    - name: Generate the Ed25519 SSH key directly in 1Password
      ansible.builtin.shell:
        executable: /bin/zsh
        cmd: >-
          {{ _onepassword.cli_path | quote }} item create
          --account {{ _onepassword.account_id | quote }}
          --vault {{ _onepassword.vault_id | quote }}
          --category=ssh
          --title {{ _identity.item_title | quote }}
          --tags {{ (_identity.tags | join(',')) | quote }}
          --ssh-generate-key=ed25519
          {{ ('subject[text]=' ~ _identity.subject) | quote }}
          {{ 'schema_version[text]=1' | quote }}
          </dev/null >/dev/null
      register: _created
      failed_when: false
      no_log: true

    - name: Require successful closed-channel generation
      ansible.builtin.assert:
        that:
          - _created.rc | int == 0
        fail_msg: >-
          1Password SSH key generation failed with rc={{ _created.rc }}:
          {{ _created.stderr | default('no stderr') }}
        quiet: true

    - name: Read back only the public generated identity
      lit.foundational.onepassword_ssh_key_item:
        operation: plan
        cli_path: "{{ _onepassword.cli_path }}"
        cli_sha256: "{{ _onepassword.cli_sha256 }}"
        cli_version: "{{ _onepassword.cli_version }}"
        account_id: "{{ _onepassword.account_id }}"
        account_sign_in_address: "{{ _onepassword.account_sign_in_address }}"
        authorized_user_uuids: "{{ _onepassword.authorized_user_uuids }}"
        vault_id: "{{ _onepassword.vault_id }}"
        item_id: ""
        item_version: 0
        item_title: "{{ _identity.item_title }}"
        category: SSH Key
        tags: "{{ _identity.tags }}"
        subject: "{{ _identity.subject }}"
        schema_version: 1
        key_type: ed25519
        expected_fingerprint: ""
        allow_create: false
        approval_authority: {}
        approval: {}
        ssh_add_path: ""
        ssh_add_sha256: ""
        ssh_keygen_path: ""
        ssh_keygen_sha256: ""
        agent_socket_path: ""
      register: _generated
      no_log: true

    - name: Report only the public generated identity
      ansible.builtin.debug:
        msg:
          identity: "{{ _identity_name }}"
          item_title: "{{ _identity.item_title }}"
          item_id: "{{ _generated.item_id }}"
          item_version: "{{ _generated.item_version }}"
          public_key: "{{ _generated.public_key }}"
          fingerprint: "{{ _generated.fingerprint }}"
