---
- name: Create the controller bootstrap SSH keypair for native 1Password import
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true

  vars:
    ansible_become: false
    _controller_target: "{{ onepassword_controller_target | default('') }}"
    _target_vars: "{{ hostvars[_controller_target] | default({}) }}"
    _candidate: >-
      {{ _target_vars.onepassword_controller_approval_authority_candidate | default({}) }}
    _agent: "{{ _target_vars.hetzner_baremetal_onepassword.ssh_agent | default({}) }}"

  pre_tasks:
    - name: Require one exact target and a closed candidate contract
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit | string | trim == 'localhost'
          - _controller_target in groups['hetzner_baremetal']
          - _candidate is mapping
          - _candidate.keys() | list | sort == [
              'comment',
              'controller_gid',
              'controller_uid',
              'item_title',
              'private_key_path',
              'schema_version'
            ] | sort
          - _candidate.schema_version | int == 1
          - _candidate.controller_uid | int > 0
          - _candidate.controller_gid | int > 0
          - _candidate.private_key_path == '/Users/rene/Documents/.ssh/id_ed25519_lit_bootstrap'
          - _candidate.item_title == 'id_ed25519_lit_bootstrap'
          - _candidate.comment == 'id_ed25519_lit_bootstrap'
          - _agent.ssh_keygen_path == '/usr/bin/ssh-keygen'
          - _agent.ssh_keygen_sha256 is match('^[a-f0-9]{64}$')
        quiet: true

  tasks:
    - name: Ensure the private controller key directory exists
      ansible.builtin.file:
        path: "{{ _candidate.private_key_path | dirname }}"
        state: directory
        owner: "{{ _candidate.controller_uid }}"
        group: "{{ _candidate.controller_gid }}"
        mode: "0700"

    - name: Inspect the approved ssh-keygen executable
      ansible.builtin.stat:
        path: "{{ _agent.ssh_keygen_path }}"
        follow: true
        get_checksum: true
        checksum_algorithm: sha256
      register: _ssh_keygen

    - name: Require the exact approved ssh-keygen bytes
      ansible.builtin.assert:
        that:
          - _ssh_keygen.stat.exists | bool
          - _ssh_keygen.stat.isreg | bool
          - _ssh_keygen.stat.executable | bool
          - _ssh_keygen.stat.checksum == _agent.ssh_keygen_sha256
        quiet: true

    - name: Inspect both candidate keypair paths
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ _candidate.private_key_path }}"
        - "{{ _candidate.private_key_path }}.pub"
      register: _candidate_paths

    - name: Reject a partial or linked candidate keypair
      ansible.builtin.assert:
        that:
          - _candidate_paths.results[0].stat.exists == _candidate_paths.results[1].stat.exists
          - not (_candidate_paths.results[0].stat.islnk | default(false))
          - not (_candidate_paths.results[1].stat.islnk | default(false))
        quiet: true

    - name: Create the exact Ed25519 bootstrap keypair
      ansible.builtin.command:
        argv:
          - "{{ _agent.ssh_keygen_path }}"
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - "{{ _candidate.comment }}"
          - -f
          - "{{ _candidate.private_key_path }}"
        creates: "{{ _candidate.private_key_path }}"
      register: _bootstrap_keypair
      no_log: true

    - name: Enforce private ownership on both candidate key files
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ _candidate.controller_uid }}"
        group: "{{ _candidate.controller_gid }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ _candidate.private_key_path }}"
          mode: "0600"
        - path: "{{ _candidate.private_key_path }}.pub"
          mode: "0644"

    - name: Read the public bootstrap fingerprint
      ansible.builtin.command:
        argv:
          - "{{ _agent.ssh_keygen_path }}"
          - -E
          - sha256
          - -lf
          - "{{ _candidate.private_key_path }}.pub"
      register: _bootstrap_fingerprint
      changed_when: false

    - name: Report only the public candidate identity
      ansible.builtin.debug:
        msg:
          changed: "{{ _bootstrap_keypair.changed }}"
          item_title: "{{ _candidate.item_title }}"
          private_key_path: "{{ _candidate.private_key_path }}"
          fingerprint: >-
            {{ (_bootstrap_fingerprint.stdout | split)[1] }}
