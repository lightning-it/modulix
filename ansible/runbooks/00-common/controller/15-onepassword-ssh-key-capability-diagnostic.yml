---
- name: Inspect the installed 1Password SSH Key creation contract
  hosts: hetzner_baremetal
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true
  serial: 1

  vars:
    ansible_become: false

  pre_tasks:
    - name: Require one exact target
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit | string | trim == inventory_hostname
        quiet: true

    - name: Inspect the approved 1Password CLI
      ansible.builtin.stat:
        path: "{{ hetzner_baremetal_onepassword.cli_path }}"
        follow: true
        get_checksum: true
        checksum_algorithm: sha256
      register: _onepassword_cli

    - name: Require the exact approved CLI bytes
      ansible.builtin.assert:
        that:
          - _onepassword_cli.stat.exists | bool
          - _onepassword_cli.stat.isreg | bool
          - _onepassword_cli.stat.executable | bool
          - _onepassword_cli.stat.checksum == hetzner_baremetal_onepassword.cli_sha256
        quiet: true

  tasks:
    - name: Read the public SSH Key creation options
      ansible.builtin.command:
        argv:
          - "{{ hetzner_baremetal_onepassword.cli_path }}"
          - item
          - create
          - --help
      register: _onepassword_item_create_help
      changed_when: false

    - name: Report only the SSH Key capability lines
      ansible.builtin.debug:
        msg: >-
          {{
            _onepassword_item_create_help.stdout_lines
            | select('search', '(?i)ssh|import|generate|template|category')
            | list
          }}
