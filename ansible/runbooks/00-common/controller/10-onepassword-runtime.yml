---
# Install one digest-pinned 1Password CLI and approval verifier boundary on a
# macOS Ansible controller. Environment-specific paths and public identities
# belong to inventory; no 1Password item or secret is read by this runbook.
- name: Prepare a trusted macOS 1Password controller runtime
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true
  serial: 1

  vars:
    _controller_target: "{{ onepassword_controller_target | default('') }}"
    _controller_target_vars: "{{ hostvars[_controller_target] | default({}) }}"
    _controller_runtime: >-
      {{ _controller_target_vars.onepassword_controller_runtime | default({}) }}
    _controller_runtime_action: >-
      {{ onepassword_controller_runtime_action | default('plan') }}
    _approval_bootstrap: >-
      {{
        _controller_target_vars.wunderbox_controller_approval_authority_bootstrap
        | default({})
      }}
    _onepassword_contract: >-
      {{ _controller_target_vars.hetzner_baremetal_onepassword | default({}) }}

  pre_tasks:
    - name: Require one exact inventory target and a closed controller contract
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit | string | trim == 'localhost'
          - _controller_target in groups['hetzner_baremetal']
          - _controller_runtime_action in ['plan', 'apply']
          - _controller_runtime_action != 'apply' or not ansible_check_mode
          - _controller_runtime is mapping
          - _controller_runtime.keys() | list | sort == [
              'allowed_signers_path',
              'cli_destination_path',
              'cli_sha256',
              'cli_source_path',
              'controller_gid',
              'controller_uid',
              'replay_directory'
            ] | sort
          - _controller_runtime.cli_source_path is match('^/')
          - _controller_runtime.cli_destination_path is match('^/')
          - _controller_runtime.cli_source_path != _controller_runtime.cli_destination_path
          - _controller_runtime.cli_sha256 is match('^[0-9a-f]{64}$')
          - _controller_runtime.allowed_signers_path is match('^/')
          - _controller_runtime.replay_directory is match('^/')
          - _controller_runtime.controller_uid | int > 0
          - _controller_runtime.controller_gid | int > 0
          - _approval_bootstrap is mapping
          - _approval_bootstrap.keys() | list | sort == [
              'allowed_signers_sha256',
              'identity',
              'public_key',
              'schema_version'
            ] | sort
          - _approval_bootstrap.schema_version | int == 1
          - >-
            _approval_bootstrap.identity
            is match('^[A-Za-z0-9][A-Za-z0-9._@+-]{0,127}$')
          - >-
            _approval_bootstrap.public_key
            is match('^ssh-ed25519 [A-Za-z0-9+/]+={0,2}$')
          - >-
            _approval_bootstrap.allowed_signers_sha256
            is match('^[0-9a-f]{64}$')
          - >-
            _onepassword_contract.cli_path
            == _controller_runtime.cli_destination_path
          - >-
            _onepassword_contract.cli_sha256
            == _controller_runtime.cli_sha256
          - >-
            _onepassword_contract.approval_authority.allowed_signers_path
            == _controller_runtime.allowed_signers_path
          - >-
            _onepassword_contract.approval_authority.allowed_signers_sha256
            == _approval_bootstrap.allowed_signers_sha256
          - >-
            _onepassword_contract.approval_authority.replay_directory
            == _controller_runtime.replay_directory
        fail_msg: >-
          Use --limit with one exact target and provide a complete, closed,
          mutually consistent controller runtime and public approval boundary.
        quiet: true
      tags: [always]

    - name: Inspect the approved 1Password CLI source
      ansible.builtin.stat:
        path: "{{ _controller_runtime.cli_source_path }}"
        follow: true
        get_checksum: true
        checksum_algorithm: sha256
      register: _onepassword_cli_source
      tags: [always]

    - name: Require the exact approved executable source bytes
      ansible.builtin.assert:
        that:
          - _onepassword_cli_source.stat.exists | bool
          - _onepassword_cli_source.stat.isreg | bool
          - _onepassword_cli_source.stat.executable | bool
          - >-
            _onepassword_cli_source.stat.checksum
            == _controller_runtime.cli_sha256
        fail_msg: >-
          The local 1Password CLI source is absent, non-executable, or does not
          match the approved SHA-256 digest.
        quiet: true
      tags: [always]

    - name: Derive the exact public allowed-signers document
      ansible.builtin.set_fact:
        _onepassword_allowed_signers_content: |
          {{ _approval_bootstrap.identity }} {{ _approval_bootstrap.public_key }}
      tags: [always]

    - name: Require the approved allowed-signers document digest
      ansible.builtin.assert:
        that:
          - >-
            _onepassword_allowed_signers_content
            | hash('sha256')
            == _approval_bootstrap.allowed_signers_sha256
        fail_msg: >-
          The public approval identity does not produce the approved
          allowed-signers SHA-256 digest.
        quiet: true
      tags: [always]

  tasks:
    - name: Create the controller-owned consumer replay directory
      ansible.builtin.file:
        path: "{{ _controller_runtime.replay_directory }}"
        state: directory
        owner: "{{ _controller_runtime.controller_uid }}"
        group: "{{ _controller_runtime.controller_gid }}"
        mode: "0700"
      become: false
      when: _controller_runtime_action == 'apply'

    - name: Create root-owned controller runtime directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: wheel
        mode: "0755"
      become: true
      when: _controller_runtime_action == 'apply'
      loop:
        - "{{ _controller_runtime.cli_destination_path | dirname }}"
        - "{{ _controller_runtime.allowed_signers_path | dirname }}"

    - name: Install the digest-pinned 1Password CLI bytes
      ansible.builtin.copy:
        src: "{{ _controller_runtime.cli_source_path }}"
        dest: "{{ _controller_runtime.cli_destination_path }}"
        remote_src: true
        owner: root
        group: wheel
        mode: "0755"
      become: true
      when: _controller_runtime_action == 'apply'

    - name: Install the immutable public approval signer boundary
      ansible.builtin.copy:
        content: "{{ _onepassword_allowed_signers_content }}"
        dest: "{{ _controller_runtime.allowed_signers_path }}"
        owner: root
        group: wheel
        mode: "0444"
      become: true
      when: _controller_runtime_action == 'apply'

  post_tasks:
    - name: Read back the installed controller trust files
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      become: true
      loop:
        - path: "{{ _controller_runtime.cli_destination_path }}"
          sha256: "{{ _controller_runtime.cli_sha256 }}"
          mode: "0755"
        - path: "{{ _controller_runtime.allowed_signers_path }}"
          sha256: "{{ _approval_bootstrap.allowed_signers_sha256 }}"
          mode: "0444"
      register: _onepassword_controller_readback
      when: _controller_runtime_action == 'apply'

    - name: Require exact root-owned controller trust readback
      ansible.builtin.assert:
        that:
          - item.stat.exists | bool
          - item.stat.isreg | bool
          - not item.stat.islnk | bool
          - item.stat.uid | int == 0
          - item.stat.gid | int == 0
          - item.stat.mode == item.item.mode
          - item.stat.checksum == item.item.sha256
        fail_msg: >-
          An installed controller trust file differs from its exact owner,
          mode, type, or SHA-256 contract.
        quiet: true
      become: true
      loop: "{{ _onepassword_controller_readback.results }}"
      when: _controller_runtime_action == 'apply'

    - name: Read back the consumer replay directory
      ansible.builtin.stat:
        path: "{{ _controller_runtime.replay_directory }}"
        follow: false
      register: _onepassword_replay_readback
      when: _controller_runtime_action == 'apply'

    - name: Require the controller identity to own the private replay directory
      ansible.builtin.assert:
        that:
          - _onepassword_replay_readback.stat.exists | bool
          - _onepassword_replay_readback.stat.isdir | bool
          - not _onepassword_replay_readback.stat.islnk | bool
          - _onepassword_replay_readback.stat.mode == '0700'
          - >-
            _onepassword_replay_readback.stat.uid | int
            == _controller_runtime.controller_uid | int
          - >-
            _onepassword_replay_readback.stat.gid | int
            == _controller_runtime.controller_gid | int
        fail_msg: >-
          The consumer replay directory is not a controller-owned, private,
          non-symlink directory.
        quiet: true
      when: _controller_runtime_action == 'apply'

    - name: Report the secret-free controller runtime identity
      ansible.builtin.debug:
        msg:
          action: "{{ _controller_runtime_action }}"
          target: "{{ _controller_target }}"
          cli_path: "{{ _controller_runtime.cli_destination_path }}"
          cli_sha256: "{{ _controller_runtime.cli_sha256 }}"
          allowed_signers_path: "{{ _controller_runtime.allowed_signers_path }}"
          allowed_signers_sha256: >-
            {{ _approval_bootstrap.allowed_signers_sha256 }}
          replay_directory: "{{ _controller_runtime.replay_directory }}"
