---
- name: Diagnose a 1Password SSH key metadata edit without mutation
  hosts: hetzner_baremetal
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true
  serial: 1

  vars:
    ansible_become: false

  pre_tasks:
    - name: Require one exact inventory target
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit | string | trim == inventory_hostname
          - onepassword_diagnostic_item_id | default('') | length == 26
        quiet: true

  tasks:
    - name: Execute the non-mutating metadata diagnostic
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../../../scripts/onepassword-item-tag-diagnostic.py"
          - --op
          - "{{ hetzner_baremetal_onepassword.cli_path }}"
          - --account-id
          - "{{ hetzner_baremetal_onepassword.account_id }}"
          - --vault-id
          - "{{ hetzner_baremetal_onepassword.vault_id }}"
          - --item-id
          - "{{ onepassword_diagnostic_item_id }}"
          - --tags
          - >-
            {{ wunderbox_controller_approval_authority_bootstrap.onepassword_item.tags
               | join(',') }}
      register: _diagnostic_raw
      changed_when: false
      no_log: true

    - name: Parse the bounded diagnostic result
      ansible.builtin.set_fact:
        _diagnostic: "{{ _diagnostic_raw.stdout | from_json }}"
      no_log: true

    - name: Report only the secret-free diagnostic classification
      ansible.builtin.debug:
        msg:
          schema_version: "{{ _diagnostic.schema_version }}"
          operation: "{{ _diagnostic.operation }}"
          returncode: "{{ _diagnostic.returncode }}"
          stderr_length: "{{ _diagnostic.stderr_length }}"
          stderr_sha256: "{{ _diagnostic.stderr_sha256 }}"
          sanitized_stderr: "{{ _diagnostic.sanitized_stderr }}"
          classification: "{{ _diagnostic.classification }}"
