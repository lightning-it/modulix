---
- name: Configure the governed 1Password SSH Agent policy on the controller
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true
  serial: 1

  vars:
    _controller_target: "{{ onepassword_controller_target | default('') }}"
    _controller_target_vars: "{{ hostvars[_controller_target] | default({}) }}"
    _agent_policy: >-
      {{ _controller_target_vars.onepassword_controller_ssh_agent_policy | default({}) }}
    _onepassword_contract: >-
      {{ _controller_target_vars.hetzner_baremetal_onepassword | default({}) }}
    _approval_bootstrap: >-
      {{
        _controller_target_vars.wunderbox_controller_approval_authority_bootstrap
        | default({})
      }}
    _agent_policy_action: >-
      {{ onepassword_controller_ssh_agent_policy_action | default('plan') }}
    _agent_host_patterns: >-
      {{
        (
          groups[_agent_policy.inventory_group]
          + groups[_agent_policy.inventory_group]
            | map('extract', hostvars, 'ansible_host')
            | list
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | sort
        | list
      }}

  pre_tasks:
    - name: Require one exact target and a closed SSH Agent policy contract
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit | string | trim == 'localhost'
          - _controller_target in groups['hetzner_baremetal']
          - _agent_policy_action in ['plan', 'apply']
          - _agent_policy_action != 'apply' or not ansible_check_mode
          - _agent_policy is mapping
          - _agent_policy.keys() | list | sort == [
              'agent_config_path',
              'controller_gid',
              'controller_uid',
              'inventory_group',
              'item_title',
              'schema_version',
              'ssh_config_path',
              'ssh_include_path',
              'vault_name'
            ] | sort
          - _agent_policy.schema_version | int == 1
          - _agent_policy.controller_uid | int > 0
          - _agent_policy.controller_gid | int > 0
          - _agent_policy.inventory_group == 'hetzner_baremetal'
          - _agent_policy.inventory_group in groups
          - _agent_policy.agent_config_path is match('^/[^\r\n]+/agent\.toml$')
          - _agent_policy.ssh_config_path is match('^/[^\r\n]+/\.ssh/config$')
          - _agent_policy.ssh_include_path is match('^/[^\r\n]+\.conf$')
          - >-
            _agent_policy.ssh_include_path | dirname
            == _agent_policy.ssh_config_path | dirname ~ '/config.d'
          - _agent_policy.vault_name == 'LIT-Platform-and-Infrastructure-Services'
          - _agent_policy.item_title == _approval_bootstrap.onepassword_item.item_title
          - >-
            _onepassword_contract.ssh_agent.agent_socket_path
            is match('^/[^\r\n]+/agent\.sock$')
          - _agent_host_patterns | length == groups[_agent_policy.inventory_group] | length * 2
          - _agent_host_patterns | select('match', '^[A-Za-z0-9.:-]+$') | list | length
            == _agent_host_patterns | length
        fail_msg: >-
          Use --limit localhost with one exact target and the closed,
          inventory-bound 1Password SSH Agent policy.
        quiet: true

    - name: Inspect the pinned SSH client executable
      ansible.builtin.stat:
        path: "{{ _onepassword_contract.ssh_agent.ssh_path }}"
        follow: true
        get_checksum: true
        checksum_algorithm: sha256
      register: _agent_policy_ssh_binary

    - name: Require the exact approved SSH client bytes
      ansible.builtin.assert:
        that:
          - _agent_policy_ssh_binary.stat.exists | bool
          - _agent_policy_ssh_binary.stat.isreg | bool
          - _agent_policy_ssh_binary.stat.executable | bool
          - >-
            _agent_policy_ssh_binary.stat.checksum
            == _onepassword_contract.ssh_agent.ssh_sha256
        quiet: true

  tasks:
    - name: Ensure the controller policy directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ _agent_policy.controller_uid }}"
        group: "{{ _agent_policy.controller_gid }}"
        mode: "0700"
      loop:
        - "{{ _agent_policy.agent_config_path | dirname }}"
        - "{{ _agent_policy.ssh_config_path | dirname }}"
        - "{{ _agent_policy.ssh_include_path | dirname }}"
      when: _agent_policy_action == 'apply'

    - name: Allow the exact LIT-PIS SSH key in the 1Password Agent
      ansible.builtin.blockinfile:
        path: "{{ _agent_policy.agent_config_path }}"
        create: true
        owner: "{{ _agent_policy.controller_uid }}"
        group: "{{ _agent_policy.controller_gid }}"
        mode: "0600"
        marker: "# {mark} LIT-PIS MANAGED 1PASSWORD SSH KEY"
        insertafter: EOF
        block: |
          [[ssh-keys]]
          vault = "{{ _agent_policy.vault_name }}"
          item = "{{ _agent_policy.item_title }}"
      when: _agent_policy_action == 'apply'

    - name: Install the exact target-scoped 1Password IdentityAgent policy
      ansible.builtin.copy:
        dest: "{{ _agent_policy.ssh_include_path }}"
        owner: "{{ _agent_policy.controller_uid }}"
        group: "{{ _agent_policy.controller_gid }}"
        mode: "0600"
        content: |
          Host {{ _agent_host_patterns | join(' ') }}
              IdentityAgent "{{ _onepassword_contract.ssh_agent.agent_socket_path }}"
      when: _agent_policy_action == 'apply'

    - name: Load the governed SSH include before existing host declarations
      ansible.builtin.blockinfile:
        path: "{{ _agent_policy.ssh_config_path }}"
        create: true
        owner: "{{ _agent_policy.controller_uid }}"
        group: "{{ _agent_policy.controller_gid }}"
        mode: "0600"
        marker: "# {mark} LIT-PIS MANAGED SSH AGENT INCLUDE"
        insertbefore: BOF
        block: |
          Include {{ _agent_policy.ssh_include_path }}
      when: _agent_policy_action == 'apply'

  post_tasks:
    - name: Read back the governed controller SSH Agent files
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      loop:
        - "{{ _agent_policy.agent_config_path }}"
        - "{{ _agent_policy.ssh_config_path }}"
        - "{{ _agent_policy.ssh_include_path }}"
      register: _agent_policy_readback
      when: _agent_policy_action == 'apply'

    - name: Require private, controller-owned, non-linked policy files
      ansible.builtin.assert:
        that:
          - item.stat.exists | bool
          - item.stat.isreg | bool
          - not item.stat.islnk | bool
          - item.stat.nlink | int == 1
          - item.stat.uid | int == _agent_policy.controller_uid | int
          - item.stat.gid | int == _agent_policy.controller_gid | int
          - item.stat.mode == '0600'
        quiet: true
      loop: "{{ _agent_policy_readback.results }}"
      when: _agent_policy_action == 'apply'

    - name: Resolve the effective SSH configuration without network access
      ansible.builtin.command:
        argv:
          - "{{ _onepassword_contract.ssh_agent.ssh_path }}"
          - -G
          - "{{ _controller_target }}"
      register: _agent_policy_effective_ssh
      changed_when: false
      when: _agent_policy_action == 'apply'

    - name: Require the effective target to use the exact 1Password Agent socket
      ansible.builtin.assert:
        that:
          - >-
            (
              _agent_policy_effective_ssh.stdout_lines
              | select('match', '^identityagent ')
              | list
            )
            == [
              'identityagent '
              ~ _onepassword_contract.ssh_agent.agent_socket_path
            ]
        quiet: true
      when: _agent_policy_action == 'apply'

    - name: Report the secret-free controller SSH Agent policy
      ansible.builtin.debug:
        msg:
          action: "{{ _agent_policy_action }}"
          target: "{{ _controller_target }}"
          vault: "{{ _agent_policy.vault_name }}"
          item: "{{ _agent_policy.item_title }}"
          agent_socket: "{{ _onepassword_contract.ssh_agent.agent_socket_path }}"
          host_patterns: "{{ _agent_host_patterns }}"
          effective_identity_agent_verified: >-
            {{ _agent_policy_action == 'apply' }}
