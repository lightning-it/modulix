---
# -----------------------------------------------------------------------------
# Ubuntu 24 - CIS Hardening
#
# Purpose:
# - Apply CIS baseline via lit.ubuntu.cis_ubuntu24
# - Keep upstream ansible-lockdown wiring behind the lit.ubuntu wrapper contract
# -----------------------------------------------------------------------------
- name: CIS hardening (Ubuntu 24)
  hosts: ubuntu24_cis_targets
  gather_facts: true
  become: true
  any_errors_fatal: true
  order: inventory
  serial: 1

  pre_tasks:
    - name: Require an explicit class limit for CIS hardening
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - >-
            (
              ansible_play_hosts_all
              | intersect(groups['ubuntu24_cis_servers'] | default([]))
              | length
            ) == (ansible_play_hosts_all | length)
            or
            (
              ansible_play_hosts_all
              | intersect(groups['ubuntu24_cis_workstations'] | default([]))
              | length
            ) == (ansible_play_hosts_all | length)
        fail_msg: >-
          Limit CIS hardening to one inventory class (servers or workstations)
          and use its matching native profile tag.
      tags: always

    - name: Validate the pinned CIS runtime
      ansible.builtin.import_tasks:
        file: tasks/validate-cis-runtime.yml
      tags: always

    - name: Ensure the journald drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: cis_ubuntu24_syslog_service | default('journald') == 'journald'
      tags: always

    - name: Configure bounded journald retention for the lab baseline
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/60-lit-cis-retention.conf
        content: |
          [Journal]
          SystemMaxUse=1G
          RuntimeMaxUse=256M
          MaxRetentionSec=1month
        owner: root
        group: root
        mode: '0644'
      when: cis_ubuntu24_syslog_service | default('journald') == 'journald'
      notify: Restart systemd-journald
      tags: always

  handlers:
    - name: Restart systemd-journald
      ansible.builtin.systemd_service:
        name: systemd-journald.service
        state: restarted

  tasks:
    - name: CIS hardening
      ansible.builtin.import_role:
        name: lit.ubuntu.cis_ubuntu24

  post_tasks:
    - name: Wait for the managed SSH connection after CIS handlers
      ansible.builtin.wait_for_connection:
        connect_timeout: 10
        sleep: 2
        timeout: 120
      tags: always

    - name: Validate the effective OpenSSH configuration after CIS hardening
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      changed_when: false
      tags: always
