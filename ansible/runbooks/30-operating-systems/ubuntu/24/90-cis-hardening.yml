---
# -----------------------------------------------------------------------------
# Ubuntu 24 - CIS Hardening
#
# Purpose:
# - Apply CIS baseline via lit.ubuntu.cis_ubuntu24
# - Keep upstream ansible-lockdown wiring behind the lit.ubuntu wrapper contract
# -----------------------------------------------------------------------------
- name: CIS hardening (Ubuntu 24)
  hosts: ubuntu24_cis_targets
  gather_facts: true
  become: true
  any_errors_fatal: true

  tasks:
    - name: CIS hardening
      ansible.builtin.import_role:
        name: lit.ubuntu.cis_ubuntu24
      tags: [cis, compliance]
