---
# Leave Rescue only after explicit approval, verify the generated Dropbear and
# OpenSSH host keys against the fingerprints stored on the new /boot, and wait
# while the operator performs the one-time interactive recovery unlock.
- name: Perform the first encrypted Ubuntu boot
  hosts: hetzner_baremetal
  gather_facts: false
  become: false
  any_errors_fatal: true
  serial: 1

  vars:
    ansible_user: root
    ansible_become: false
    ansible_ssh_common_args: >-
      -o UserKnownHostsFile={{ hetzner_baremetal_rescue_known_hosts_path }}
      -o StrictHostKeyChecking=yes

  pre_tasks:
    - name: Require one explicit host and boot confirmation
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - >-
            hetzner_baremetal_secret_backend
            in ['ansible_vault_bootstrap', 'hashicorp_vault']
          - >-
            hetzner_first_boot_confirmation | default('')
            == 'BOOT:' ~ inventory_hostname
        fail_msg: >-
          Use --limit with one exact host or single-host group and pass
          hetzner_first_boot_confirmation=BOOT:<inventory-hostname>.
      tags: [always]

  tasks:
    - name: Read generated first-boot fingerprints from the new boot filesystem
      ansible.builtin.shell: |
        set -euo pipefail
        work="$(mktemp -d /mnt/lit-first-boot-keys.XXXXXX)"
        mounted=false
        cleanup() {
          if ${mounted}; then
            umount "${work}"
          fi
          rmdir "${work}"
        }
        trap cleanup EXIT

        found=0
        while read -r device fstype type; do
          test "${fstype}" = ext4 || continue
          case "${type}" in
            part|raid1|lvm) ;;
            *) continue ;;
          esac
          mount -o ro "${device}" "${work}" || continue
          mounted=true
          if test -s "${work}/lit-first-boot-hostkey-fingerprints"; then
            cat "${work}/lit-first-boot-hostkey-fingerprints"
            found=$((found + 1))
          fi
          umount "${work}"
          mounted=false
        done < <(lsblk -rpn -o PATH,FSTYPE,TYPE | sort -u)
        test "${found}" -eq 1
      args:
        executable: /bin/bash
      register: _first_boot_expected_fingerprints
      changed_when: false

    - name: Decode the expected first-boot fingerprints
      ansible.builtin.set_fact:
        _first_boot_dropbear_fingerprint: >-
          {{
            _first_boot_expected_fingerprints.stdout
            | regex_search(
                '(?m)^LIT_DROPBEAR_HOSTKEY_SHA256=(SHA256:[^\n]+)$',
                '\1'
              )
            | first
          }}
        _first_boot_openssh_fingerprint: >-
          {{
            _first_boot_expected_fingerprints.stdout
            | regex_search(
                '(?m)^LIT_OPENSSH_HOSTKEY_SHA256=(SHA256:[^\n]+)$',
                '\1'
              )
            | first
          }}
      changed_when: false

    - name: Reboot from Rescue into encrypted Ubuntu
      ansible.builtin.command:
        argv:
          - systemctl
          - reboot
      async: 1
      poll: 0
      changed_when: true
      failed_when: false

    - name: Wait for Dropbear recovery SSH
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ luks_unlock_dropbear_port | int }}"
        state: started
        connect_timeout: 5
        timeout: 900
      delegate_to: localhost
      become: false

    - name: Scan the generated Dropbear host key
      ansible.builtin.command:
        argv:
          - ssh-keyscan
          - -T
          - "10"
          - -p
          - "{{ luks_unlock_dropbear_port | int }}"
          - -t
          - ed25519
          - "{{ ansible_host }}"
      delegate_to: localhost
      become: false
      register: _first_boot_dropbear_keyscan
      changed_when: false

    - name: Create a temporary Dropbear key file
      ansible.builtin.tempfile:
        state: file
        suffix: .pub
      delegate_to: localhost
      become: false
      register: _first_boot_dropbear_key_file
      changed_when: false

    - name: Validate and pin the generated Dropbear key
      block:
        - name: Store the scanned Dropbear key
          ansible.builtin.copy:
            content: "{{ _first_boot_dropbear_keyscan.stdout | trim }}\n"
            dest: "{{ _first_boot_dropbear_key_file.path }}"
            mode: "0600"
          delegate_to: localhost
          become: false
          changed_when: false

        - name: Calculate the Dropbear fingerprint
          ansible.builtin.command:
            argv:
              - ssh-keygen
              - -E
              - sha256
              - -lf
              - "{{ _first_boot_dropbear_key_file.path }}"
          delegate_to: localhost
          become: false
          register: _first_boot_dropbear_fingerprint_actual
          changed_when: false

        - name: Require the generated Dropbear fingerprint
          ansible.builtin.assert:
            that:
              - >-
                _first_boot_dropbear_fingerprint_actual.stdout.split()[1]
                == _first_boot_dropbear_fingerprint
            fail_msg: >-
              The first-boot Dropbear host key is not the generated key.

        - name: Pin the generated Dropbear host key
          ansible.builtin.known_hosts:
            path: "{{ hetzner_baremetal_rescue_known_hosts_path }}"
            name: >-
              {{
                '[' ~ inventory_hostname ~ ']:'
                ~ (luks_unlock_dropbear_port | string)
              }}
            key: >-
              {{
                '[' ~ inventory_hostname ~ ']:'
                ~ (luks_unlock_dropbear_port | string)
                ~ ',[' ~ ansible_host ~ ']:'
                ~ (luks_unlock_dropbear_port | string)
                ~ ' '
                ~ _first_boot_dropbear_keyscan.stdout.split(' ', 1)[1]
              }}
            state: present
          delegate_to: localhost
          become: false
      always:
        - name: Remove the temporary Dropbear key file
          ansible.builtin.file:
            path: "{{ _first_boot_dropbear_key_file.path }}"
            state: absent
          delegate_to: localhost
          become: false
          changed_when: false

    - name: Pause for the operator-triggered no-output encrypted-root unlock
      ansible.builtin.pause:
        prompt: >-
          The generated Dropbear key is verified and pinned. In a second
          terminal run the dedicated 10-hetzner-bootstrap-unlock.yml command
          from the private operator guide for this exact host. It decrypts the
          bootstrap escrow only in memory and supplies the passphrase through
          SSH stdin under no_log. After it reports success, press Enter here.

    - name: Wait for installed OpenSSH
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        state: started
        connect_timeout: 5
        timeout: 900
      delegate_to: localhost
      become: false

    - name: Scan the generated OpenSSH host key
      ansible.builtin.command:
        argv:
          - ssh-keyscan
          - -T
          - "10"
          - -t
          - ed25519
          - "{{ ansible_host }}"
      delegate_to: localhost
      become: false
      register: _first_boot_openssh_keyscan
      changed_when: false

    - name: Create a temporary OpenSSH key file
      ansible.builtin.tempfile:
        state: file
        suffix: .pub
      delegate_to: localhost
      become: false
      register: _first_boot_openssh_key_file
      changed_when: false

    - name: Validate and pin the generated OpenSSH key
      block:
        - name: Store the scanned OpenSSH key
          ansible.builtin.copy:
            content: "{{ _first_boot_openssh_keyscan.stdout | trim }}\n"
            dest: "{{ _first_boot_openssh_key_file.path }}"
            mode: "0600"
          delegate_to: localhost
          become: false
          changed_when: false
        - name: Calculate the OpenSSH fingerprint
          ansible.builtin.command:
            argv:
              - ssh-keygen
              - -E
              - sha256
              - -lf
              - "{{ _first_boot_openssh_key_file.path }}"
          delegate_to: localhost
          become: false
          register: _first_boot_openssh_fingerprint_actual
          changed_when: false

        - name: Require the generated OpenSSH fingerprint
          ansible.builtin.assert:
            that:
              - >-
                _first_boot_openssh_fingerprint_actual.stdout.split()[1]
                == _first_boot_openssh_fingerprint
            fail_msg: "The installed OpenSSH host key is not the generated key."

        - name: Remove the previous Rescue hostname key
          ansible.builtin.known_hosts:
            path: "{{ hetzner_baremetal_rescue_known_hosts_path }}"
            name: "{{ inventory_hostname }}"
            state: absent
          delegate_to: localhost
          become: false

        - name: Remove the previous Rescue address key
          ansible.builtin.known_hosts:
            path: "{{ hetzner_baremetal_rescue_known_hosts_path }}"
            name: "{{ ansible_host }}"
            state: absent
          delegate_to: localhost
          become: false

        - name: Pin the generated installed OpenSSH host key
          ansible.builtin.known_hosts:
            path: "{{ hetzner_baremetal_rescue_known_hosts_path }}"
            name: "{{ inventory_hostname }}"
            key: >-
              {{ inventory_hostname }},{{ ansible_host }}
              {{ _first_boot_openssh_keyscan.stdout.split(' ', 1)[1] }}
            state: present
          delegate_to: localhost
          become: false
      always:
        - name: Remove the temporary OpenSSH key file
          ansible.builtin.file:
            path: "{{ _first_boot_openssh_key_file.path }}"
            state: absent
          delegate_to: localhost
          become: false
          changed_when: false
