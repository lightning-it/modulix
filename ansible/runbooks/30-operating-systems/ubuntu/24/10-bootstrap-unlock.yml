---
# Submit one Ansible Vault bootstrap recovery passphrase to the already pinned
# Dropbear cryptroot-unlock session without placing it in argv, env, stdout, or
# a plaintext file. This helper never reboots and supports one exact host only.
- name: Perform one operator-authorized bootstrap cryptroot unlock
  hosts: hetzner_baremetal
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true
  serial: 1

  pre_tasks:
    - name: Require one exact host, backend, and unlock confirmation
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit | string | trim == inventory_hostname
          - >-
            hetzner_baremetal_secret_backend == 'ansible_vault_bootstrap'
          - >-
            hetzner_bootstrap_unlock_confirmation | default('')
            == 'UNLOCK:' ~ inventory_hostname
        fail_msg: >-
          Use --limit with one exact inventory FQDN, select the
          ansible_vault_bootstrap backend, and pass
          hetzner_bootstrap_unlock_confirmation=UNLOCK:<inventory-hostname>.
        quiet: true
      tags: [always]

    - name: Check the pinned known-hosts file
      ansible.builtin.stat:
        path: "{{ hetzner_baremetal_rescue_known_hosts_path }}"
      register: _hetzner_bootstrap_unlock_known_hosts
      changed_when: false

    - name: Require the pinned Dropbear known-hosts file
      ansible.builtin.assert:
        that:
          - _hetzner_bootstrap_unlock_known_hosts.stat.exists | default(false)
          - _hetzner_bootstrap_unlock_known_hosts.stat.isreg | default(false)
        fail_msg: >-
          The pinned Dropbear known-hosts file is missing. Keep the first-boot
          runbook paused after it verifies and pins the generated host key.
        quiet: true

  tasks:
    - name: Resolve the Ansible Vault bootstrap recovery secret
      ansible.builtin.include_tasks: >-
        ../../../00-common/tasks/resolve-recovery-secret.yml
      no_log: true

    - name: Submit the recovery passphrase through pinned SSH stdin
      ansible.builtin.command:
        argv:
          - ssh
          - -T
          - -o
          - BatchMode=yes
          - -o
          - >-
            UserKnownHostsFile={{ hetzner_baremetal_rescue_known_hosts_path }}
          - -o
          - StrictHostKeyChecking=yes
          - -p
          - "{{ luks_unlock_dropbear_port | int }}"
          - "root@{{ inventory_hostname }}"
        stdin: "{{ _hetzner_baremetal_recovery_passphrase }}"
        # cryptroot-unlock's non-interactive path copies stdin byte-for-byte
        # into its passphrase FIFO. Do not append a newline to the secret.
        stdin_add_newline: false
      register: _hetzner_bootstrap_unlock_result
      changed_when: true
      no_log: true

    - name: Report successful no-output encrypted-root unlock
      ansible.builtin.debug:
        msg: >-
          cryptroot-unlock completed successfully for {{ inventory_hostname }};
          no recovery passphrase or unlock output was displayed or persisted.
