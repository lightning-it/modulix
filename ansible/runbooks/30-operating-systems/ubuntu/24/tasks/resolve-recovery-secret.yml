---
# Resolve one host's recovery secret from the explicitly selected backend.
# Callers must keep every task that consumes the returned facts under no_log.
- name: Validate the recovery-secret backend selector
  ansible.builtin.assert:
    that:
      - >-
        hetzner_baremetal_secret_backend
        in ['ansible_vault_bootstrap', 'hashicorp_vault']
    fail_msg: >-
      hetzner_baremetal_secret_backend must be exactly
      ansible_vault_bootstrap or hashicorp_vault.
    quiet: true

- name: Validate the Ansible Vault bootstrap contract
  ansible.builtin.assert:
    that:
      - hetzner_baremetal_ansible_vault is mapping
      - >-
        hetzner_baremetal_ansible_vault.schema_version
        | default(0) | int == 1
      - >-
        hetzner_baremetal_ansible_vault.recovery_passphrase_length
        | default(0) | int >= 40
      - >-
        hetzner_baremetal_ansible_vault_secret_path
        | default('', true) | length > 0
      - >-
        hetzner_baremetal_vault.recovery_passphrase_field
        | default('', true) | length > 0
      - >-
        hetzner_baremetal_vault.recovery_passphrase_field
        not in ['schema_version', 'subject']
      - lookup('ansible.builtin.env', 'PWD') | length > 0
      - >-
        lookup(
          'ansible.builtin.env',
          'ANSIBLE_VAULT_PASSWORD_FILE'
        ) | length > 0
    fail_msg: "The Ansible Vault bootstrap inventory contract is incomplete."
    quiet: true
  no_log: true

- name: Resolve canonical Ansible Vault bootstrap paths
  ansible.builtin.set_fact:
    _hetzner_recovery_resolver_root_canonical: >-
      {{ (lookup('ansible.builtin.env', 'PWD') ~ '/.secrets') | realpath }}
    _hetzner_recovery_resolver_path_canonical: >-
      {{ hetzner_baremetal_ansible_vault_secret_path | realpath }}
    _hetzner_recovery_resolver_path_normalized: >-
      {{ hetzner_baremetal_ansible_vault_secret_path | normpath }}
    _hetzner_recovery_resolver_controller_uid: >-
      {{ lookup('ansible.builtin.pipe', 'id -u') | int }}
  no_log: true

- name: Require the bootstrap document below the controller .secrets root
  ansible.builtin.assert:
    that:
      - _hetzner_recovery_resolver_root_canonical | length > 1
      - _hetzner_recovery_resolver_path_normalized is match('^/')
      - >-
        _hetzner_recovery_resolver_path_canonical
        != _hetzner_recovery_resolver_root_canonical
      - >-
        _hetzner_recovery_resolver_path_canonical.startswith(
          _hetzner_recovery_resolver_root_canonical ~ '/'
        )
    fail_msg: >-
      The canonical encrypted bootstrap document path must remain below the
      execution workspace .secrets directory.
    quiet: true
  no_log: true

- name: Check the bootstrap document and Ansible Vault password file
  ansible.builtin.stat:
    path: "{{ item.path }}"
    get_checksum: "{{ item.get_checksum }}"
    checksum_algorithm: sha256
  loop:
    - path: "{{ _hetzner_recovery_resolver_path_normalized }}"
      get_checksum: true
    - path: >-
        {{ lookup('ansible.builtin.env', 'ANSIBLE_VAULT_PASSWORD_FILE') }}
      get_checksum: false
  delegate_to: localhost
  become: false
  register: _hetzner_recovery_resolver_files
  changed_when: false
  no_log: true

- name: Require both protected bootstrap inputs to be inspected
  ansible.builtin.assert:
    that:
      - _hetzner_recovery_resolver_files.results | length == 2
    fail_msg: "Both controller bootstrap inputs must be inspected."
    quiet: true
  no_log: true

- name: Require each bootstrap input to be a protected regular file
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
      - item.stat.readable | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.nlink | default(0) | int == 1
      - item.stat.mode | default('') in ['0400', '0600']
      - >-
        item.stat.uid | default(-1) | int
        in [0, _hetzner_recovery_resolver_controller_uid | int]
      - item.stat.size | default(0) | int > 0
      - item.stat.size | default(0) | int <= 1048576
    fail_msg: >-
      The bootstrap ciphertext and Ansible Vault password file must be
      non-empty, no larger than 1 MiB, readable owner-only 0400 or 0600
      regular files owned by root or the effective controller user.
    quiet: true
  loop: "{{ _hetzner_recovery_resolver_files.results }}"
  no_log: true

- name: Read only the Ansible Vault ciphertext signature
  ansible.builtin.command:
    argv:
      - head
      - -c
      - "15"
      - "{{ _hetzner_recovery_resolver_path_normalized }}"
  delegate_to: localhost
  become: false
  register: _hetzner_recovery_resolver_ciphertext_signature
  changed_when: false
  check_mode: false
  no_log: true

- name: Reject a plaintext bootstrap recovery document
  ansible.builtin.assert:
    that:
      - >-
        _hetzner_recovery_resolver_ciphertext_signature.stdout
        == '$ANSIBLE_VAULT;'
    fail_msg: >-
      The bootstrap recovery document is not Ansible Vault ciphertext.
    quiet: true
  no_log: true

- name: Decrypt the per-host Ansible Vault bootstrap document
  ansible.builtin.include_vars:
    file: "{{ _hetzner_recovery_resolver_path_normalized }}"
    name: _hetzner_recovery_ansible_vault_document
  no_log: true

- name: Validate the exact retained Ansible Vault recovery source
  ansible.builtin.assert:
    that:
      - _hetzner_recovery_ansible_vault_document is mapping
      - >-
        _hetzner_recovery_ansible_vault_document.keys() | list | sort
        ==
        [
          'schema_version',
          'subject',
          hetzner_baremetal_vault.recovery_passphrase_field
        ] | sort
      - _hetzner_recovery_ansible_vault_document.schema_version is integer
      - >-
        _hetzner_recovery_ansible_vault_document.schema_version
        == hetzner_baremetal_ansible_vault.schema_version | int
      - _hetzner_recovery_ansible_vault_document.subject is string
      - >-
        _hetzner_recovery_ansible_vault_document.subject
        == inventory_hostname
      - >-
        _hetzner_recovery_ansible_vault_document[
          hetzner_baremetal_vault.recovery_passphrase_field
        ] is string
      - >-
        _hetzner_recovery_ansible_vault_document[
          hetzner_baremetal_vault.recovery_passphrase_field
        ] | length
        == hetzner_baremetal_ansible_vault.recovery_passphrase_length | int
      - >-
        _hetzner_recovery_resolver_files.results[0].stat.checksum
        | default('') is match('^[0-9a-f]{64}$')
    fail_msg: >-
      The retained encrypted Ansible Vault recovery source has an invalid
      schema, subject, secret length, or ciphertext SHA-256.
    quiet: true
  no_log: true

- name: Normalize the Ansible Vault bootstrap document
  ansible.builtin.set_fact:
    _hetzner_baremetal_recovery_document: >-
      {{ _hetzner_recovery_ansible_vault_document }}
  when: hetzner_baremetal_secret_backend == 'ansible_vault_bootstrap'
  no_log: true

- name: Validate the HashiCorp Vault recovery-secret contract
  ansible.builtin.assert:
    that:
      - hetzner_baremetal_vault is mapping
      - >-
        hetzner_baremetal_vault.engine_mount_point
        | default('', true) | length > 0
      - >-
        hetzner_baremetal_vault_secret_path
        | default('', true) | length > 0
      - >-
        hetzner_baremetal_vault.recovery_passphrase_field
        | default('', true) | length > 0
      - >-
        hetzner_baremetal_vault.recovery_source_field
        | default('', true) | length > 0
      - >-
        hetzner_baremetal_vault.recovery_subject_field
        | default('', true) | length > 0
      - >-
        hetzner_baremetal_vault.recovery_schema_version_field
        | default('', true) | length > 0
      - >-
        hetzner_baremetal_vault.recovery_source_ciphertext_sha256_field
        | default('', true) | length > 0
      - >-
        [
          hetzner_baremetal_vault.recovery_passphrase_field,
          hetzner_baremetal_vault.recovery_source_field,
          hetzner_baremetal_vault.recovery_subject_field,
          hetzner_baremetal_vault.recovery_schema_version_field,
          hetzner_baremetal_vault.recovery_source_ciphertext_sha256_field
        ] | unique | length == 5
      - lookup('ansible.builtin.env', 'VAULT_ADDR') | length > 0
      - lookup('ansible.builtin.env', 'VAULT_TOKEN') | length > 0
    fail_msg: "HashiCorp Vault policy or VAULT_ADDR/VAULT_TOKEN is missing."
    quiet: true
  when: hetzner_baremetal_secret_backend == 'hashicorp_vault'
  no_log: true

- name: Read the per-host HashiCorp Vault document
  community.hashi_vault.vault_kv2_get:
    engine_mount_point: "{{ hetzner_baremetal_vault.engine_mount_point }}"
    path: "{{ hetzner_baremetal_vault_secret_path }}"
  delegate_to: localhost
  become: false
  register: _hetzner_recovery_hashicorp_vault_document
  when: hetzner_baremetal_secret_backend == 'hashicorp_vault'
  no_log: true

- name: Normalize the HashiCorp Vault document
  ansible.builtin.set_fact:
    _hetzner_baremetal_recovery_document: >-
      {{ _hetzner_recovery_hashicorp_vault_document.secret }}
  when: hetzner_baremetal_secret_backend == 'hashicorp_vault'
  no_log: true

- name: Validate the resolved recovery document without displaying it
  ansible.builtin.assert:
    that:
      - _hetzner_baremetal_recovery_document is mapping
      - >-
        hetzner_baremetal_secret_backend != 'ansible_vault_bootstrap'
        or
        _hetzner_baremetal_recovery_document.keys() | list | sort
        ==
        [
          'schema_version',
          'subject',
          hetzner_baremetal_vault.recovery_passphrase_field
        ] | sort
      - >-
        hetzner_baremetal_secret_backend != 'ansible_vault_bootstrap'
        or _hetzner_baremetal_recovery_document.schema_version is integer
      - >-
        hetzner_baremetal_secret_backend != 'ansible_vault_bootstrap'
        or _hetzner_baremetal_recovery_document.subject is string
      - >-
        _hetzner_baremetal_recovery_document[
          hetzner_baremetal_vault.recovery_passphrase_field
        ] is string
      - >-
        _hetzner_baremetal_recovery_document[
          hetzner_baremetal_vault.recovery_passphrase_field
        ] | default('', true) | length >= 40
      - >-
        hetzner_baremetal_secret_backend != 'ansible_vault_bootstrap'
        or
        _hetzner_baremetal_recovery_document[
          hetzner_baremetal_vault.recovery_passphrase_field
        ] | length
        == hetzner_baremetal_ansible_vault.recovery_passphrase_length | int
      - >-
        hetzner_baremetal_secret_backend != 'ansible_vault_bootstrap'
        or
        _hetzner_baremetal_recovery_document.schema_version | int
        == hetzner_baremetal_ansible_vault.schema_version | int
      - >-
        hetzner_baremetal_secret_backend != 'ansible_vault_bootstrap'
        or
        _hetzner_baremetal_recovery_document.subject | default('')
        == inventory_hostname
      - >-
        hetzner_baremetal_secret_backend != 'hashicorp_vault'
        or
        _hetzner_baremetal_recovery_document[
          hetzner_baremetal_vault.recovery_passphrase_field
        ]
        ==
        _hetzner_recovery_ansible_vault_document[
          hetzner_baremetal_vault.recovery_passphrase_field
        ]
      - >-
        hetzner_baremetal_secret_backend != 'hashicorp_vault'
        or
        _hetzner_baremetal_recovery_document[
          hetzner_baremetal_vault.recovery_source_field
        ] | default('') == 'ansible_vault_bootstrap'
      - >-
        hetzner_baremetal_secret_backend != 'hashicorp_vault'
        or
        _hetzner_baremetal_recovery_document[
          hetzner_baremetal_vault.recovery_subject_field
        ] | default('') == inventory_hostname
      - >-
        hetzner_baremetal_secret_backend != 'hashicorp_vault'
        or
        _hetzner_baremetal_recovery_document[
          hetzner_baremetal_vault.recovery_schema_version_field
        ] | default(0) | int
        == hetzner_baremetal_ansible_vault.schema_version | int
      - >-
        hetzner_baremetal_secret_backend != 'hashicorp_vault'
        or
        _hetzner_baremetal_recovery_document[
          hetzner_baremetal_vault.recovery_source_ciphertext_sha256_field
        ] | default('')
        == _hetzner_recovery_resolver_files.results[0].stat.checksum
    fail_msg: >-
      The selected backend did not return the expected host recovery document.
    quiet: true
  no_log: true

- name: Resolve the recovery passphrase for the caller
  ansible.builtin.set_fact:
    _hetzner_baremetal_recovery_passphrase: >-
      {{
        _hetzner_baremetal_recovery_document[
          hetzner_baremetal_vault.recovery_passphrase_field
        ]
      }}
  no_log: true
