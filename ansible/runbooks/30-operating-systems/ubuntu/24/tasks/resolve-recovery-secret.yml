---
# Resolve one host's recovery secret from the explicitly selected backend.
# Callers must keep every task that consumes the returned facts under no_log.
- name: Validate the recovery-secret backend selector
  ansible.builtin.assert:
    that:
      - >-
        hetzner_baremetal_secret_backend
        in ['ansible_vault_bootstrap', 'hashicorp_vault']
    fail_msg: >-
      hetzner_baremetal_secret_backend must be exactly
      ansible_vault_bootstrap or hashicorp_vault.
    quiet: true

- name: Validate the Ansible Vault bootstrap contract
  ansible.builtin.assert:
    that:
      - hetzner_baremetal_ansible_vault is mapping
      - >-
        hetzner_baremetal_ansible_vault.schema_version
        | default(0) | int == 1
      - >-
        hetzner_baremetal_ansible_vault.recovery_passphrase_length
        | default(0) | int >= 40
      - >-
        hetzner_baremetal_ansible_vault_secret_path
        | default('', true) | length > 0
      - >-
        hetzner_baremetal_vault.recovery_passphrase_field
        | default('', true) | length > 0
    fail_msg: "The Ansible Vault bootstrap inventory contract is incomplete."
    quiet: true
  when: hetzner_baremetal_secret_backend == 'ansible_vault_bootstrap'
  no_log: true

- name: Decrypt the per-host Ansible Vault bootstrap document
  ansible.builtin.include_vars:
    file: "{{ hetzner_baremetal_ansible_vault_secret_path }}"
    name: _hetzner_recovery_ansible_vault_document
  when: hetzner_baremetal_secret_backend == 'ansible_vault_bootstrap'
  no_log: true

- name: Normalize the Ansible Vault bootstrap document
  ansible.builtin.set_fact:
    _hetzner_baremetal_recovery_document: >-
      {{ _hetzner_recovery_ansible_vault_document }}
  when: hetzner_baremetal_secret_backend == 'ansible_vault_bootstrap'
  no_log: true

- name: Validate the HashiCorp Vault recovery-secret contract
  ansible.builtin.assert:
    that:
      - hetzner_baremetal_vault is mapping
      - >-
        hetzner_baremetal_vault.engine_mount_point
        | default('', true) | length > 0
      - >-
        hetzner_baremetal_vault_secret_path
        | default('', true) | length > 0
      - >-
        hetzner_baremetal_vault.recovery_passphrase_field
        | default('', true) | length > 0
      - lookup('ansible.builtin.env', 'VAULT_ADDR') | length > 0
      - lookup('ansible.builtin.env', 'VAULT_TOKEN') | length > 0
    fail_msg: "HashiCorp Vault policy or VAULT_ADDR/VAULT_TOKEN is missing."
    quiet: true
  when: hetzner_baremetal_secret_backend == 'hashicorp_vault'
  no_log: true

- name: Read the per-host HashiCorp Vault document
  community.hashi_vault.vault_kv2_get:
    engine_mount_point: "{{ hetzner_baremetal_vault.engine_mount_point }}"
    path: "{{ hetzner_baremetal_vault_secret_path }}"
  delegate_to: localhost
  become: false
  register: _hetzner_recovery_hashicorp_vault_document
  when: hetzner_baremetal_secret_backend == 'hashicorp_vault'
  no_log: true

- name: Normalize the HashiCorp Vault document
  ansible.builtin.set_fact:
    _hetzner_baremetal_recovery_document: >-
      {{ _hetzner_recovery_hashicorp_vault_document.secret }}
  when: hetzner_baremetal_secret_backend == 'hashicorp_vault'
  no_log: true

- name: Validate the resolved recovery document without displaying it
  ansible.builtin.assert:
    that:
      - _hetzner_baremetal_recovery_document is mapping
      - >-
        _hetzner_baremetal_recovery_document[
          hetzner_baremetal_vault.recovery_passphrase_field
        ] | default('', true) | length >= 40
      - >-
        hetzner_baremetal_secret_backend != 'ansible_vault_bootstrap'
        or
        _hetzner_baremetal_recovery_document.schema_version | int
        == hetzner_baremetal_ansible_vault.schema_version | int
      - >-
        hetzner_baremetal_secret_backend != 'ansible_vault_bootstrap'
        or
        _hetzner_baremetal_recovery_document.subject | default('')
        == inventory_hostname
    fail_msg: >-
      The selected backend did not return the expected host recovery document.
    quiet: true
  no_log: true

- name: Resolve the recovery passphrase for the caller
  ansible.builtin.set_fact:
    _hetzner_baremetal_recovery_passphrase: >-
      {{
        _hetzner_baremetal_recovery_document[
          hetzner_baremetal_vault.recovery_passphrase_field
        ]
      }}
  no_log: true
