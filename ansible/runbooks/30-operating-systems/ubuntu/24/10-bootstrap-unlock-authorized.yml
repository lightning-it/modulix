---
- name: Sign one exact first-boot cryptroot unlock
  hosts: hetzner_baremetal
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true
  serial: 1

  pre_tasks:
    - name: Read the pinned Dropbear host-key line
      ansible.builtin.slurp:
        path: "{{ luks_unlock_dropbear_known_hosts_path }}"
      register: _unlock_known_hosts
      no_log: true

    - name: Normalize the pinned Dropbear host-key identity
      ansible.builtin.set_fact:
        _unlock_known_hosts_line: >-
          {{ (_unlock_known_hosts.content | b64decode).splitlines() | first }}
      no_log: true

    - name: Require the exact approved Dropbear host-key identity
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit | string | trim == inventory_hostname
          - _unlock_known_hosts_line.split() | length == 3
          - >-
            _unlock_known_hosts_line.split()[0]
            == '[' ~ inventory_hostname ~ ']:'
            ~ (luks_unlock_dropbear_port | string)
          - _unlock_known_hosts_line.split()[1] == 'ssh-ed25519'
          - >-
            hetzner_bootstrap_unlock_dropbear_fingerprint
            is match('^SHA256:[A-Za-z0-9+/]{43}$')
          - >-
            hetzner_bootstrap_unlock_known_hosts_sha256
            is match('^[0-9a-f]{64}$')
        quiet: true

  tasks:
    - name: Sign the one-time Dropbear cryptroot approval
      lit.foundational.onepassword_approval:
        approval_authority: >-
          {{ hetzner_baremetal_onepassword.approval_authority }}
        binding:
          onepassword:
            cli_path: "{{ hetzner_baremetal_onepassword.cli_path }}"
            cli_sha256: "{{ hetzner_baremetal_onepassword.cli_sha256 }}"
            cli_version: "{{ hetzner_baremetal_onepassword.cli_version }}"
            account_id: "{{ hetzner_baremetal_onepassword.account_id }}"
            account_sign_in_address: >-
              {{ hetzner_baremetal_onepassword.account_sign_in_address }}
            authorized_user_uuids: >-
              {{ hetzner_baremetal_onepassword.authorized_user_uuids }}
            vault_id: "{{ hetzner_baremetal_onepassword.vault_id }}"
          password_item:
            operation: plan
            allow_create: false
            item_id: "{{ hetzner_baremetal_onepassword.password_item.item_id }}"
            item_version: >-
              {{ hetzner_baremetal_onepassword.password_item.item_version | int }}
            item_title: >-
              {{ hetzner_baremetal_onepassword.password_item.item_title }}
            field_id: "{{ hetzner_baremetal_onepassword.password_item.field_id }}"
            category: Password
            tags: "{{ hetzner_baremetal_onepassword.password_item.tags }}"
            subject: "{{ inventory_hostname }}"
            schema_version: "{{ hetzner_baremetal_onepassword.schema_version | int }}"
            password_recipe: >-
              letters,digits,symbols,{{
                hetzner_baremetal_onepassword.password_item.expected_length | int
              }}
            password_length: >-
              {{ hetzner_baremetal_onepassword.password_item.expected_length | int }}
          ssh_item:
            operation: verify_agent
            allow_create: false
            item_id: "{{ hetzner_baremetal_onepassword.ssh_key_item.item_id }}"
            item_version: >-
              {{ hetzner_baremetal_onepassword.ssh_key_item.item_version | int }}
            item_title: "{{ hetzner_baremetal_onepassword.ssh_key_item.item_title }}"
            category: SSH Key
            tags: "{{ hetzner_baremetal_onepassword.ssh_key_item.tags }}"
            subject: "{{ inventory_hostname }}"
            schema_version: "{{ hetzner_baremetal_onepassword.schema_version | int }}"
            key_type: ed25519
            expected_fingerprint: >-
              {{ hetzner_baremetal_onepassword.ssh_key_item.expected_fingerprint }}
            ssh_add_path: "{{ hetzner_baremetal_onepassword.ssh_agent.ssh_add_path }}"
            ssh_add_sha256: >-
              {{ hetzner_baremetal_onepassword.ssh_agent.ssh_add_sha256 }}
            ssh_keygen_path: >-
              {{ hetzner_baremetal_onepassword.ssh_agent.ssh_keygen_path }}
            ssh_keygen_sha256: >-
              {{ hetzner_baremetal_onepassword.ssh_agent.ssh_keygen_sha256 }}
            agent_socket_path: >-
              {{ hetzner_baremetal_onepassword.ssh_agent.agent_socket_path }}
          controller_ssh:
            ssh_path: "{{ hetzner_baremetal_onepassword.ssh_agent.ssh_path }}"
            ssh_sha256: "{{ hetzner_baremetal_onepassword.ssh_agent.ssh_sha256 }}"
            known_hosts_identity:
              path: "{{ luks_unlock_dropbear_known_hosts_path }}"
              sha256: "{{ hetzner_bootstrap_unlock_known_hosts_sha256 }}"
              host_token: >-
                [{{ inventory_hostname }}]:{{ luks_unlock_dropbear_port | int }}
              key_type: ssh-ed25519
              fingerprint: "{{ hetzner_bootstrap_unlock_dropbear_fingerprint }}"
              selected_line_sha256: >-
                {{ hetzner_bootstrap_unlock_known_hosts_sha256 }}
              selected_line: "{{ _unlock_known_hosts_line }}"
          destination:
            host: "{{ inventory_hostname }}"
            user: root
            port: "{{ luks_unlock_dropbear_port | int }}"
            host_fingerprint: "{{ hetzner_bootstrap_unlock_dropbear_fingerprint }}"
            remote_command: /bin/cryptroot-unlock
        commit_shas:
          modulix_automation: 5fadcfa8cbdf1c601aa9e49e8f97e5c73027cb0c
          foundational: ce769d6ae1ca4f60c2db187f36519e03e054fe34
          inventory: 5b650f3c93d480ffd762e006b0fafe3cc4c28cd9
        execution_id_prefix: WBX-LUKS-UNLOCK
        operation: unlock-luks-over-ssh-stdin
        signing_agent_socket_path: >-
          {{ hetzner_baremetal_onepassword.ssh_agent.agent_socket_path }}
        signing_ssh_add_path: >-
          {{ hetzner_baremetal_onepassword.ssh_agent.ssh_add_path }}
        signing_ssh_add_sha256: >-
          {{ hetzner_baremetal_onepassword.ssh_agent.ssh_add_sha256 }}
        target: "{{ inventory_hostname }}"
        validity_seconds: 600
      register: _bootstrap_unlock_signed_approval
      no_log: true

    - name: Publish the short-lived approval for immediate consumption
      ansible.builtin.set_fact:
        hetzner_bootstrap_unlock_approval: >-
          {{ _bootstrap_unlock_signed_approval.approval }}
      no_log: true

- name: Consume the signed approval exactly once
  ansible.builtin.import_playbook: 10-bootstrap-unlock.yml
