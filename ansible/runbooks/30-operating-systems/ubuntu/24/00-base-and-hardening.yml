---
# -----------------------------------------------------------------------------
# Ubuntu 24 - Base Setup and CIS Hardening
#
# Purpose:
# - Run the Ubuntu 24 base setup first
# - Run ansible-lockdown CIS hardening afterwards through the lit.ubuntu wrapper
#
# Run the base play for the intended host or group. Run CIS server and
# workstation classes separately with their inventory-declared native profile
# tag; 90-cis-hardening.yml rejects broad or untagged execution.
# -----------------------------------------------------------------------------
- name: Ubuntu 24 base setup
  ansible.builtin.import_playbook: 01-base-setup.yml
- name: Ubuntu 24 CIS hardening
  ansible.builtin.import_playbook: 90-cis-hardening.yml
