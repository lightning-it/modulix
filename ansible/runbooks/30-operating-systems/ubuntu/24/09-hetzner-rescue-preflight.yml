---
# Controller and Rescue-system gates for inventory, DNS/PTR, SSH trust, Robot
# firewall activation, deploy-key access, disk identity, SMART, and egress.
- name: Validate controller-side Hetzner prerequisites
  hosts: hetzner_baremetal
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true

  pre_tasks:
    - name: Require an explicit limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | string | trim | length > 0
          - >-
            ansible_play_hosts_all | sort
            == groups['hetzner_baremetal'] | sort
        fail_msg: >-
          This runbook requires --limit selecting the complete
          hetzner_baremetal group. Partial preflight cannot prove exact vSwitch
          membership or peer MGMT reachability.
      run_once: true
      tags: [always]

    - name: Resolve encrypted Robot API credentials into protected memory
      ansible.builtin.include_tasks: tasks/resolve-robot-credentials.yml
      no_log: true
      tags: [always]

  tasks:
    - name: Ensure the protected known-hosts directory exists
      ansible.builtin.file:
        path: "{{ hetzner_baremetal_rescue_known_hosts_path | dirname }}"
        state: directory
        mode: "0700"
      run_once: true

    - name: Reset the ephemeral Rescue known-hosts file
      ansible.builtin.copy:
        content: ""
        dest: "{{ hetzner_baremetal_rescue_known_hosts_path }}"
        mode: "0600"
      run_once: true
      changed_when: false

    - name: Validate inventory-owned installation policy
      ansible.builtin.assert:
        that:
          - inventory_hostname in hetzner_baremetal_install_order
          - deploy_ssh_public_keys | type_debug == 'list'
          - deploy_ssh_public_keys | length > 0
          - breakglass_public_keys | type_debug == 'list'
          - breakglass_public_keys | length > 0
          - ansible_private_key_file | string | trim | length > 0
          - >-
            hetzner_baremetal_rescue_robot_user_keys_max_bytes
            | type_debug == 'int'
          - hetzner_baremetal_rescue_robot_user_keys_max_bytes > 0
          - >-
            hetzner_baremetal_rescue_robot_user_keys_max_bytes
            <= 1048576
          - hetzner_baremetal_robot_firewall.enabled is boolean
          - hetzner_baremetal_robot_firewall.filter_ipv6 is boolean
          - >-
            hetzner_baremetal_robot_firewall.common_incoming_rules
            | type_debug == 'list'
          - >-
            hetzner_baremetal_robot_firewall_extra_incoming_rules
            | type_debug == 'list'
          - >-
            (
              hetzner_baremetal_robot_firewall.common_incoming_rules
              + hetzner_baremetal_robot_firewall_extra_incoming_rules
            ) | length <= 10
          - >-
            hetzner_baremetal_robot_firewall.allow_hetzner_services is boolean
          - >-
            hetzner_baremetal_robot_firewall.outgoing_policy
            in ['accept', 'discard']
          - >-
            hetzner_baremetal_robot_firewall.outgoing_rule_name is string
          - >-
            hetzner_baremetal_robot_firewall.outgoing_rule_name
            | trim | length > 0
          - hetzner_baremetal_tang_host in groups['hetzner_baremetal']
          - hetzner_baremetal_vault is mapping
          - hetzner_baremetal_vault.host in groups['hetzner_baremetal']
          - >-
            hetzner_baremetal_vault.endpoint_fqdn
            is match('^[A-Za-z0-9.-]+$')
          - ansible_host == hetzner_installimage_expected_identity.public_ipv4
          - hetzner_installimage_action == 'plan'
          - hetzner_installimage_expected_disks | length > 0
          - >-
            hetzner_rescue_ssh_ed25519_sha256
            is match('^SHA256:[A-Za-z0-9+/]{43}$')
          - mgmt_network.allocation_state == 'active'
          - mgmt_network.parent_interface | string | trim | length > 0
          - mgmt_network.vlan_interface | string | trim | length > 0
          - mgmt_subnet.prefix_length | int > 0
          - mgmt_subnet.prefix_length | int <= 32
          - >-
            mgmt_subnet.gateway is none
            or (
              mgmt_subnet.gateway is string
              and mgmt_subnet.gateway | trim | length > 0
            )
          - mgmt_transport.provider == 'hetzner_robot_vswitch'
          - mgmt_transport.deployment_state == 'active'
          - mgmt_transport.vlan_id | int == 4091
          - mgmt_transport.mtu | int == 1400
          - mgmt_network.vlan_interface in netplan_vlans
          - >-
            netplan_vlans[mgmt_network.vlan_interface].id | int
            == mgmt_transport.vlan_id | int
          - >-
            netplan_vlans[mgmt_network.vlan_interface].link
            == mgmt_network.parent_interface
          - >-
            netplan_vlans[mgmt_network.vlan_interface].mtu | int
            == mgmt_transport.mtu | int
          - >-
            (
              mgmt_network.ipv4
              ~ '/'
              ~ (mgmt_subnet.prefix_length | string)
            ) in netplan_vlans[mgmt_network.vlan_interface].addresses
        fail_msg: >-
          The rendered host inventory does not satisfy the install contract.

    - name: Require exact inventory Robot incoming-rule schema
      vars:
        _hetzner_inventory_robot_rule_fields:
          - ip_version
          - protocol
          - source
          - source_port
          - destination
          - destination_port
          - tcp_flags
          - comment
        _hetzner_inventory_robot_actual_rule_fields: >-
          {{ item.keys() | list if item is mapping else [] }}
      ansible.builtin.assert:
        that:
          - item is mapping
          - >-
            _hetzner_inventory_robot_actual_rule_fields
            | difference(_hetzner_inventory_robot_rule_fields)
            | length == 0
          - >-
            item is mapping
            and item.get('ip_version') == 'ipv4'
          - >-
            item is mapping
            and item.get('protocol') is string
            and item.get('protocol')
            in ['tcp', 'udp', 'gre', 'icmp', 'ipip', 'ah', 'esp']
          - >-
            item is mapping
            and item.get('comment') is string
            and item.get('comment') | trim | length > 0
          - >-
            item is mapping
            and (
              item.get('source') is none
              or (
                item.get('source') is string
                and item.get('source') | trim | length > 0
              )
            )
          - >-
            item is mapping
            and (
              item.get('source_port') is none
              or (
                item.get('source_port') is string
                and item.get('source_port') | trim | length > 0
              )
            )
          - >-
            item is mapping
            and (
              item.destination is not defined
              or (
                item.get('destination') is none
                and item.get('protocol') == 'icmp'
              )
            )
          - >-
            item is mapping
            and (
              item.get('destination_port') is none
              or (
                item.get('destination_port') is string
                and item.get('destination_port') | trim | length > 0
              )
            )
          - >-
            item is mapping
            and (
              item.get('tcp_flags') is none
              or (
                item.get('tcp_flags') is string
                and item.get('tcp_flags') | trim | length > 0
              )
            )
        fail_msg: >-
          An inventory Robot incoming rule is malformed or has undeclared
          fields.
        quiet: true
      loop: >-
        {{
          hetzner_baremetal_robot_firewall.common_incoming_rules
          + hetzner_baremetal_robot_firewall_extra_incoming_rules
        }}
      loop_control:
        label: "{{ item.comment | default('invalid-rule') }}"
      when: hetzner_baremetal_robot_firewall.enabled | bool

    - name: Require Robot access to the declared Dropbear listen port
      vars:
        _hetzner_inventory_robot_rules: >-
          {{
            hetzner_baremetal_robot_firewall.common_incoming_rules
            + hetzner_baremetal_robot_firewall_extra_incoming_rules
          }}
        _hetzner_inventory_tcp_destination_ports: >-
          {{
            _hetzner_inventory_robot_rules
            | selectattr('ip_version', 'equalto', 'ipv4')
            | selectattr('protocol', 'equalto', 'tcp')
            | selectattr('destination_port', 'defined')
            | map(attribute='destination_port')
            | map('string')
            | select('equalto', luks_unlock_dropbear_port | string)
            | list
          }}
        _hetzner_inventory_unrestricted_tcp_destination_ports: >-
          {{
            _hetzner_inventory_robot_rules
            | selectattr('ip_version', 'equalto', 'ipv4')
            | selectattr('protocol', 'equalto', 'tcp')
            | selectattr('destination_port', 'defined')
            | rejectattr('source', 'defined')
            | map(attribute='destination_port')
            | map('string')
            | select('equalto', luks_unlock_dropbear_port | string)
            | list
          }}
        _hetzner_inventory_unrestricted_ssh_rules: >-
          {{
            _hetzner_inventory_robot_rules
            | selectattr('ip_version', 'equalto', 'ipv4')
            | selectattr('protocol', 'equalto', 'tcp')
            | selectattr('destination_port', 'defined')
            | rejectattr('source', 'defined')
            | selectattr('destination_port', 'equalto', '22')
            | list
          }}
        _hetzner_inventory_unrestricted_hardened_ssh_rules: >-
          {{
            _hetzner_inventory_robot_rules
            | selectattr('ip_version', 'equalto', 'ipv4')
            | selectattr('protocol', 'equalto', 'tcp')
            | selectattr('destination_port', 'defined')
            | rejectattr('source', 'defined')
            | selectattr('destination_port', 'equalto', '1905')
            | list
          }}
        _hetzner_inventory_wildcard_icmp_rules: >-
          {{
            _hetzner_inventory_robot_rules
            | selectattr('ip_version', 'equalto', 'ipv4')
            | selectattr('protocol', 'equalto', 'icmp')
            | selectattr('destination', 'defined')
            | selectattr('destination', 'none')
            | list
          }}
      ansible.builtin.assert:
        that:
          - luks_unlock_dropbear_port | type_debug == 'int'
          - luks_unlock_dropbear_port > 0
          - luks_unlock_dropbear_port <= 65535
          - _hetzner_inventory_tcp_destination_ports | length == 1
          - >-
            _hetzner_inventory_unrestricted_tcp_destination_ports
            | length == 1
          - _hetzner_inventory_unrestricted_ssh_rules | length == 1
          - >-
            _hetzner_inventory_unrestricted_hardened_ssh_rules
            | length == 1
          - _hetzner_inventory_wildcard_icmp_rules | length == 1
        fail_msg: >-
          Bootstrap SSH, hardened SSH, Dropbear, or wildcard ICMP is not
          represented by exactly one matching Robot input rule.
        quiet: true
      when: hetzner_baremetal_robot_firewall.enabled | bool

    - name: Derive required deployment-key fingerprints
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -E
          - sha256
          - -lf
          - '-'
        stdin: "{{ item }}\n"
        stdin_add_newline: false
      loop: "{{ deploy_ssh_public_keys }}"
      register: _hetzner_required_deploy_fingerprint_results
      changed_when: false
      no_log: true

    - name: Derive required break-glass-key fingerprints
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -E
          - sha256
          - -lf
          - '-'
        stdin: "{{ item }}\n"
        stdin_add_newline: false
      loop: "{{ breakglass_public_keys }}"
      register: _hetzner_required_breakglass_fingerprint_results
      changed_when: false
      no_log: true

    - name: Read SHA-256 fingerprints held by the controller SSH agent
      ansible.builtin.command:
        argv:
          - ssh-add
          - -l
          - -E
          - sha256
      register: _hetzner_agent_fingerprint_result
      changed_when: false
      failed_when: false

    - name: Require deployment and break-glass identities in the SSH agent
      vars:
        _hetzner_required_deploy_fingerprints: >-
          {{
            _hetzner_required_deploy_fingerprint_results.results
            | map(attribute='stdout')
            | join('\n')
            | regex_findall('SHA256:[A-Za-z0-9+/]{43}')
          }}
        _hetzner_required_breakglass_fingerprints: >-
          {{
            _hetzner_required_breakglass_fingerprint_results.results
            | map(attribute='stdout')
            | join('\n')
            | regex_findall('SHA256:[A-Za-z0-9+/]{43}')
          }}
        _hetzner_agent_fingerprints: >-
          {{
            _hetzner_agent_fingerprint_result.stdout
            | default('')
            | regex_findall('SHA256:[A-Za-z0-9+/]{43}')
          }}
      ansible.builtin.assert:
        that:
          - _hetzner_agent_fingerprint_result.rc == 0
          - >-
            _hetzner_required_deploy_fingerprints | length
            == deploy_ssh_public_keys | length
          - >-
            _hetzner_required_breakglass_fingerprints | length
            == breakglass_public_keys | length
          - >-
            _hetzner_required_deploy_fingerprints | unique | length
            == _hetzner_required_deploy_fingerprints | length
          - >-
            _hetzner_required_breakglass_fingerprints | unique | length
            == _hetzner_required_breakglass_fingerprints | length
          - >-
            _hetzner_required_deploy_fingerprints
            | difference(_hetzner_agent_fingerprints)
            | length == 0
          - >-
            _hetzner_required_breakglass_fingerprints
            | difference(_hetzner_agent_fingerprints)
            | length == 0
        fail_msg: >-
          The controller SSH agent is unavailable, empty, or does not hold every
          inventory-required deployment and break-glass identity. Load those
          identities before running the live preflight.
        quiet: true

    - name: Resolve the public A record
      ansible.builtin.set_fact:
        _hetzner_dns_a: >-
          {{
            lookup(
              'community.general.dig',
              inventory_hostname,
              '@' ~ hetzner_baremetal_dns_resolver,
              qtype='A',
              fail_on_error=true
            )
          }}
        _hetzner_dns_ptr: >-
          {{
            lookup(
              'community.general.dig',
              ansible_host ~ '/PTR',
              '@' ~ hetzner_baremetal_dns_resolver,
              fail_on_error=true
            ) | regex_replace('\.$', '')
          }}
      changed_when: false

    - name: Require matching public DNS and PTR
      ansible.builtin.assert:
        that:
          - _hetzner_dns_a == ansible_host
          - _hetzner_dns_ptr == inventory_hostname
        fail_msg: >-
          Public A/PTR records do not match inventory for
          {{ inventory_hostname }}.

    - name: Resolve the Tang CNAME on its server
      ansible.builtin.set_fact:
        _hetzner_tang_cname: >-
          {{
            lookup(
              'community.general.dig',
              hetzner_baremetal_tang_fqdn,
              '@' ~ hetzner_baremetal_dns_resolver,
              qtype='CNAME',
              fail_on_error=true
            ) | regex_replace('\.$', '')
          }}
      changed_when: false
      when: inventory_hostname == hetzner_baremetal_tang_host

    - name: Require the Tang CNAME to target its inventory host
      ansible.builtin.assert:
        that:
          - _hetzner_tang_cname == hetzner_baremetal_tang_host
        fail_msg: "The Tang CNAME does not target the declared Tang host."
      when: inventory_hostname == hetzner_baremetal_tang_host

    - name: Resolve the Vault CNAME on its declared host
      ansible.builtin.set_fact:
        _hetzner_vault_cname: >-
          {{
            lookup(
              'community.general.dig',
              hetzner_baremetal_vault.endpoint_fqdn,
              '@' ~ hetzner_baremetal_dns_resolver,
              qtype='CNAME',
              fail_on_error=true
            ) | regex_replace('\.$', '')
          }}
      changed_when: false
      when: inventory_hostname == hetzner_baremetal_vault.host

    - name: Require the Vault CNAME to target its inventory host
      ansible.builtin.assert:
        that:
          - _hetzner_vault_cname == hetzner_baremetal_vault.host
        fail_msg: "The Vault CNAME does not target the declared Vault host."
      when: inventory_hostname == hetzner_baremetal_vault.host

    - name: Scan and pin the current Rescue SSH host key
      block:
        - name: Scan the Rescue Ed25519 host key
          ansible.builtin.command:
            argv:
              - ssh-keyscan
              - -T
              - "10"
              - -t
              - ed25519
              - "{{ ansible_host }}"
          register: _hetzner_rescue_keyscan
          changed_when: false
          failed_when: >-
            _hetzner_rescue_keyscan.rc != 0
            or _hetzner_rescue_keyscan.stdout | trim | length == 0

        - name: Select the scanned Ed25519 host key
          ansible.builtin.set_fact:
            _hetzner_rescue_ed25519_key_lines: >-
              {{
                _hetzner_rescue_keyscan.stdout_lines
                | select(
                    'match',
                    '^[^ ]+ ssh-ed25519 [A-Za-z0-9+/=]+$'
                  )
                | list
              }}
          changed_when: false

        - name: Require exactly one scanned Ed25519 host key
          ansible.builtin.assert:
            that:
              - _hetzner_rescue_ed25519_key_lines | length == 1
            fail_msg: >-
              ssh-keyscan did not return exactly one usable Ed25519 host key.

        - name: Create a temporary host-key file
          ansible.builtin.tempfile:
            state: file
            suffix: .pub
          register: _hetzner_rescue_key_file
          changed_when: false

        - name: Store the scanned host key for fingerprint validation
          ansible.builtin.copy:
            content: "{{ _hetzner_rescue_ed25519_key_lines[0] }}\n"
            dest: "{{ _hetzner_rescue_key_file.path }}"
            mode: "0600"
          changed_when: false

        - name: Calculate the scanned host-key fingerprint
          ansible.builtin.command:
            argv:
              - ssh-keygen
              - -E
              - sha256
              - -lf
              - "{{ _hetzner_rescue_key_file.path }}"
          register: _hetzner_rescue_fingerprint
          changed_when: false

        - name: Require the inventory-pinned Rescue fingerprint
          ansible.builtin.assert:
            that:
              - >-
                _hetzner_rescue_fingerprint.stdout.split()[1]
                == hetzner_rescue_ssh_ed25519_sha256
            fail_msg: "The Rescue SSH fingerprint differs from inventory."

        - name: Add the verified Rescue key to known_hosts
          ansible.builtin.known_hosts:
            path: "{{ hetzner_baremetal_rescue_known_hosts_path }}"
            name: "{{ ansible_host }}"
            key: >-
              {{ ansible_host }}
              {{ _hetzner_rescue_ed25519_key_lines[0].split(' ', 1)[1] }}
            state: present
          throttle: 1
      always:
        - name: Remove the temporary host-key file
          ansible.builtin.file:
            path: "{{ _hetzner_rescue_key_file.path }}"
            state: absent
          when:
            - _hetzner_rescue_key_file is defined
            - _hetzner_rescue_key_file.path is defined
          changed_when: false

    - name: Read the Robot vSwitch list
      ansible.builtin.uri:
        url: https://robot-ws.your-server.de/vswitch
        method: GET
        url_username: "{{ _hetzner_robot_user }}"
        url_password: "{{ _hetzner_robot_password }}"
        force_basic_auth: true
        return_content: true
        status_code: 200
      register: _hetzner_robot_vswitches
      run_once: true
      no_log: true

    - name: Select the non-cancelled inventory VLAN vSwitch
      ansible.builtin.set_fact:
        _hetzner_robot_vswitch_matches: >-
          {{
            _hetzner_robot_vswitches.json
            | selectattr('cancelled', 'equalto', false)
            | selectattr(
                'vlan',
                'equalto',
                (mgmt_transport.vlan_id | int)
              )
            | list
          }}
      run_once: true
      changed_when: false

    - name: Require exactly one active Robot vSwitch for the inventory VLAN
      ansible.builtin.assert:
        that:
          - _hetzner_robot_vswitch_matches | length == 1
        fail_msg: >-
          Robot did not return exactly one non-cancelled vSwitch for inventory
          VLAN {{ mgmt_transport.vlan_id }}.
        quiet: true
      run_once: true

    - name: Read the selected Robot vSwitch membership
      ansible.builtin.uri:
        url: >-
          https://robot-ws.your-server.de/vswitch/{{
            _hetzner_robot_vswitch_matches[0].id
          }}
        method: GET
        url_username: "{{ _hetzner_robot_user }}"
        url_password: "{{ _hetzner_robot_password }}"
        force_basic_auth: true
        return_content: true
        status_code: 200
      register: _hetzner_robot_vswitch
      run_once: true
      no_log: true

    - name: Require exact ready Robot vSwitch membership
      vars:
        _hetzner_robot_vswitch_expected_ips: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars, 'ansible_host')
            | map('string')
            | sort
            | list
          }}
        _hetzner_robot_vswitch_actual_ips: >-
          {{
            _hetzner_robot_vswitch.json.server
            | default([])
            | map(attribute='server_ip')
            | map('string')
            | sort
            | list
          }}
        _hetzner_robot_vswitch_not_ready: >-
          {{
            _hetzner_robot_vswitch.json.server
            | default([])
            | rejectattr('status', 'equalto', 'ready')
            | list
          }}
      ansible.builtin.assert:
        that:
          - >-
            _hetzner_robot_vswitch.json.id | int
            == _hetzner_robot_vswitch_matches[0].id | int
          - >-
            _hetzner_robot_vswitch.json.vlan | int
            == mgmt_transport.vlan_id | int
          - not (_hetzner_robot_vswitch.json.cancelled | bool)
          - >-
            _hetzner_robot_vswitch_actual_ips
            == _hetzner_robot_vswitch_expected_ips
          - >-
            _hetzner_robot_vswitch_expected_ips | unique | length
            == ansible_play_hosts_all | length
          - >-
            _hetzner_robot_vswitch_actual_ips | unique | length
            == _hetzner_robot_vswitch_actual_ips | length
          - _hetzner_robot_vswitch_not_ready | length == 0
        fail_msg: >-
          The selected Robot vSwitch does not have the exact selected-play
          public-IP membership in ready state.
        quiet: true
      run_once: true

    - name: Read the Robot server list
      ansible.builtin.uri:
        url: https://robot-ws.your-server.de/server
        method: GET
        url_username: "{{ _hetzner_robot_user }}"
        url_password: "{{ _hetzner_robot_password }}"
        force_basic_auth: true
        return_content: true
        status_code: 200
      register: _hetzner_robot_servers
      when: hetzner_baremetal_robot_firewall.enabled | bool
      no_log: true

    - name: Resolve this host's Robot server number
      ansible.builtin.set_fact:
        _hetzner_robot_server_matches: >-
          {{
            _hetzner_robot_servers.json
            | map(attribute='server')
            | selectattr('server_ip', 'equalto', ansible_host)
            | list
          }}
      when: hetzner_baremetal_robot_firewall.enabled | bool

    - name: Require one matching Robot server
      ansible.builtin.assert:
        that:
          - _hetzner_robot_server_matches | length == 1
        fail_msg: "Robot returned no unique server for {{ ansible_host }}."
      when: hetzner_baremetal_robot_firewall.enabled | bool

    - name: Read the active Robot firewall
      ansible.builtin.uri:
        url: >-
          {{
            'https://robot-ws.your-server.de/firewall/'
            ~ _hetzner_robot_server_matches[0].server_number
          }}
        method: GET
        url_username: "{{ _hetzner_robot_user }}"
        url_password: "{{ _hetzner_robot_password }}"
        force_basic_auth: true
        return_content: true
        status_code: 200
      register: _hetzner_robot_firewall_result
      when: hetzner_baremetal_robot_firewall.enabled | bool
      no_log: true

    - name: Require the documented Robot firewall response shape
      vars:
        _hetzner_robot_response_json: >-
          {{ _hetzner_robot_firewall_result.json | default({}) }}
        _hetzner_robot_response_firewall: >-
          {{
            _hetzner_robot_response_json.get('firewall', {})
            if _hetzner_robot_response_json is mapping
            else {}
          }}
        _hetzner_robot_response_rules: >-
          {{
            _hetzner_robot_response_firewall.get('rules', {})
            if _hetzner_robot_response_firewall is mapping
            else {}
          }}
        _hetzner_robot_firewall_fields:
          - server_ip
          - server_number
          - status
          - filter_ipv6
          - whitelist_hos
          - port
          - rules
      ansible.builtin.assert:
        that:
          - _hetzner_robot_response_json is mapping
          - _hetzner_robot_response_firewall is mapping
          - >-
            _hetzner_robot_firewall_fields
            | difference(
                _hetzner_robot_response_firewall.keys() | list
              )
            | length == 0
          - _hetzner_robot_response_rules is mapping
          - >-
            _hetzner_robot_response_rules.get('input', none)
            | type_debug == 'list'
          - >-
            _hetzner_robot_response_rules.get('output', none)
            | type_debug == 'list'
          - >-
            _hetzner_robot_response_firewall.get('filter_ipv6', none)
            is boolean
          - >-
            _hetzner_robot_response_firewall.get('whitelist_hos', none)
            is boolean
        fail_msg: >-
          Robot returned a firewall response outside the documented schema.
        quiet: true
      when: hetzner_baremetal_robot_firewall.enabled | bool

    - name: Require the documented Robot firewall rule shape
      vars:
        _hetzner_robot_rule_fields:
          - ip_version
          - name
          - dst_ip
          - src_ip
          - dst_port
          - src_port
          - protocol
          - tcp_flags
          - action
        _hetzner_robot_actual_rule_fields: >-
          {{ item.keys() | list if item is mapping else [] }}
      ansible.builtin.assert:
        that:
          - item is mapping
          - >-
            _hetzner_robot_actual_rule_fields | sort
            == _hetzner_robot_rule_fields | sort
          - >-
            item is mapping
            and (item.get('ip_version') is none
                 or item.get('ip_version') is string)
          - >-
            item is mapping
            and (item.get('name') is none or item.get('name') is string)
          - >-
            item is mapping
            and (item.get('dst_ip') is none or item.get('dst_ip') is string)
          - >-
            item is mapping
            and (item.get('src_ip') is none or item.get('src_ip') is string)
          - >-
            item is mapping
            and (item.get('dst_port') is none
                 or item.get('dst_port') is string)
          - >-
            item is mapping
            and (item.get('src_port') is none
                 or item.get('src_port') is string)
          - >-
            item is mapping
            and (item.get('protocol') is none
                 or item.get('protocol') is string)
          - >-
            item is mapping
            and (item.get('tcp_flags') is none
                 or item.get('tcp_flags') is string)
          - >-
            item is mapping
            and item.get('action') is string
            and item.get('action') in ['accept', 'discard']
        fail_msg: >-
          Robot returned a firewall rule outside the documented schema.
        quiet: true
      loop: >-
        {{
          _hetzner_robot_firewall_result.json.firewall.rules.input
          + _hetzner_robot_firewall_result.json.firewall.rules.output
        }}
      loop_control:
        index_var: _hetzner_robot_rule_index
        label: "{{ _hetzner_robot_rule_index }}"
      when: hetzner_baremetal_robot_firewall.enabled | bool

    - name: Initialize normalized Robot firewall rules
      ansible.builtin.set_fact:
        _hetzner_robot_expected_input: []
        _hetzner_robot_actual_input: []
      when: hetzner_baremetal_robot_firewall.enabled | bool

    - name: Normalize inventory Robot firewall rules
      ansible.builtin.set_fact:
        _hetzner_robot_expected_input: >-
          {{
            _hetzner_robot_expected_input
            + [
                {
                  'ip_version': item.ip_version,
                  'name': item.comment,
                  'dst_ip': (
                    none
                    if item.destination is defined
                       and item.destination is none
                    else ansible_host
                  ),
                  'src_ip': item.source | default(none),
                  'dst_port':
                    item.destination_port | default(none),
                  'src_port': item.source_port | default(none),
                  'protocol': item.protocol,
                  'tcp_flags': item.tcp_flags | default(none),
                  'action': 'accept'
                }
              ]
          }}
      loop: >-
        {{
          hetzner_baremetal_robot_firewall.common_incoming_rules
          + hetzner_baremetal_robot_firewall_extra_incoming_rules
        }}
      loop_control:
        label: "{{ item.comment }}"
      when: hetzner_baremetal_robot_firewall.enabled | bool

    - name: Normalize active Robot firewall rules
      ansible.builtin.set_fact:
        _hetzner_robot_actual_input: >-
          {{
            _hetzner_robot_actual_input
            + [
                {
                  'ip_version': item.ip_version,
                  'name': item.name,
                  'dst_ip': (
                    item.dst_ip | regex_replace('/32$', '')
                    if item.dst_ip is string
                    else none
                  ),
                  'src_ip':
                    (
                      item.src_ip | regex_replace('/32$', '')
                      if item.src_ip is string
                      else none
                    ),
                  'dst_port': item.dst_port,
                  'src_port': item.src_port,
                  'protocol': item.protocol,
                  'tcp_flags': item.tcp_flags,
                  'action': item.action
                }
              ]
          }}
      loop: "{{ _hetzner_robot_firewall_result.json.firewall.rules.input }}"
      loop_control:
        label: "{{ item.name | default(item.protocol) }}"
      when: hetzner_baremetal_robot_firewall.enabled | bool

    - name: Require every Robot rule to target the public address or wildcard
      ansible.builtin.assert:
        that:
          - >-
            item.dst_ip is none
            or (
              item.dst_ip | regex_replace('/32$', '')
            ) == ansible_host
        fail_msg: >-
          A Robot firewall rule has neither the public destination nor the
          explicitly inventory-resolved wildcard destination.
      loop: "{{ _hetzner_robot_firewall_result.json.firewall.rules.input }}"
      loop_control:
        label: "{{ item.name | default(item.protocol) }}"
      when: hetzner_baremetal_robot_firewall.enabled | bool

    - name: Require the declared Robot firewall baseline
      vars:
        _hetzner_robot_expected_output:
          - ip_version: null
            name: "{{ hetzner_baremetal_robot_firewall.outgoing_rule_name }}"
            dst_ip: null
            src_ip: null
            dst_port: null
            src_port: null
            protocol: null
            tcp_flags: null
            action: "{{ hetzner_baremetal_robot_firewall.outgoing_policy }}"
      ansible.builtin.assert:
        that:
          - >-
            _hetzner_robot_firewall_result.json.firewall.server_ip
            == ansible_host
          - >-
            _hetzner_robot_firewall_result.json.firewall.server_number | int
            == _hetzner_robot_server_matches[0].server_number | int
          - >-
            _hetzner_robot_firewall_result.json.firewall.status == 'active'
          - >-
            _hetzner_robot_firewall_result.json.firewall.port == 'main'
          - >-
            _hetzner_robot_firewall_result.json.firewall.filter_ipv6
            is boolean
          - >-
            hetzner_baremetal_robot_firewall.filter_ipv6 is boolean
          - >-
            _hetzner_robot_firewall_result.json.firewall.filter_ipv6
            == hetzner_baremetal_robot_firewall.filter_ipv6
          - >-
            _hetzner_robot_firewall_result.json.firewall.whitelist_hos
            is boolean
          - >-
            hetzner_baremetal_robot_firewall.allow_hetzner_services is boolean
          - >-
            _hetzner_robot_firewall_result.json.firewall.whitelist_hos
            == hetzner_baremetal_robot_firewall.allow_hetzner_services
          - >-
            _hetzner_robot_firewall_result.json.firewall.rules.input | length
            ==
            (
              hetzner_baremetal_robot_firewall.common_incoming_rules
              + hetzner_baremetal_robot_firewall_extra_incoming_rules
            ) | length
          - >-
            _hetzner_robot_firewall_result.json.firewall.rules.output
            | length == 1
          - >-
            hetzner_baremetal_robot_firewall.outgoing_policy
            in ['accept', 'discard']
          - >-
            _hetzner_robot_firewall_result.json.firewall.rules.output
            == _hetzner_robot_expected_output
          - _hetzner_robot_actual_input == _hetzner_robot_expected_input
        fail_msg: >-
          The active Robot firewall does not match the declared baseline shape.
      when: hetzner_baremetal_robot_firewall.enabled | bool

- name: Validate Rescue hardware and egress
  hosts: hetzner_baremetal
  gather_facts: false
  become: false
  any_errors_fatal: true
  serial: 1

  vars:
    ansible_user: root
    ansible_become: false
    ansible_ssh_common_args: >-
      -o UserKnownHostsFile={{ hetzner_baremetal_rescue_known_hosts_path }}
      -o StrictHostKeyChecking=yes
      -o IdentitiesOnly=yes

  tasks:
    - name: Inspect the Hetzner-managed Rescue deployment-key file
      ansible.builtin.stat:
        path: /root/.ssh/robot_user_keys
        follow: false
        get_attributes: false
        get_checksum: false
        get_mime: false
      register: _hetzner_rescue_robot_user_keys_stat
      changed_when: false

    - name: Require safe Rescue deployment-key file metadata
      ansible.builtin.assert:
        that:
          - >-
            _hetzner_rescue_robot_user_keys_stat.stat.exists
            | default(false)
          - >-
            _hetzner_rescue_robot_user_keys_stat.stat.isreg
            | default(false)
          - >-
            not (
              _hetzner_rescue_robot_user_keys_stat.stat.islnk
              | default(false)
            )
          - >-
            _hetzner_rescue_robot_user_keys_stat.stat.uid
            | default(-1) | int == 0
          - >-
            _hetzner_rescue_robot_user_keys_stat.stat.gid
            | default(-1) | int == 0
          - >-
            _hetzner_rescue_robot_user_keys_stat.stat.nlink
            | default(0) | int == 1
          - >-
            _hetzner_rescue_robot_user_keys_stat.stat.mode
            | default('')
            is match('^0[0-7][0145][0145]$')
          - >-
            _hetzner_rescue_robot_user_keys_stat.stat.size
            | default(0) | int > 0
          - >-
            _hetzner_rescue_robot_user_keys_stat.stat.size
            | default(
                hetzner_baremetal_rescue_robot_user_keys_max_bytes | int + 1
              )
            | int
            <= hetzner_baremetal_rescue_robot_user_keys_max_bytes | int
        fail_msg: >-
          /root/.ssh/robot_user_keys is absent or does not meet the safe
          regular-file ownership, link-count, mode, and size contract.

    - name: Read the Hetzner-managed Rescue deployment-key file
      ansible.builtin.slurp:
        src: /root/.ssh/robot_user_keys
      register: _hetzner_rescue_robot_user_keys
      changed_when: false
      no_log: true

    - name: Require exact inventory deployment keys in Rescue
      vars:
        _hetzner_rescue_robot_user_key_lines: >-
          {{
            (_hetzner_rescue_robot_user_keys.content | b64decode).split('\n')
            | map('trim')
            | reject('equalto', '')
            | map('regex_replace', '\\s+', ' ')
            | list
          }}
        _hetzner_inventory_deploy_key_lines: >-
          {{
            deploy_ssh_public_keys
            | map('trim')
            | reject('equalto', '')
            | map('regex_replace', '\\s+', ' ')
            | list
          }}
      ansible.builtin.assert:
        that:
          - >-
            _hetzner_inventory_deploy_key_lines | length
            == deploy_ssh_public_keys | length
          - >-
            _hetzner_inventory_deploy_key_lines | unique | length
            == _hetzner_inventory_deploy_key_lines | length
          - >-
            _hetzner_rescue_robot_user_key_lines
            == _hetzner_inventory_deploy_key_lines
        fail_msg: >-
          Hetzner Rescue was not activated with exactly the deployment public
          keys declared by inventory.
        quiet: true

    - name: Discover physical Rescue disks by serial
      ansible.builtin.command:
        argv:
          - lsblk
          - --json
          - --bytes
          - --nodeps
          - --output
          - PATH,SERIAL,MODEL,SIZE,ROTA,TYPE
      register: _hetzner_rescue_lsblk
      changed_when: false

    - name: Decode physical Rescue disks
      ansible.builtin.set_fact:
        _hetzner_rescue_disks: >-
          {{ (_hetzner_rescue_lsblk.stdout | from_json).blockdevices }}
      changed_when: false

    - name: Require the exact complete physical-disk serial set
      vars:
        _hetzner_rescue_live_disk_serials: >-
          {{
            _hetzner_rescue_disks
            | selectattr('type', 'equalto', 'disk')
            | map(attribute='serial')
            | list
          }}
        _hetzner_rescue_expected_disk_serials: >-
          {{ hetzner_installimage_expected_disks | map(attribute='serial') | list }}
      ansible.builtin.assert:
        that:
          - >-
            _hetzner_rescue_live_disk_serials | length
            == _hetzner_rescue_expected_disk_serials | length
          - >-
            _hetzner_rescue_live_disk_serials | reject('none') | list | length
            == _hetzner_rescue_live_disk_serials | length
          - >-
            _hetzner_rescue_live_disk_serials | map('trim') | reject('equalto', '') | list | length
            == _hetzner_rescue_live_disk_serials | length
          - >-
            _hetzner_rescue_live_disk_serials | unique | length
            == _hetzner_rescue_live_disk_serials | length
          - >-
            _hetzner_rescue_expected_disk_serials | unique | length
            == _hetzner_rescue_expected_disk_serials | length
          - >-
            _hetzner_rescue_live_disk_serials | sort
            == _hetzner_rescue_expected_disk_serials | sort
        fail_msg: >-
          Rescue physical disks are incomplete, extra, serial-less, duplicate,
          or differ from the exact inventory disk set.

    - name: Require every inventory disk's complete identity exactly once
      vars:
        _hetzner_rescue_disk_matches: >-
          {{
            _hetzner_rescue_disks
            | selectattr('serial', 'equalto', item.serial)
            | selectattr('type', 'equalto', 'disk')
            | list
          }}
      ansible.builtin.assert:
        that:
          - _hetzner_rescue_disk_matches | length == 1
          - _hetzner_rescue_disk_matches[0].path is string
          - _hetzner_rescue_disk_matches[0].path is match('^/dev/[A-Za-z0-9._/-]+$')
          - >-
            _hetzner_rescue_disk_matches[0].model | default('') | trim
            == item.model | trim
          - _hetzner_rescue_disk_matches[0].size | int == item.size_bytes | int
          - _hetzner_rescue_disk_matches[0].rota is boolean
          - _hetzner_rescue_disk_matches[0].rota == item.rotational
        fail_msg: >-
          Disk {{ item.serial }} is absent, ambiguous, or differs from the
          inventory model, byte size, or rotational identity.
      loop: "{{ hetzner_installimage_expected_disks }}"
      loop_control:
        label: "{{ item.serial }}"

    - name: Read SMART device identity as JSON
      ansible.builtin.command:
        argv:
          - smartctl
          - -i
          - -j
          - >-
            {{
              (
                _hetzner_rescue_disks
                | selectattr('serial', 'equalto', item.serial)
                | map(attribute='path')
                | first
              )
            }}
      loop: "{{ hetzner_installimage_expected_disks }}"
      loop_control:
        label: "{{ item.serial }}"
      register: _hetzner_smart_identities
      changed_when: false

    - name: Require exact SMART serial and supported protocol identity
      vars:
        _smart_identity: "{{ item.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - _smart_identity is mapping
          - _smart_identity.serial_number is string
          - _smart_identity.serial_number | trim == item.item.serial
          - _smart_identity.device is mapping
          - _smart_identity.device.protocol is string
          - _smart_identity.device.protocol in ['ATA', 'NVMe']
        fail_msg: >-
          SMART identity or protocol does not match inventory for
          {{ item.item.serial }}.
      loop: "{{ _hetzner_smart_identities.results }}"
      loop_control:
        label: "{{ item.item.serial }}"

    - name: Initialize serial-bound SMART protocol map
      ansible.builtin.set_fact:
        _hetzner_smart_protocol_by_serial: {}
      changed_when: false

    - name: Record each serial-bound SMART protocol
      vars:
        _smart_identity: "{{ item.stdout | from_json }}"
      ansible.builtin.set_fact:
        _hetzner_smart_protocol_by_serial: >-
          {{
            _hetzner_smart_protocol_by_serial
            | combine({item.item.serial: _smart_identity.device.protocol})
          }}
      loop: "{{ _hetzner_smart_identities.results }}"
      loop_control:
        label: "{{ item.item.serial }}"
      changed_when: false

    - name: Resolve each NVMe namespace through sysfs
      ansible.builtin.command:
        argv:
          - readlink
          - -f
          - >-
            /sys/class/block/{{
              (
                _hetzner_rescue_disks
                | selectattr('serial', 'equalto', item.serial)
                | map(attribute='path')
                | first
                | basename
              )
            }}/device
      loop: "{{ hetzner_installimage_expected_disks }}"
      loop_control:
        label: "{{ item.serial }}"
      register: _hetzner_nvme_sysfs_namespaces
      changed_when: false
      when: _hetzner_smart_protocol_by_serial[item.serial] == 'NVMe'

    - name: Require exact NVMe namespace-to-controller sysfs paths
      ansible.builtin.assert:
        that:
          - item.stdout_lines | length == 1
          - >-
            item.stdout
            is match(
              '^/sys/devices/.*/nvme/nvme[0-9]+$'
            )
          - item.stdout.split('/')[-1] is match('^nvme[0-9]+$')
          - >-
            (
              _hetzner_rescue_disks
              | selectattr('serial', 'equalto', item.item.serial)
              | map(attribute='path')
              | first
              | basename
            )
            is match('^' ~ item.stdout.split('/')[-1] ~ 'n[0-9]+$')
      loop: "{{ _hetzner_nvme_sysfs_namespaces.results }}"
      loop_control:
        label: "{{ item.item.serial }}"
      when: not (item.skipped | default(false))

    - name: Initialize serial-bound NVMe controller map
      ansible.builtin.set_fact:
        _hetzner_nvme_controller_by_serial: {}
      changed_when: false

    - name: Record each serial-bound NVMe controller
      ansible.builtin.set_fact:
        _hetzner_nvme_controller_by_serial: >-
          {{
            _hetzner_nvme_controller_by_serial
            | combine({item.item.serial: '/dev/' ~ item.stdout.split('/')[-1]})
          }}
      loop: "{{ _hetzner_nvme_sysfs_namespaces.results }}"
      loop_control:
        label: "{{ item.item.serial }}"
      changed_when: false
      when: not (item.skipped | default(false))

    - name: Require one unique NVMe controller per inventory disk
      vars:
        _hetzner_nvme_controllers: >-
          {{ _hetzner_nvme_controller_by_serial.values() | list }}
      ansible.builtin.assert:
        that:
          - >-
            _hetzner_nvme_controllers | unique | length
            == _hetzner_nvme_controllers | length
        fail_msg: >-
          Multiple inventory disks resolve to one NVMe controller; refusing an
          ambiguous physical-device SMART contract.

    - name: Read SMART health as JSON
      ansible.builtin.command:
        argv:
          - smartctl
          - -H
          - -j
          - >-
            {{
              (
                _hetzner_rescue_disks
                | selectattr('serial', 'equalto', item.serial)
                | map(attribute='path')
                | first
              )
            }}
      loop: "{{ hetzner_installimage_expected_disks }}"
      loop_control:
        label: "{{ item.serial }}"
      register: _hetzner_smart_health
      changed_when: false

    - name: Require passed SMART health
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json).smart_status.passed | bool
        fail_msg: "SMART health failed for {{ item.item.serial }}."
      loop: "{{ _hetzner_smart_health.results }}"
      loop_control:
        label: "{{ item.item.serial }}"
      when: hetzner_baremetal_smart_policy.require_passed_health | bool

    - name: Read ATA SMART self-test history as JSON
      ansible.builtin.command:
        argv:
          - smartctl
          - -l
          - selftest
          - -j
          - >-
            {{
              (
                _hetzner_rescue_disks
                | selectattr('serial', 'equalto', item.serial)
                | map(attribute='path')
                | first
              )
            }}
      loop: "{{ hetzner_installimage_expected_disks }}"
      loop_control:
        label: "{{ item.serial }}"
      register: _hetzner_smart_selftests
      changed_when: false
      when:
        - >-
          hetzner_baremetal_smart_policy.require_completed_extended_test
          | bool
        - _hetzner_smart_protocol_by_serial[item.serial] == 'ATA'

    - name: Require a completed latest extended ATA SMART test
      vars:
        _smart_selftest_json: "{{ item.stdout | from_json }}"
        _smart_selftest_log: >-
          {{
            _smart_selftest_json.ata_smart_self_test_log
            | default({}, true)
          }}
        _smart_selftest_standard_log: >-
          {{ _smart_selftest_log.standard | default({}, true) }}
        _smart_selftest_table: >-
          {{ _smart_selftest_standard_log.table | default([], true) }}
        _smart_latest_selftest: >-
          {{ _smart_selftest_table | first | default({}) }}
        _smart_latest_selftest_type: >-
          {{
            _smart_latest_selftest.get('type', {}).get('string', '')
            if (
              _smart_latest_selftest is mapping
              and _smart_latest_selftest.get('type', {}) is mapping
            )
            else ''
          }}
        _smart_latest_selftest_status: >-
          {{
            _smart_latest_selftest.get('status', {}).get('string', '')
            if (
              _smart_latest_selftest is mapping
              and _smart_latest_selftest.get('status', {}) is mapping
            )
            else ''
          }}
      ansible.builtin.assert:
        that:
          - _smart_selftest_table | length > 0
          - _smart_latest_selftest is mapping
          - _smart_latest_selftest.get('type', {}) is mapping
          - _smart_latest_selftest_type is string
          - >-
            _smart_latest_selftest_type | trim
            is match('(?i)^(extended|long)( offline)?$')
          - _smart_latest_selftest.get('status', {}) is mapping
          - _smart_latest_selftest_status is string
          - >-
            _smart_latest_selftest_status == 'Completed without error'
        fail_msg: >-
          The latest SMART self-test is not a completed, error-free Extended
          or Long test for {{ item.item.serial }}.
      loop: "{{ _hetzner_smart_selftests.results }}"
      loop_control:
        label: "{{ item.item.serial }}"
      when: >-
        hetzner_baremetal_smart_policy.require_completed_extended_test | bool
        and not (item.skipped | default(false))

    - name: Read NVMe controller identity as JSON
      ansible.builtin.command:
        argv:
          - nvme
          - id-ctrl
          - --output-format=json
          - "{{ _hetzner_nvme_controller_by_serial[item.serial] }}"
      loop: "{{ hetzner_installimage_expected_disks }}"
      loop_control:
        label: "{{ item.serial }}"
      register: _hetzner_nvme_identities
      changed_when: false
      when: _hetzner_smart_protocol_by_serial[item.serial] == 'NVMe'

    - name: Require exact serial-bound NVMe self-test capability
      vars:
        _nvme_identity: "{{ item.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - _nvme_identity is mapping
          - _nvme_identity.sn is string
          - _nvme_identity.sn | trim == item.item.serial
          - _nvme_identity.oacs | type_debug == 'int'
          - _nvme_identity.oacs | int >= 16
          - ((_nvme_identity.oacs | int) // 16) % 2 == 1
        fail_msg: >-
          NVMe controller identity or Device Self-test capability failed for
          {{ item.item.serial }}.
      loop: "{{ _hetzner_nvme_identities.results }}"
      loop_control:
        label: "{{ item.item.serial }}"
      when: not (item.skipped | default(false))

    - name: Read NVMe device self-test history as JSON
      ansible.builtin.command:
        argv:
          - nvme
          - self-test-log
          - --output-format=json
          - "{{ _hetzner_nvme_controller_by_serial[item.serial] }}"
      loop: "{{ hetzner_installimage_expected_disks }}"
      loop_control:
        label: "{{ item.serial }}"
      register: _hetzner_nvme_selftests
      changed_when: false
      when:
        - >-
          hetzner_baremetal_smart_policy.require_completed_extended_test
          | bool
        - _hetzner_smart_protocol_by_serial[item.serial] == 'NVMe'

    - name: Require a completed latest extended NVMe device self-test
      vars:
        _nvme_selftest: "{{ item.stdout | from_json }}"
        _nvme_selftest_reports: >-
          {{ _nvme_selftest.get('List of Valid Reports', []) }}
        _nvme_latest_selftest: >-
          {{ _nvme_selftest_reports | first | default({}) }}
      ansible.builtin.assert:
        that:
          - _nvme_selftest is mapping
          - >-
            _nvme_selftest.keys() | list | sort
            ==
            [
              'Current Device Self-Test Operation',
              'Current Device Self-Test Completion',
              'List of Valid Reports'
            ] | sort
          - _nvme_selftest['Current Device Self-Test Operation'] | type_debug == 'int'
          - _nvme_selftest['Current Device Self-Test Operation'] | int == 0
          - >-
            _nvme_selftest['Current Device Self-Test Completion']
            | type_debug == 'int'
          - _nvme_selftest_reports | type_debug == 'list'
          - _nvme_selftest_reports | length > 0
          - _nvme_latest_selftest is mapping
          - _nvme_latest_selftest.get('Self test code', none) | type_debug == 'int'
          - _nvme_latest_selftest.get('Self test code', -1) | int == 2
          - >-
            _nvme_latest_selftest.get('Self test result', none)
            | type_debug == 'int'
          - _nvme_latest_selftest.get('Self test result', -1) | int == 0
        fail_msg: >-
          The latest NVMe Device Self-test is not an idle, completed,
          error-free extended test for {{ item.item.serial }}.
      loop: "{{ _hetzner_nvme_selftests.results }}"
      loop_control:
        label: "{{ item.item.serial }}"
      when: >-
        hetzner_baremetal_smart_policy.require_completed_extended_test | bool
        and not (item.skipped | default(false))

    - name: Read SMART attributes as JSON
      ansible.builtin.command:
        argv:
          - smartctl
          - -A
          - -j
          - >-
            {{
              (
                _hetzner_rescue_disks
                | selectattr('serial', 'equalto', item.serial)
                | map(attribute='path')
                | first
              )
            }}
      loop: "{{ hetzner_installimage_expected_disks }}"
      loop_control:
        label: "{{ item.serial }}"
      register: _hetzner_smart_attributes
      changed_when: false

    - name: Require ATA SMART sector counters within inventory policy
      vars:
        _smart_attribute_json: "{{ item.stdout | from_json }}"
        _smart_attribute_table: >-
          {{
            _smart_attribute_json.ata_smart_attributes.table
            | default([], true)
          }}
        _smart_policy_effective: >-
          {{
            hetzner_baremetal_smart_policy
            | combine(
                (hetzner_baremetal_smart_overrides | default({}))[
                  item.item.serial
                ]
                | default({})
              )
          }}
        _smart_reallocated: >-
          {{
            _smart_attribute_table
            | selectattr('id', 'equalto', 5)
            | map(attribute='raw.value')
            | first
            | default(0, true)
            | int
          }}
        _smart_pending: >-
          {{
            _smart_attribute_table
            | selectattr('id', 'equalto', 197)
            | map(attribute='raw.value')
            | first
            | default(0, true)
            | int
          }}
        _smart_uncorrectable: >-
          {{
            _smart_attribute_table
            | selectattr('id', 'equalto', 198)
            | map(attribute='raw.value')
            | first
            | default(0, true)
            | int
          }}
      ansible.builtin.assert:
        that:
          - _smart_attribute_json is mapping
          - _smart_attribute_json.ata_smart_attributes is mapping
          - _smart_attribute_table | type_debug == 'list'
          - >-
            _smart_reallocated | int
            <= _smart_policy_effective.reallocated_sectors_max | int
          - >-
            _smart_pending | int
            <= _smart_policy_effective.current_pending_sectors_max | int
          - >-
            _smart_uncorrectable | int
            <= _smart_policy_effective.offline_uncorrectable_sectors_max | int
        fail_msg: "SMART sector policy failed for {{ item.item.serial }}."
      loop: "{{ _hetzner_smart_attributes.results }}"
      loop_control:
        label: "{{ item.item.serial }}"
      when: _hetzner_smart_protocol_by_serial[item.item.serial] == 'ATA'

    - name: Require NVMe health and endurance within explicit inventory policy
      vars:
        _smart_attribute_json: "{{ item.stdout | from_json }}"
        _nvme_health: >-
          {{
            _smart_attribute_json.nvme_smart_health_information_log
            | default({}, true)
          }}
        _smart_policy_effective: >-
          {{
            hetzner_baremetal_smart_policy
            | combine(
                (hetzner_baremetal_smart_overrides | default({}))[
                  item.item.serial
                ]
                | default({})
              )
          }}
        _nvme_required_policy_fields:
          - nvme_critical_warning_allowed_mask
          - nvme_media_errors_max
          - nvme_error_log_entries_max
          - nvme_percentage_used_max
          - nvme_available_spare_min
      ansible.builtin.assert:
        that:
          - _smart_attribute_json is mapping
          - _nvme_health is mapping
          - >-
            _nvme_required_policy_fields
            | difference(_smart_policy_effective.keys() | list)
            | length == 0
          - >-
            _smart_policy_effective.get(
              'nvme_critical_warning_allowed_mask', none
            )
            | type_debug == 'int'
          - >-
            _smart_policy_effective.get(
              'nvme_critical_warning_allowed_mask', -1
            ) | int
            == 0
          - >-
            _smart_policy_effective.get('nvme_media_errors_max', none)
            | type_debug == 'int'
          - _smart_policy_effective.get('nvme_media_errors_max', -1) | int >= 0
          - >-
            _smart_policy_effective.get('nvme_error_log_entries_max', none)
            | type_debug == 'int'
          - >-
            _smart_policy_effective.get('nvme_error_log_entries_max', -1)
            | int >= 0
          - >-
            _smart_policy_effective.get('nvme_percentage_used_max', none)
            | type_debug == 'int'
          - >-
            _smart_policy_effective.get('nvme_percentage_used_max', -1) | int
            >= 0
          - >-
            _smart_policy_effective.get('nvme_percentage_used_max', 101) | int
            <= 100
          - >-
            _smart_policy_effective.get('nvme_available_spare_min', none)
            | type_debug == 'int'
          - >-
            _smart_policy_effective.get('nvme_available_spare_min', -1) | int
            >= 0
          - >-
            _smart_policy_effective.get('nvme_available_spare_min', 101) | int
            <= 100
          - _nvme_health.critical_warning | type_debug == 'int'
          - >-
            _nvme_health.critical_warning | int
            ==
            _smart_policy_effective.get(
              'nvme_critical_warning_allowed_mask', -1
            ) | int
          - _nvme_health.media_errors | type_debug == 'int'
          - >-
            _nvme_health.media_errors | int
            <= _smart_policy_effective.get('nvme_media_errors_max', -1) | int
          - _nvme_health.percentage_used | type_debug == 'int'
          - _nvme_health.num_err_log_entries | type_debug == 'int'
          - >-
            _nvme_health.num_err_log_entries | int
            <=
            _smart_policy_effective.get('nvme_error_log_entries_max', -1)
            | int
          - >-
            _nvme_health.percentage_used | int
            <=
            _smart_policy_effective.get('nvme_percentage_used_max', -1) | int
          - _nvme_health.available_spare | type_debug == 'int'
          - _nvme_health.available_spare_threshold | type_debug == 'int'
          - >-
            _nvme_health.available_spare | int
            >=
            [
              _nvme_health.available_spare_threshold | int,
              _smart_policy_effective.get('nvme_available_spare_min', 101)
              | int
            ] | max
        fail_msg: >-
          NVMe critical warning, media-error, error-log, endurance, or spare
          policy failed for {{ item.item.serial }}. NVMe thresholds must be
          explicit in inventory and critical-warning exceptions are not
          accepted.
      loop: "{{ _hetzner_smart_attributes.results }}"
      loop_control:
        label: "{{ item.item.serial }}"
      when: _hetzner_smart_protocol_by_serial[item.item.serial] == 'NVMe'

    - name: Verify Rescue DNS and HTTPS egress
      ansible.builtin.uri:
        url: https://archive.ubuntu.com/ubuntu/
        method: HEAD
        return_content: false
        status_code:
          - 200
          - 301
          - 302
        timeout: 20

- name: Validate Rescue vSwitch and MGMT data plane
  hosts: hetzner_baremetal
  gather_facts: false
  become: false
  any_errors_fatal: true
  strategy: linear

  vars:
    ansible_user: root
    ansible_become: false
    ansible_ssh_common_args: >-
      -o UserKnownHostsFile={{ hetzner_baremetal_rescue_known_hosts_path }}
      -o StrictHostKeyChecking=yes
      -o IdentitiesOnly=yes
    _hetzner_rescue_mgmt_probe_vlan_interface: >-
      litv{{ mgmt_transport.vlan_id }}

  tasks:
    - name: Read the inventory MGMT parent interface
      ansible.builtin.command:
        argv:
          - ip
          - -j
          - link
          - show
          - dev
          - "{{ mgmt_network.parent_interface }}"
      register: _hetzner_rescue_mgmt_probe_parent
      changed_when: false
      failed_when: false

    - name: Require the inventory MGMT parent interface in Rescue
      ansible.builtin.assert:
        that:
          - _hetzner_rescue_mgmt_probe_parent.rc == 0
          - >-
            _hetzner_rescue_mgmt_probe_parent.stdout | from_json
            | length == 1
        fail_msg: >-
          Rescue does not expose inventory parent interface
          {{ mgmt_network.parent_interface }} on {{ inventory_hostname }}.
        quiet: true

    - name: Read existing Rescue addresses
      ansible.builtin.command:
        argv:
          - ip
          - -j
          - address
          - show
      register: _hetzner_rescue_mgmt_probe_addresses_before
      changed_when: false

    - name: Check for a colliding Rescue probe VLAN interface
      ansible.builtin.command:
        argv:
          - ip
          - link
          - show
          - dev
          - "{{ _hetzner_rescue_mgmt_probe_vlan_interface }}"
      register: _hetzner_rescue_mgmt_probe_vlan_before
      changed_when: false
      failed_when: false

    - name: Refuse Rescue probe interface or address collisions
      ansible.builtin.assert:
        that:
          - >-
            mgmt_network.ipv4 not in
            (
              _hetzner_rescue_mgmt_probe_addresses_before.stdout
              | from_json
              | map(attribute='addr_info')
              | flatten
              | selectattr('family', 'equalto', 'inet')
              | map(attribute='local')
              | list
            )
          - _hetzner_rescue_mgmt_probe_vlan_before.rc != 0
        fail_msg: >-
          The probe-owned interface name or inventory MGMT address already
          exists. Refusing to reuse or delete pre-existing Rescue state.
        quiet: true

    - name: Exercise the inventory MGMT network on a temporary VLAN
      block:
        - name: Create and own the inventory-tagged Rescue probe VLAN
          ansible.builtin.command:
            argv:
              - ip
              - link
              - add
              - link
              - "{{ mgmt_network.parent_interface }}"
              - name
              - "{{ _hetzner_rescue_mgmt_probe_vlan_interface }}"
              - type
              - vlan
              - id
              - "{{ mgmt_transport.vlan_id | string }}"
          register: _hetzner_rescue_mgmt_probe_vlan_create
          changed_when: _hetzner_rescue_mgmt_probe_vlan_create.rc == 0

        - name: Apply the inventory MTU to the Rescue probe VLAN
          ansible.builtin.command:
            argv:
              - ip
              - link
              - set
              - dev
              - "{{ _hetzner_rescue_mgmt_probe_vlan_interface }}"
              - mtu
              - "{{ mgmt_transport.mtu | string }}"
          changed_when: true

        - name: Bring up the Rescue probe VLAN
          ansible.builtin.command:
            argv:
              - ip
              - link
              - set
              - dev
              - "{{ _hetzner_rescue_mgmt_probe_vlan_interface }}"
              - up
          changed_when: true

        - name: Assign the inventory MGMT address to the probe VLAN
          ansible.builtin.command:
            argv:
              - ip
              - address
              - add
              - >-
                {{
                  mgmt_network.ipv4
                  ~ '/'
                  ~ (mgmt_subnet.prefix_length | string)
                }}
              - dev
              - "{{ _hetzner_rescue_mgmt_probe_vlan_interface }}"
          changed_when: true

        - name: Read the configured Rescue probe VLAN
          ansible.builtin.command:
            argv:
              - ip
              - -d
              - -j
              - link
              - show
              - dev
              - "{{ _hetzner_rescue_mgmt_probe_vlan_interface }}"
          register: _hetzner_rescue_mgmt_probe_vlan_state
          changed_when: false

        - name: Read the configured Rescue MGMT address
          ansible.builtin.command:
            argv:
              - ip
              - -j
              - address
              - show
              - dev
              - "{{ _hetzner_rescue_mgmt_probe_vlan_interface }}"
          register: _hetzner_rescue_mgmt_probe_address_state
          changed_when: false

        - name: Require the inventory VLAN, MTU, and MGMT address in Rescue
          vars:
            _hetzner_rescue_mgmt_probe_vlan_json: >-
              {{
                (_hetzner_rescue_mgmt_probe_vlan_state.stdout | from_json)[0]
              }}
            _hetzner_rescue_mgmt_probe_address_json: >-
              {{
                (
                  _hetzner_rescue_mgmt_probe_address_state.stdout
                  | from_json
                )[0]
              }}
          ansible.builtin.assert:
            that:
              - >-
                _hetzner_rescue_mgmt_probe_vlan_json.linkinfo.info_data.id
                | int == mgmt_transport.vlan_id | int
              - >-
                _hetzner_rescue_mgmt_probe_vlan_json.mtu | int
                == mgmt_transport.mtu | int
              - >-
                mgmt_network.ipv4 in
                (
                  _hetzner_rescue_mgmt_probe_address_json.addr_info
                  | selectattr('family', 'equalto', 'inet')
                  | map(attribute='local')
                  | list
                )
            fail_msg: >-
              The temporary Rescue VLAN does not match the inventory MGMT
              VLAN, MTU, or address.
            quiet: true

        - name: Build the selected-play peer MGMT address list
          ansible.builtin.set_fact:
            _hetzner_rescue_mgmt_probe_peer_ips: >-
              {{
                ansible_play_hosts_all
                | reject('equalto', inventory_hostname)
                | map('extract', hostvars)
                | map(attribute='mgmt_network.ipv4')
                | unique
                | sort
                | list
              }}
          changed_when: false

        - name: Require every selected peer MGMT address
          ansible.builtin.assert:
            that:
              - >-
                _hetzner_rescue_mgmt_probe_peer_ips | length
                == ansible_play_hosts_all | length - 1
              - >-
                mgmt_network.ipv4
                not in _hetzner_rescue_mgmt_probe_peer_ips
            fail_msg: >-
              The selected-play MGMT peer address set is incomplete or
              contains a duplicate inventory allocation.
            quiet: true

        - name: Probe every selected peer MGMT address
          ansible.builtin.command:
            argv:
              - ping
              - -n
              - -c
              - "3"
              - -W
              - "3"
              - -I
              - "{{ _hetzner_rescue_mgmt_probe_vlan_interface }}"
              - "{{ item }}"
          loop: "{{ _hetzner_rescue_mgmt_probe_peer_ips }}"
          loop_control:
            label: "{{ item }}"
          changed_when: false

        - name: Probe the declared inventory MGMT gateway
          ansible.builtin.command:
            argv:
              - ping
              - -n
              - -c
              - "3"
              - -W
              - "3"
              - -I
              - "{{ _hetzner_rescue_mgmt_probe_vlan_interface }}"
              - "{{ mgmt_subnet.gateway }}"
          changed_when: false
          when: >-
            mgmt_subnet.gateway
            | default('', true)
            | string
            | trim
            | length > 0

      always:
        - name: Remove the owned Rescue probe VLAN
          ansible.builtin.command:
            argv:
              - ip
              - link
              - delete
              - dev
              - "{{ _hetzner_rescue_mgmt_probe_vlan_interface }}"
          register: _hetzner_rescue_mgmt_probe_vlan_remove
          changed_when: _hetzner_rescue_mgmt_probe_vlan_remove.rc == 0
          failed_when: false
          when:
            - _hetzner_rescue_mgmt_probe_vlan_create is defined
            - _hetzner_rescue_mgmt_probe_vlan_create.rc | default(1) == 0

        - name: Check the probe VLAN after cleanup
          ansible.builtin.command:
            argv:
              - ip
              - link
              - show
              - dev
              - "{{ _hetzner_rescue_mgmt_probe_vlan_interface }}"
          register: _hetzner_rescue_mgmt_probe_vlan_after
          changed_when: false
          failed_when: false

        - name: Require complete cleanup of owned Rescue probe state
          ansible.builtin.assert:
            that:
              - >-
                (
                  _hetzner_rescue_mgmt_probe_vlan_create is not defined
                  or _hetzner_rescue_mgmt_probe_vlan_create.rc
                  | default(1) != 0
                )
                or _hetzner_rescue_mgmt_probe_vlan_after.rc != 0
            fail_msg: >-
              Cleanup did not remove all probe-owned Rescue network state.
              Manual inspection is required before retrying.
            quiet: true
