---
# Ensure every selected host has one persistent LUKS recovery passphrase in
# the inventory-declared HashiCorp Vault KV v2 path. Existing records are never
# overwritten when the required field is absent.
- name: PreCheck (require a safe target limit)
  hosts: hetzner_baremetal
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Require an explicit limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | string | trim | length > 0
        fail_msg: >-
          This runbook requires --limit with the intended host or group.
      run_once: true
      tags: [always]

- name: Ensure LUKS recovery secrets exist
  hosts: hetzner_baremetal
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true
  serial: 1

  pre_tasks:
    - name: Validate Vault inventory contract
      ansible.builtin.assert:
        that:
          - hetzner_baremetal_vault is mapping
          - >-
            hetzner_baremetal_vault.engine_mount_point
            | default('', true) | length > 0
          - >-
            hetzner_baremetal_vault_secret_path
            | default('', true) | length > 0
          - >-
            hetzner_baremetal_vault.recovery_passphrase_field
            | default('', true) | length > 0
          - lookup('ansible.builtin.env', 'VAULT_ADDR') | length > 0
          - lookup('ansible.builtin.env', 'VAULT_TOKEN') | length > 0
        fail_msg: "Vault policy or VAULT_ADDR/VAULT_TOKEN is missing."
      tags: [always]

  tasks:
    - name: Read the existing per-host Vault document
      community.hashi_vault.vault_kv2_get:
        engine_mount_point: "{{ hetzner_baremetal_vault.engine_mount_point }}"
        path: "{{ hetzner_baremetal_vault_secret_path }}"
      register: _hetzner_recovery_secret_initial
      failed_when: false
      no_log: true

    - name: Reject an existing document without a recovery passphrase
      ansible.builtin.assert:
        that:
          - >-
            _hetzner_recovery_secret_initial.secret is not defined
            or
            _hetzner_recovery_secret_initial.secret[
              hetzner_baremetal_vault.recovery_passphrase_field
            ] | default('', true) | length >= 40
        fail_msg: >-
          The Vault document exists but has no valid recovery passphrase.
          Repair it explicitly; this workflow will not overwrite it.
      no_log: true

    - name: Generate a recovery passphrase only for an absent document
      ansible.builtin.set_fact:
        _hetzner_recovery_generated: >-
          {{
            lookup(
              'community.general.random_string',
              length=64,
              special=false
            )
          }}
      when: _hetzner_recovery_secret_initial.secret is not defined
      no_log: true

    - name: Create the absent Vault document with CAS zero
      community.hashi_vault.vault_kv2_write:
        engine_mount_point: "{{ hetzner_baremetal_vault.engine_mount_point }}"
        path: "{{ hetzner_baremetal_vault_secret_path }}"
        cas: 0
        data: >-
          {{
            {
              hetzner_baremetal_vault.recovery_passphrase_field:
                _hetzner_recovery_generated
            }
          }}
      when: _hetzner_recovery_secret_initial.secret is not defined
      no_log: true

    - name: Verify the persisted recovery passphrase
      community.hashi_vault.vault_kv2_get:
        engine_mount_point: "{{ hetzner_baremetal_vault.engine_mount_point }}"
        path: "{{ hetzner_baremetal_vault_secret_path }}"
      register: _hetzner_recovery_secret_verified
      no_log: true

    - name: Validate the persisted recovery passphrase without displaying it
      ansible.builtin.assert:
        that:
          - >-
            _hetzner_recovery_secret_verified.secret[
              hetzner_baremetal_vault.recovery_passphrase_field
            ] | default('', true) | length >= 40
        fail_msg: >-
          Vault did not return a valid persisted recovery passphrase.
      no_log: true
