---
# Interactively create or verify one immutable controller-local Ansible
# Vault-encrypted Hetzner Robot API credential document. Prompt values never
# enter the environment, command arguments, or a plaintext file.
- name: PreCheck (require a safe Robot credential target)
  hosts: hetzner_baremetal
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true

  tasks:
    - name: Require the exact inventory group limit and write mode
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | string | trim == 'hetzner_baremetal'
          - >-
            ansible_play_hosts_all | sort
            == groups['hetzner_baremetal'] | sort
          - not ansible_check_mode
        fail_msg: >-
          Use --limit hetzner_baremetal without --check so one shared encrypted
          Robot credential document is created or verified for this inventory.
        quiet: true
      tags: [always]

    - name: Validate the encrypted Robot credential path and size contract
      ansible.builtin.include_tasks: tasks/validate-robot-credential-path.yml
      no_log: true
      tags: [always]

- name: Create or verify encrypted Hetzner Robot API credentials
  hosts: hetzner_baremetal[0]
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true

  vars_prompt:
    - name: _hetzner_robot_prompt_user
      prompt: Enter the current Hetzner Robot webservice username
      private: true
      confirm: true
      unsafe: true
    - name: _hetzner_robot_prompt_password
      prompt: Enter the current Hetzner Robot webservice password
      private: true
      confirm: true
      unsafe: true

  pre_tasks:
    - name: Validate private Robot credential prompts
      ansible.builtin.assert:
        that:
          - _hetzner_robot_prompt_user is string
          - _hetzner_robot_prompt_user | length > 0
          - >-
            _hetzner_robot_prompt_user | length
            <= hetzner_baremetal_robot_credentials.username_max_length
          - >-
            _hetzner_robot_prompt_user
            == _hetzner_robot_prompt_user | trim
          - _hetzner_robot_prompt_password is string
          - _hetzner_robot_prompt_password | length > 0
          - >-
            _hetzner_robot_prompt_password | length
            <= hetzner_baremetal_robot_credentials.password_max_length
        fail_msg: >-
          Both private Robot credential prompts must be non-empty and within
          the inventory-declared length limits.
        quiet: true
      no_log: true
      tags: [always]

  tasks:
    - name: Build the exact Robot credential document in protected memory
      ansible.builtin.set_fact:
        _hetzner_robot_credentials_expected_document:
          schema_version: >-
            {{ hetzner_baremetal_robot_credentials.schema_version }}
          subject: "{{ hetzner_baremetal_robot_credentials.subject }}"
          username: "{{ _hetzner_robot_prompt_user }}"
          password: "{{ _hetzner_robot_prompt_password }}"
      no_log: true

    - name: Create or require exact immutable Robot credential ciphertext
      lit.foundational.ansible_vault_document:
        path: "{{ _hetzner_robot_credentials_path_normalized }}"
        document: "{{ _hetzner_robot_credentials_expected_document }}"
      register: _hetzner_robot_credentials_ensure
      no_log: true

    - name: Read back exact immutable Robot credential ciphertext
      lit.foundational.ansible_vault_document:
        path: "{{ _hetzner_robot_credentials_path_normalized }}"
        document: "{{ _hetzner_robot_credentials_expected_document }}"
      register: _hetzner_robot_credentials_verified
      no_log: true

    - name: Require exact immutable ciphertext verification
      ansible.builtin.assert:
        that:
          - _hetzner_robot_credentials_ensure.exists | default(false)
          - _hetzner_robot_credentials_verified.exists | default(false)
          - not (_hetzner_robot_credentials_verified.created | default(false))
          - not (_hetzner_robot_credentials_verified.changed | default(false))
          - >-
            _hetzner_robot_credentials_ensure.ciphertext_sha256
            == _hetzner_robot_credentials_verified.ciphertext_sha256
          - >-
            _hetzner_robot_credentials_verified.ciphertext_sha256
            | default('') is match('^[0-9a-f]{64}$')
          - >-
            _hetzner_robot_credentials_verified.path
            == _hetzner_robot_credentials_path_normalized
        fail_msg: >-
          The encrypted Robot credential document did not pass exact immutable
          readback verification.
        quiet: true
      no_log: true

    - name: Resolve and validate the encrypted Robot credential document
      ansible.builtin.include_tasks: tasks/resolve-robot-credentials.yml
      no_log: true

    - name: Report encrypted Robot credential readiness
      ansible.builtin.debug:
        msg: >-
          The inventory-declared Robot credential ciphertext exists and passed
          exact immutable schema and readback verification.
