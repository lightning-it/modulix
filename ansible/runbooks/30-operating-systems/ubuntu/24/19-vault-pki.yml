---
# Guarded single-host lifecycle for a private self-signed Vault PKI.
- name: Plan, apply, or read back the Wunderbox Vault PKI
  hosts: hetzner_baremetal
  gather_facts: false
  become: true
  any_errors_fatal: true
  serial: 1

  vars:
    _vault_pki_action: "{{ vault_pki_action | default('plan') }}"
    _vault_pki_contract: "{{ wunderbox_vault_pki | default({}) }}"
    _vault_pki_root_mount: "{{ _vault_pki_contract.root.mount | default('') }}"
    _vault_pki_intermediate_mount: >-
      {{ _vault_pki_contract.intermediate.mount | default('') }}
    _vault_pki_role_name: "{{ _vault_pki_contract.leaf_role.name | default('') }}"
    _vault_pki_issue_path: >-
      {{ _vault_pki_intermediate_mount }}/issue/{{ _vault_pki_role_name }}
    _vault_pki_candidate:
      schema_version: 1
      host: "{{ inventory_hostname }}"
      work_item: "{{ _vault_pki_contract.work_item | default('') }}"
      trust_model: "{{ _vault_pki_contract.trust_model | default('') }}"
      public_ca_or_acme_dependency_allowed: >-
        {{ _vault_pki_contract.public_ca_or_acme_dependency_allowed | default(true) }}
      terraform_source: "{{ vault_terraform_source }}"
      state_moves: "{{ vault_config_terragrunt_state_moves | default([]) }}"
      state_removals: "{{ vault_config_terragrunt_state_removals | default([]) }}"
      auth_backends: "{{ vault_auth_backends | default([]) }}"
      root: "{{ _vault_pki_contract.root | default({}) }}"
      intermediate: "{{ _vault_pki_contract.intermediate | default({}) }}"
      leaf_role: "{{ _vault_pki_contract.leaf_role | default({}) }}"
      controller_policy_sha256: >-
        {{ hetzner_baremetal_vault.controller_auth.policy | hash('sha256') }}
    _vault_pki_candidate_sha256: >-
      {{ _vault_pki_candidate | to_json | hash('sha256') }}
    _vault_pki_expected_confirmation: >-
      APPLY-WUNDERBOX-VAULT-PKI:{{ inventory_hostname }}:{{ _vault_pki_candidate_sha256 }}
    _vault_pki_expected_capabilities: >-
      {{
        {
          (_vault_pki_root_mount ~ '/ca/pem'): ['read'],
          (_vault_pki_intermediate_mount ~ '/ca/pem'): ['read'],
          (_vault_pki_intermediate_mount ~ '/ca_chain'): ['read'],
          (
            _vault_pki_intermediate_mount ~ '/roles/' ~ _vault_pki_role_name
          ): ['read'],
          _vault_pki_issue_path: ['create', 'update']
        }
      }}

    vault_scoped_approle_api_url: "{{ hetzner_baremetal_vault.api_addr }}"
    vault_scoped_approle_health_url: >-
      {{ hetzner_baremetal_vault.api_addr }}/v1/sys/health
    vault_scoped_approle_api_delegate_to: localhost
    vault_scoped_approle_validate_certs: true
    vault_scoped_approle_ca_cert_path: "{{ hetzner_baremetal_vault.ca_cert_path }}"
    vault_scoped_approle_timeout: "{{ hetzner_baremetal_vault.timeout }}"
    vault_scoped_approle_revoke_admin_token: false
    vault_scoped_approle_kv_mount_point: >-
      {{ hetzner_baremetal_vault.engine_mount_point }}
    vault_scoped_approle_auth_mount_point: >-
      {{ hetzner_baremetal_vault.controller_auth.auth_mount_point }}
    vault_scoped_approle_role_name: >-
      {{ hetzner_baremetal_vault.controller_auth.role_name }}
    vault_scoped_approle_policy_name: >-
      {{ hetzner_baremetal_vault.controller_auth.policy_name }}
    vault_scoped_approle_policy: >-
      {{ hetzner_baremetal_vault.controller_auth.policy }}
    vault_scoped_approle_token_type: >-
      {{ hetzner_baremetal_vault.controller_auth.token_type }}
    vault_scoped_approle_token_ttl: >-
      {{ hetzner_baremetal_vault.controller_auth.token_ttl }}
    vault_scoped_approle_token_ttl_seconds: >-
      {{ hetzner_baremetal_vault.controller_auth.token_ttl_seconds }}
    vault_scoped_approle_token_max_ttl: >-
      {{ hetzner_baremetal_vault.controller_auth.token_max_ttl }}
    vault_scoped_approle_token_max_ttl_seconds: >-
      {{ hetzner_baremetal_vault.controller_auth.token_max_ttl_seconds }}
    vault_scoped_approle_token_num_uses: >-
      {{ hetzner_baremetal_vault.controller_auth.token_num_uses }}
    vault_scoped_approle_secret_id_ttl: >-
      {{ hetzner_baremetal_vault.controller_auth.secret_id_ttl }}
    vault_scoped_approle_secret_id_num_uses: >-
      {{ hetzner_baremetal_vault.controller_auth.secret_id_num_uses }}
    vault_scoped_approle_controller_escrow_root_path: >-
      {{ hetzner_baremetal_vault.seal.controller_init_escrow_root_path }}
    vault_scoped_approle_controller_document_path: >-
      {{ hetzner_baremetal_vault.controller_auth.ansible_vault_path }}
    vault_scoped_approle_document_schema_version: >-
      {{ hetzner_baremetal_vault.controller_auth.schema_version }}
    vault_scoped_approle_document_subject: >-
      {{ hetzner_baremetal_vault.controller_auth.subject }}
    vault_scoped_approle_capability_probes: >-
      {{ hetzner_baremetal_vault.controller_auth.capability_probes }}

  pre_tasks:
    - name: Require one exact Vault PKI target and action
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit | string | trim == inventory_hostname
          - inventory_hostname == hetzner_baremetal_vault.host
          - _vault_pki_action in ['plan', 'apply', 'readback']
          - not ansible_check_mode
        fail_msg: >-
          Use --limit with the exact inventory-declared Vault host and select
          vault_pki_action=plan, apply, or readback without --check.
        quiet: true
      tags: [always]

    - name: Validate the private Vault PKI contract
      ansible.builtin.assert:
        that:
          - _vault_pki_contract is mapping
          - _vault_pki_contract.schema_version | int == 1
          - _vault_pki_contract.work_item == 'LI-139'
          - _vault_pki_contract.trust_model == 'private_self_signed_root_with_vault_intermediate'
          - _vault_pki_contract.public_ca_or_acme_dependency_allowed is sameas false
          - _vault_pki_root_mount is match('^[a-z0-9][a-z0-9-]{2,63}$')
          - _vault_pki_contract.root.algorithm == 'ec'
          - _vault_pki_contract.root.bits | int == 384
          - _vault_pki_contract.root.ttl_seconds is integer
          - _vault_pki_contract.root.subject.country == 'DE'
          - _vault_pki_contract.root.subject.province == 'NRW'
          - _vault_pki_contract.root.subject.locality == 'Bonn'
          - _vault_pki_contract.root.subject.organization == 'Lightning IT GmbH'
          - _vault_pki_contract.root.subject.organizational_unit == 'IT'
          - _vault_pki_intermediate_mount is match('^[a-z0-9][a-z0-9-]{2,63}$')
          - _vault_pki_intermediate_mount != _vault_pki_root_mount
          - _vault_pki_contract.intermediate.signer_root_mount == _vault_pki_root_mount
          - _vault_pki_contract.intermediate.algorithm == 'ec'
          - _vault_pki_contract.intermediate.bits | int == 384
          - _vault_pki_contract.intermediate.ttl_seconds is integer
          - _vault_pki_contract.intermediate.subject == _vault_pki_contract.root.subject
          - _vault_pki_contract.intermediate.ttl_seconds | int < _vault_pki_contract.root.ttl_seconds | int
          - _vault_pki_role_name is match('^[a-z0-9][a-z0-9_-]{2,63}$')
          - _vault_pki_contract.leaf_role.allowed_dns_names is sequence
          - _vault_pki_contract.leaf_role.allowed_dns_names is not string
          - _vault_pki_contract.leaf_role.allowed_dns_names | length == 3
          - _vault_pki_contract.leaf_role.allowed_dns_names | unique | length == 3
          - _vault_pki_contract.leaf_role.allow_subdomains is sameas false
          - _vault_pki_contract.leaf_role.allow_glob_domains is sameas false
          - _vault_pki_contract.leaf_role.allow_ip_sans is sameas false
          - _vault_pki_contract.leaf_role.allow_localhost is sameas false
          - _vault_pki_contract.leaf_role.ttl_seconds is integer
          - _vault_pki_contract.leaf_role.ttl_seconds | int < _vault_pki_contract.intermediate.ttl_seconds | int
          - vault_pki_issue_mount == _vault_pki_intermediate_mount
          - vault_pki_issue_role == _vault_pki_role_name
          - vault_pki_roots | length == 1
          - vault_pki_intermediates | length == 1
          - vault_pki_roles | length == 1
          - vault_policies | length == 1
          - vault_policies[0].name == hetzner_baremetal_vault.controller_auth.policy_name
          - vault_policies[0].policy == hetzner_baremetal_vault.controller_auth.policy
          - >-
            _vault_pki_contract.leaf_role.allowed_dns_names | sort
            == nginx_config_vhosts | map(attribute='server_name') | list | sort
          - >-
            hetzner_baremetal_vault.controller_auth.policy
            is search('path "' ~ _vault_pki_issue_path ~ '"')
        fail_msg: >-
          The private self-signed Vault PKI hierarchy, exact DNS role, or
          controller policy mapping is incomplete or unsafe.
        quiet: true
      tags: [always]

    - name: Require the exact candidate-bound apply confirmation
      ansible.builtin.assert:
        that:
          - vault_pki_confirmation | default('') == _vault_pki_expected_confirmation
        fail_msg: "Apply requires {{ _vault_pki_expected_confirmation }}."
        quiet: true
      when: _vault_pki_action == 'apply'
      tags: [always]

    - name: Report the private Vault PKI candidate
      ansible.builtin.debug:
        msg:
          action: "{{ _vault_pki_action }}"
          candidate_sha256: "{{ _vault_pki_candidate_sha256 }}"
          confirmation: "{{ _vault_pki_expected_confirmation }}"
          trust_model: "{{ _vault_pki_contract.trust_model }}"
          root_mount: "{{ _vault_pki_root_mount }}"
          intermediate_mount: "{{ _vault_pki_intermediate_mount }}"
          leaf_role: "{{ _vault_pki_role_name }}"
          allowed_dns_names: "{{ _vault_pki_contract.leaf_role.allowed_dns_names }}"
          public_ca_or_acme_dependency_allowed: false
      tags: [always]

  tasks:
    - name: Restore controller Vault inputs through managed SSH
      ansible.builtin.include_tasks: tasks/restore-vault-controller-inputs.yml

    - name: Execute the private PKI lifecycle through the controller tunnel
      block:
        - name: Resolve scoped controller HashiCorp Vault authentication
          ansible.builtin.include_tasks: >-
            ../../../00-common/tasks/resolve-hashicorp-vault-auth.yml
          when: _vault_pki_action == 'readback'
          no_log: true

        - name: Establish the inventory-declared controller Vault SSH tunnel
          ansible.builtin.include_tasks: >-
            ../../../00-common/tasks/ensure-hashicorp-vault-ssh-tunnel.yml
          when: _vault_pki_action != 'readback'

        - name: Validate active and unsealed Vault health
          ansible.builtin.uri:
            url: "{{ hetzner_baremetal_vault.api_addr }}/v1/sys/health"
            method: GET
            validate_certs: true
            ca_path: "{{ hetzner_baremetal_vault.ca_cert_path }}"
            status_code: 200
            timeout: "{{ hetzner_baremetal_vault.timeout }}"
          register: _vault_pki_health
          until: _vault_pki_health.status | default(-1) | int == 200
          retries: "{{ hetzner_baremetal_vault.retries }}"
          delay: 2
          delegate_to: localhost
          become: false
          changed_when: false

        - name: Require active and unsealed Vault health
          ansible.builtin.assert:
            that:
              - _vault_pki_health.json.initialized | bool
              - not (_vault_pki_health.json.sealed | bool)
              - not (_vault_pki_health.json.standby | bool)
            fail_msg: "Vault must be initialized, active, and unsealed."
            quiet: true

        - name: End after the read-only PKI plan
          ansible.builtin.meta: end_play
          when: _vault_pki_action == 'plan'

        - name: Apply the private PKI hierarchy
          ansible.builtin.include_tasks: tasks/apply-vault-pki.yml
          when: _vault_pki_action == 'apply'

        - name: Read back the private PKI hierarchy
          ansible.builtin.include_tasks: tasks/readback-vault-pki.yml

      always:
        - name: Close the inventory-declared controller Vault transport
          ansible.builtin.include_tasks: >-
            ../../../00-common/tasks/close-hashicorp-vault-ssh-tunnel.yml
          tags: [always]
