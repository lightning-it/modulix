---
- name: PreCheck
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Verify that a limit is set
      ansible.builtin.fail:
        msg: "This runbook cannot be run without --limit. Please use --limit <host-or-group>."
      run_once: true
      when: ansible_limit is not defined
      tags:
        - always

    - name: Show limit
      ansible.builtin.debug:
        msg: "Limit is {{ ansible_limit }}, continuing."
      run_once: true
      when: ansible_limit is defined
      tags:
        - always

- name: Prepare Ansible remote tmp on RHEL hosts
  hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Bootstrap custom Ansible remote tmp when configured
      ansible.builtin.include_role:
        name: lit.foundational.ansible_remote_tmp
        apply:
          tags: [ansible_remote_tmp]
      vars:
        ansible_remote_tmp_path: "{{ ansible_remote_tmp | default('', true) }}"
      when:
        - ansible_remote_tmp | default('', true) | trim | length > 0
      tags:
        - ansible_remote_tmp
        - always
