---
# -----------------------------------------------------------------------------
# RHEL9 - CIS One-Button Hardening (post Stage-2a base setup)
#
# Purpose:
# - Apply CIS baseline via lit.rhel.cis_rhel9
# - Produce reports to see what base setup missed and adjust base runbook accordingly
# -----------------------------------------------------------------------------
- name: CIS hardening (RHEL9)
  hosts: rhel9_cis_targets
  gather_facts: true
  become: true
  any_errors_fatal: true

  tasks:
    - name: CIS hardening
      ansible.builtin.import_role:
        name: lit.rhel.cis_rhel9
      tags: [cis, compliance]
