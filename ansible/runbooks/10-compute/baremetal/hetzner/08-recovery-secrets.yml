---
# Ensure every selected host has one persistent LUKS recovery passphrase in
# the explicitly selected backend. Bootstrap documents are Ansible
# Vault-encrypted controller files; HashiCorp Vault documents use KV v2 CAS.
# An independent 1Password backend creates its password inside 1Password and
# requires the resulting exact item ID to be pinned before any secret read.
- name: PreCheck (require a safe target limit)
  hosts: hetzner_baremetal
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Require an explicit limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | string | trim | length > 0
        fail_msg: >-
          This runbook requires --limit with the intended host or group.
      tags: [always]

- name: Ensure LUKS recovery secrets exist
  hosts: hetzner_baremetal
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true
  serial: 1

  pre_tasks:
    - name: Validate the recovery-secret backend selector
      ansible.builtin.assert:
        that:
          - >-
            hetzner_baremetal_secret_backend
            in ['ansible_vault_bootstrap', 'hashicorp_vault', 'onepassword_cli']
        fail_msg: >-
          hetzner_baremetal_secret_backend must be exactly
          ansible_vault_bootstrap, hashicorp_vault, or onepassword_cli.
        quiet: true
      tags: [always]

    - name: Validate the Ansible Vault bootstrap contract
      ansible.builtin.assert:
        that:
          - hetzner_baremetal_ansible_vault is mapping
          - >-
            hetzner_baremetal_ansible_vault.schema_version
            | default(0) | int == 1
          - >-
            hetzner_baremetal_ansible_vault.recovery_passphrase_length
            | default(0) | int >= 40
          - >-
            hetzner_baremetal_ansible_vault_secret_path
            | default('', true) | length > 0
          - >-
            lookup('ansible.builtin.env', 'PWD') | length > 0
          - >-
            hetzner_baremetal_vault.recovery_passphrase_field
            | default('', true) | length > 0
          - >-
            lookup(
              'ansible.builtin.env',
              'ANSIBLE_VAULT_PASSWORD_FILE'
            ) | length > 0
        fail_msg: >-
          The Ansible Vault bootstrap contract or password-file environment is
          incomplete, or the encrypted document is outside .secrets.
        quiet: true
      when: hetzner_baremetal_secret_backend == 'ansible_vault_bootstrap'
      no_log: true
      tags: [always]

    - name: Validate the independent 1Password root-of-trust contract
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit | string | trim == inventory_hostname
          - hetzner_baremetal_onepassword is mapping
          - hetzner_baremetal_onepassword.keys() | list | sort == [
              'account_id',
              'account_sign_in_address',
              'approval_authority',
              'cli_path',
              'cli_sha256',
              'cli_version',
              'authorized_user_uuids',
              'password_item',
              'schema_version',
              'ssh_agent',
              'ssh_key_item',
              'vault_id'
            ] | sort
          - >-
            hetzner_baremetal_onepassword_password_action
            | default('plan') in ['plan', 'apply']
          - >-
            hetzner_baremetal_onepassword_ssh_key_action
            | default('plan') in ['plan', 'apply']
          - hetzner_baremetal_onepassword.schema_version | int == 1
          - >-
            hetzner_baremetal_onepassword.cli_path
            | default('') is match('^/')
          - >-
            hetzner_baremetal_onepassword.cli_version
            | default('') is match('^[0-9]+\.[0-9]+\.[0-9]+$')
          - >-
            hetzner_baremetal_onepassword.cli_sha256
            | default('') is match('^[0-9a-f]{64}$')
          - hetzner_baremetal_onepassword.authorized_user_uuids is sequence
          - hetzner_baremetal_onepassword.authorized_user_uuids is not string
          - hetzner_baremetal_onepassword.authorized_user_uuids | length > 0
          - >-
            hetzner_baremetal_onepassword.authorized_user_uuids
            | select('match', '^[A-Z0-9]{26}$') | list | length
            == hetzner_baremetal_onepassword.authorized_user_uuids | length
          - >-
            hetzner_baremetal_onepassword.authorized_user_uuids
            | unique | length
            == hetzner_baremetal_onepassword.authorized_user_uuids | length
          - >-
            hetzner_baremetal_onepassword.account_id
            | default('') is match('^[A-Z0-9]{26}$')
          - >-
            hetzner_baremetal_onepassword.vault_id
            | default('') is match('^[a-z0-9]{26}$')
          - >-
            hetzner_baremetal_onepassword.account_sign_in_address
            | default('')
            is match('^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$')
          - hetzner_baremetal_onepassword.approval_authority is mapping
          - >-
            hetzner_baremetal_onepassword.approval_authority.keys()
            | list | sort == [
              'allowed_signers_path',
              'allowed_signers_sha256',
              'fingerprint',
              'identity',
              'namespace',
              'replay_directory',
              'schema_version',
              'ssh_keygen_path',
              'ssh_keygen_sha256'
            ] | sort
          - >-
            hetzner_baremetal_onepassword.approval_authority.schema_version
            | int == 1
          - >-
            hetzner_baremetal_onepassword.approval_authority.identity
            | default('') is match('^[A-Za-z0-9][A-Za-z0-9._@+-]{0,127}$')
          - >-
            hetzner_baremetal_onepassword.approval_authority.namespace
            == 'lit-onepassword-approval-v1'
          - >-
            hetzner_baremetal_onepassword.approval_authority.fingerprint
            | default('') is match('^SHA256:[A-Za-z0-9+/]{43}$')
          - >-
            hetzner_baremetal_onepassword.approval_authority.allowed_signers_path
            | default('') is match('^/')
          - >-
            hetzner_baremetal_onepassword.approval_authority.allowed_signers_sha256
            | default('') is match('^[0-9a-f]{64}$')
          - >-
            hetzner_baremetal_onepassword.approval_authority.replay_directory
            | default('') is match('^/')
          - >-
            hetzner_baremetal_onepassword.approval_authority.ssh_keygen_path
            | default('') is match('^/')
          - >-
            hetzner_baremetal_onepassword.approval_authority.ssh_keygen_sha256
            | default('') is match('^[0-9a-f]{64}$')
          - hetzner_baremetal_onepassword.password_item is mapping
          - hetzner_baremetal_onepassword.password_item.keys() | list | sort == [
              'category',
              'expected_length',
              'field_id',
              'item_id',
              'item_title',
              'item_version',
              'tags'
            ] | sort
          - hetzner_baremetal_onepassword.password_item.category == 'Password'
          - hetzner_baremetal_onepassword.password_item.field_id == 'password'
          - >-
            hetzner_baremetal_onepassword.password_item.item_title
            | default('', true) | length > 0
          - >-
            hetzner_baremetal_onepassword.password_item.item_id
            | default('') == ''
            or
            hetzner_baremetal_onepassword.password_item.item_id
            | default('') is match('^[a-z0-9]{26}$')
          - >-
            (
              hetzner_baremetal_onepassword.password_item.item_id
              | default('') | length > 0
            )
            ==
            (
              hetzner_baremetal_onepassword.password_item.item_version
              | default(0) | int > 0
            )
          - hetzner_baremetal_onepassword.password_item.tags is sequence
          - hetzner_baremetal_onepassword.password_item.tags is not string
          - hetzner_baremetal_onepassword.password_item.tags | length > 0
          - >-
            hetzner_baremetal_onepassword.password_item.tags | unique | length
            == hetzner_baremetal_onepassword.password_item.tags | length
          - >-
            hetzner_baremetal_onepassword.password_item.expected_length
            | int >= 40
          - >-
            hetzner_baremetal_onepassword.password_item.expected_length
            | int <= 64
          - hetzner_baremetal_onepassword.ssh_key_item is mapping
          - hetzner_baremetal_onepassword.ssh_key_item.keys() | list | sort == [
              'category',
              'expected_fingerprint',
              'item_id',
              'item_title',
              'item_version',
              'key_type',
              'tags'
            ] | sort
          - hetzner_baremetal_onepassword.ssh_key_item.category == 'SSH Key'
          - hetzner_baremetal_onepassword.ssh_key_item.key_type == 'ed25519'
          - >-
            hetzner_baremetal_onepassword.ssh_key_item.item_title
            | default('', true) | length > 0
          - >-
            hetzner_baremetal_onepassword.ssh_key_item.item_id
            | default('') == ''
            or
            hetzner_baremetal_onepassword.ssh_key_item.item_id
            | default('') is match('^[a-z0-9]{26}$')
          - >-
            (
              hetzner_baremetal_onepassword.ssh_key_item.item_id
              | default('') | length > 0
            )
            ==
            (
              hetzner_baremetal_onepassword.ssh_key_item.item_version
              | default(0) | int > 0
            )
          - >-
            hetzner_baremetal_onepassword.ssh_key_item.expected_fingerprint
            | default('') == ''
            or
            hetzner_baremetal_onepassword.ssh_key_item.expected_fingerprint
            is match('^SHA256:[A-Za-z0-9+/]{43}$')
          - hetzner_baremetal_onepassword.ssh_key_item.tags is sequence
          - hetzner_baremetal_onepassword.ssh_key_item.tags is not string
          - hetzner_baremetal_onepassword.ssh_key_item.tags | length > 0
          - >-
            hetzner_baremetal_onepassword.ssh_key_item.tags | unique | length
            == hetzner_baremetal_onepassword.ssh_key_item.tags | length
          - hetzner_baremetal_onepassword.ssh_agent is mapping
          - hetzner_baremetal_onepassword.ssh_agent.keys() | list | sort == [
              'agent_socket_path',
              'ssh_add_path',
              'ssh_add_sha256',
              'ssh_keygen_path',
              'ssh_keygen_sha256',
              'ssh_path',
              'ssh_sha256'
            ] | sort
          - >-
            hetzner_baremetal_onepassword.ssh_agent.agent_socket_path
            | default('') is match('^/')
          - >-
            hetzner_baremetal_onepassword.ssh_agent.ssh_add_path
            | default('') is match('^/')
          - >-
            hetzner_baremetal_onepassword.ssh_agent.ssh_keygen_path
            | default('') is match('^/')
          - >-
            hetzner_baremetal_onepassword.ssh_agent.ssh_path
            | default('') is match('^/')
          - >-
            hetzner_baremetal_onepassword.ssh_agent.ssh_sha256
            | default('') is match('^[0-9a-f]{64}$')
          - >-
            hetzner_baremetal_onepassword.ssh_agent.ssh_add_sha256
            | default('') is match('^[0-9a-f]{64}$')
          - >-
            hetzner_baremetal_onepassword.ssh_agent.ssh_keygen_sha256
            | default('') is match('^[0-9a-f]{64}$')
          - >-
            hetzner_baremetal_onepassword_password_action
            | default('plan') != 'apply'
            or not ansible_check_mode
          - >-
            hetzner_baremetal_onepassword_ssh_key_action
            | default('plan') != 'apply'
            or not ansible_check_mode
          - >-
            hetzner_baremetal_onepassword_password_action
            | default('plan') != 'apply'
            or
            hetzner_baremetal_onepassword_password_approval is mapping
          - >-
            hetzner_baremetal_onepassword_ssh_key_action
            | default('plan') != 'apply'
            or
            hetzner_baremetal_onepassword_ssh_key_approval is mapping
        fail_msg: >-
          The onepassword_cli backend requires one exact inventory FQDN, the
          complete exact account/vault/Password/SSH-key/Agent contract,
          immutable ID and version pins after discovery, separate plan/apply
          selectors, pinned controller executable digests and a separately
          signed recorder-bound approval mapping for each apply.
          Apply is refused in check mode.
        quiet: true
      when: hetzner_baremetal_secret_backend == 'onepassword_cli'
      tags: [always]

    - name: Resolve canonical Ansible Vault bootstrap paths
      ansible.builtin.set_fact:
        _hetzner_recovery_bootstrap_root_canonical: >-
          {{
            (
              lookup('ansible.builtin.env', 'PWD')
              ~ '/.secrets'
            ) | realpath
          }}
        _hetzner_recovery_bootstrap_path_canonical: >-
          {{ hetzner_baremetal_ansible_vault_secret_path | realpath }}
        _hetzner_recovery_bootstrap_path_normalized: >-
          {{ hetzner_baremetal_ansible_vault_secret_path | normpath }}
      when: hetzner_baremetal_secret_backend == 'ansible_vault_bootstrap'
      no_log: true
      tags: [always]

    - name: Require the canonical bootstrap document to remain under .secrets
      ansible.builtin.assert:
        that:
          - _hetzner_recovery_bootstrap_root_canonical | length > 1
          - _hetzner_recovery_bootstrap_path_normalized is match('^/')
          - >-
            _hetzner_recovery_bootstrap_path_canonical
            != _hetzner_recovery_bootstrap_root_canonical
          - >-
            _hetzner_recovery_bootstrap_path_canonical.startswith(
              _hetzner_recovery_bootstrap_root_canonical ~ '/'
            )
        fail_msg: >-
          The canonical encrypted bootstrap document path must remain below
          the execution workspace .secrets directory.
        quiet: true
      when: hetzner_baremetal_secret_backend == 'ansible_vault_bootstrap'
      no_log: true
      tags: [always]

    - name: Resolve the effective Ansible controller user ID
      ansible.builtin.set_fact:
        _hetzner_recovery_controller_uid: >-
          {{ lookup('ansible.builtin.pipe', 'id -u') | int }}
      when: hetzner_baremetal_secret_backend == 'ansible_vault_bootstrap'
      no_log: true
      tags: [always]

    - name: Check the Ansible Vault password file
      ansible.builtin.stat:
        path: >-
          {{ lookup('ansible.builtin.env', 'ANSIBLE_VAULT_PASSWORD_FILE') }}
      register: _hetzner_ansible_vault_password_file
      when: hetzner_baremetal_secret_backend == 'ansible_vault_bootstrap'
      no_log: true
      tags: [always]

    - name: Require a readable regular Ansible Vault password file
      ansible.builtin.assert:
        that:
          - _hetzner_ansible_vault_password_file.stat.exists | default(false)
          - _hetzner_ansible_vault_password_file.stat.isreg | default(false)
          - _hetzner_ansible_vault_password_file.stat.readable | default(false)
          - >-
            not (
              _hetzner_ansible_vault_password_file.stat.islnk
              | default(false)
            )
          - >-
            _hetzner_ansible_vault_password_file.stat.mode
            | default('') in ['0400', '0600']
          - >-
            _hetzner_ansible_vault_password_file.stat.uid
            | default(-1) | int
            in [0, _hetzner_recovery_controller_uid | int]
        fail_msg: >-
          ANSIBLE_VAULT_PASSWORD_FILE must name a readable, owner-only 0400 or
          0600 regular file owned by root or the effective controller user.
        quiet: true
      when: hetzner_baremetal_secret_backend == 'ansible_vault_bootstrap'
      no_log: true
      tags: [always]

    - name: Load an approved encrypted document to initialize Vault identity
      ansible.builtin.include_tasks: tasks/resolve-robot-credentials.yml
      # The controller-local CAS action plugin requires the Ansible Vault
      # loader identity to be initialized before it encrypts new ciphertext.
      # This include decrypts the existing Robot document only in protected
      # memory; it performs no Robot API call and emits no credential fields.
      when: hetzner_baremetal_secret_backend == 'ansible_vault_bootstrap'
      no_log: true
      tags: [always]

    - name: Validate the HashiCorp Vault contract
      ansible.builtin.assert:
        that:
          - hetzner_baremetal_vault is mapping
          - >-
            hetzner_baremetal_vault.engine_mount_point
            | default('', true) | length > 0
          - >-
            hetzner_baremetal_vault_secret_path
            | default('', true) | length > 0
          - >-
            hetzner_baremetal_vault.recovery_passphrase_field
            | default('', true) | length > 0
        fail_msg: >-
          The HashiCorp Vault engine, path, or recovery-field contract is
          missing.
        quiet: true
      when: hetzner_baremetal_secret_backend == 'hashicorp_vault'
      no_log: true
      tags: [always]

  tasks:
    - name: Ensure recovery secrets with a bounded Vault transport lifecycle
      block:
        - name: Ensure the encrypted Ansible Vault bootstrap document
          lit.foundational.ansible_vault_secret_document:
            path: "{{ _hetzner_recovery_bootstrap_path_normalized }}"
            subject: "{{ inventory_hostname }}"
            schema_version: >-
              {{ hetzner_baremetal_ansible_vault.schema_version | int }}
            secret_field: >-
              {{ hetzner_baremetal_vault.recovery_passphrase_field }}
            secret_length: >-
              {{ hetzner_baremetal_ansible_vault.recovery_passphrase_length | int }}
          register: _hetzner_recovery_bootstrap_document
          when: hetzner_baremetal_secret_backend == 'ansible_vault_bootstrap'
          no_log: true

        - name: Verify the encrypted Ansible Vault bootstrap document
          ansible.builtin.include_tasks: >-
            ../../../00-common/tasks/resolve-recovery-secret.yml
          when:
            - hetzner_baremetal_secret_backend == 'ansible_vault_bootstrap'
            - >-
              _hetzner_recovery_bootstrap_document.exists | default(false)
          vars:
            hetzner_baremetal_ansible_vault_secret_path: >-
              {{ _hetzner_recovery_bootstrap_path_normalized }}
          no_log: true

        - name: Verify the migrated HashiCorp Vault recovery document
          ansible.builtin.include_tasks: >-
            ../../../00-common/tasks/resolve-recovery-secret.yml
          when: hetzner_baremetal_secret_backend == 'hashicorp_vault'
          no_log: true

        - name: Plan or apply the independent 1Password recovery item
          lit.foundational.onepassword_secret_item:
            operation: >-
              {{
                hetzner_baremetal_onepassword_password_action
                | default('plan')
              }}
            schema_version: >-
              {{ hetzner_baremetal_onepassword.schema_version | int }}
            cli_path: "{{ hetzner_baremetal_onepassword.cli_path }}"
            cli_sha256: "{{ hetzner_baremetal_onepassword.cli_sha256 }}"
            cli_version: "{{ hetzner_baremetal_onepassword.cli_version }}"
            account_id: "{{ hetzner_baremetal_onepassword.account_id }}"
            account_sign_in_address: >-
              {{ hetzner_baremetal_onepassword.account_sign_in_address }}
            vault_id: "{{ hetzner_baremetal_onepassword.vault_id }}"
            authorized_user_uuids: >-
              {{ hetzner_baremetal_onepassword.authorized_user_uuids }}
            item_id: >-
              {{ hetzner_baremetal_onepassword.password_item.item_id }}
            item_version: >-
              {{
                hetzner_baremetal_onepassword.password_item.item_version
                | int
              }}
            item_title: >-
              {{ hetzner_baremetal_onepassword.password_item.item_title }}
            field_id: >-
              {{ hetzner_baremetal_onepassword.password_item.field_id }}
            category: >-
              {{ hetzner_baremetal_onepassword.password_item.category }}
            tags: "{{ hetzner_baremetal_onepassword.password_item.tags }}"
            subject: "{{ inventory_hostname }}"
            password_recipe: >-
              letters,digits,symbols,{{
                hetzner_baremetal_onepassword.password_item.expected_length
                | int
              }}
            password_length: >-
              {{
                hetzner_baremetal_onepassword.password_item.expected_length
                | int
              }}
            allow_create: >-
              {{
                hetzner_baremetal_onepassword_password_action
                | default('plan') == 'apply'
              }}
            approval: >-
              {{
                hetzner_baremetal_onepassword_password_approval
                | default({})
              }}
            approval_authority: >-
              {{
                hetzner_baremetal_onepassword.approval_authority
                if (
                  hetzner_baremetal_onepassword_password_action
                  | default('plan')
                ) == 'apply'
                else omit
              }}
          register: _hetzner_recovery_onepassword_password
          when: hetzner_baremetal_secret_backend == 'onepassword_cli'
          no_log: true

        - name: Plan or apply the independent 1Password Dropbear SSH item
          lit.foundational.onepassword_ssh_key_item:
            operation: >-
              {{
                hetzner_baremetal_onepassword_ssh_key_action
                | default('plan')
              }}
            schema_version: >-
              {{ hetzner_baremetal_onepassword.schema_version | int }}
            cli_path: "{{ hetzner_baremetal_onepassword.cli_path }}"
            cli_sha256: "{{ hetzner_baremetal_onepassword.cli_sha256 }}"
            cli_version: "{{ hetzner_baremetal_onepassword.cli_version }}"
            account_id: "{{ hetzner_baremetal_onepassword.account_id }}"
            account_sign_in_address: >-
              {{ hetzner_baremetal_onepassword.account_sign_in_address }}
            vault_id: "{{ hetzner_baremetal_onepassword.vault_id }}"
            authorized_user_uuids: >-
              {{ hetzner_baremetal_onepassword.authorized_user_uuids }}
            item_id: >-
              {{ hetzner_baremetal_onepassword.ssh_key_item.item_id }}
            item_version: >-
              {{
                hetzner_baremetal_onepassword.ssh_key_item.item_version | int
              }}
            item_title: >-
              {{ hetzner_baremetal_onepassword.ssh_key_item.item_title }}
            category: >-
              {{ hetzner_baremetal_onepassword.ssh_key_item.category }}
            tags: "{{ hetzner_baremetal_onepassword.ssh_key_item.tags }}"
            subject: "{{ inventory_hostname }}"
            key_type: >-
              {{ hetzner_baremetal_onepassword.ssh_key_item.key_type }}
            expected_fingerprint: >-
              {{
                hetzner_baremetal_onepassword.ssh_key_item.expected_fingerprint
              }}
            allow_create: >-
              {{
                hetzner_baremetal_onepassword_ssh_key_action
                | default('plan') == 'apply'
              }}
            approval: >-
              {{
                hetzner_baremetal_onepassword_ssh_key_approval
                | default({})
              }}
            approval_authority: >-
              {{
                hetzner_baremetal_onepassword.approval_authority
                if (
                  hetzner_baremetal_onepassword_ssh_key_action
                  | default('plan')
                ) == 'apply'
                else omit
              }}
            ssh_add_path: >-
              {{ hetzner_baremetal_onepassword.ssh_agent.ssh_add_path }}
            ssh_add_sha256: >-
              {{ hetzner_baremetal_onepassword.ssh_agent.ssh_add_sha256 }}
            ssh_keygen_path: >-
              {{ hetzner_baremetal_onepassword.ssh_agent.ssh_keygen_path }}
            ssh_keygen_sha256: >-
              {{ hetzner_baremetal_onepassword.ssh_agent.ssh_keygen_sha256 }}
            agent_socket_path: >-
              {{ hetzner_baremetal_onepassword.ssh_agent.agent_socket_path }}
          register: _hetzner_recovery_onepassword_ssh_key
          when: hetzner_baremetal_secret_backend == 'onepassword_cli'
          no_log: true

        - name: Require exact Password identity metadata after 1Password apply
          ansible.builtin.assert:
            that:
              - _hetzner_recovery_onepassword_password.exists | bool
              - >-
                _hetzner_recovery_onepassword_password.item_id
                | default('') is match('^[a-z0-9]{26}$')
              - >-
                _hetzner_recovery_onepassword_password.item_version
                | default(0) | int > 0
            fail_msg: >-
              1Password apply did not return a unique exact Password item ID
              and version. No secret may be consumed until both non-secret
              values are pinned in inventory.
            quiet: true
          when:
            - hetzner_baremetal_secret_backend == 'onepassword_cli'
            - >-
              hetzner_baremetal_onepassword_password_action
              | default('plan') == 'apply'

        - name: Require exact SSH identity metadata after 1Password apply
          ansible.builtin.assert:
            that:
              - _hetzner_recovery_onepassword_ssh_key.exists | bool
              - _hetzner_recovery_onepassword_ssh_key.agent_verified | bool
              - >-
                _hetzner_recovery_onepassword_ssh_key.item_id
                | default('') is match('^[a-z0-9]{26}$')
              - >-
                _hetzner_recovery_onepassword_ssh_key.item_version
                | default(0) | int > 0
              - >-
                _hetzner_recovery_onepassword_ssh_key.fingerprint
                | default('') is match('^SHA256:[A-Za-z0-9+/]{43}$')
            fail_msg: >-
              1Password apply did not return a unique exact SSH Key ID,
              version, fingerprint, and successful Agent challenge. No key may
              be installed until these non-secret values are pinned.
            quiet: true
          when:
            - hetzner_baremetal_secret_backend == 'onepassword_cli'
            - >-
              hetzner_baremetal_onepassword_ssh_key_action
              | default('plan') == 'apply'

        - name: Report safe 1Password identity metadata
          ansible.builtin.debug:
            msg:
              password_item:
                exists: >-
                  {{ _hetzner_recovery_onepassword_password.exists | bool }}
                item_id: >-
                  {{
                    _hetzner_recovery_onepassword_password.item_id
                    | default(none)
                  }}
                item_version: >-
                  {{
                    _hetzner_recovery_onepassword_password.item_version
                    | default(none)
                  }}
                planned: >-
                  {{ _hetzner_recovery_onepassword_password.planned | bool }}
              ssh_key_item:
                exists: >-
                  {{ _hetzner_recovery_onepassword_ssh_key.exists | bool }}
                item_id: >-
                  {{
                    _hetzner_recovery_onepassword_ssh_key.item_id
                    | default(none)
                  }}
                item_version: >-
                  {{
                    _hetzner_recovery_onepassword_ssh_key.item_version
                    | default(none)
                  }}
                fingerprint: >-
                  {{
                    _hetzner_recovery_onepassword_ssh_key.fingerprint
                    | default(none)
                  }}
                planned: >-
                  {{ _hetzner_recovery_onepassword_ssh_key.planned | bool }}
          when: hetzner_baremetal_secret_backend == 'onepassword_cli'

      always:
        - name: Close any controller Vault recovery-secret transport
          ansible.builtin.include_tasks: >-
            ../../../00-common/tasks/close-hashicorp-vault-ssh-tunnel.yml
          tags: [always]
