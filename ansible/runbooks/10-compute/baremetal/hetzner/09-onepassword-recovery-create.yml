---
# Sign and immediately consume two independent, short-lived approvals for the
# initial external Wunderbox recovery custody. No secret value is returned.
- name: Prepare one-time approvals for external Wunderbox recovery custody
  hosts: hetzner_baremetal
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true
  serial: 1

  vars:
    _password_contract:
      operation: apply
      allow_create: true
      account_id: "{{ hetzner_baremetal_onepassword.account_id }}"
      account_sign_in_address: >-
        {{ hetzner_baremetal_onepassword.account_sign_in_address }}
      authorized_user_uuids: >-
        {{ hetzner_baremetal_onepassword.authorized_user_uuids }}
      category: "{{ hetzner_baremetal_onepassword.password_item.category }}"
      cli_path: "{{ hetzner_baremetal_onepassword.cli_path }}"
      cli_sha256: "{{ hetzner_baremetal_onepassword.cli_sha256 }}"
      cli_version: "{{ hetzner_baremetal_onepassword.cli_version }}"
      field_id: "{{ hetzner_baremetal_onepassword.password_item.field_id }}"
      item_id: "{{ hetzner_baremetal_onepassword.password_item.item_id }}"
      item_title: "{{ hetzner_baremetal_onepassword.password_item.item_title }}"
      item_version: >-
        {{ hetzner_baremetal_onepassword.password_item.item_version | int }}
      password_length: >-
        {{ hetzner_baremetal_onepassword.password_item.expected_length | int }}
      password_recipe: >-
        letters,digits,symbols,{{
          hetzner_baremetal_onepassword.password_item.expected_length | int
        }}
      schema_version: "{{ hetzner_baremetal_onepassword.schema_version | int }}"
      subject: "{{ inventory_hostname }}"
      tags: "{{ hetzner_baremetal_onepassword.password_item.tags }}"
      vault_id: "{{ hetzner_baremetal_onepassword.vault_id }}"
    _ssh_key_contract:
      operation: apply
      allow_create: true
      account_id: "{{ hetzner_baremetal_onepassword.account_id }}"
      account_sign_in_address: >-
        {{ hetzner_baremetal_onepassword.account_sign_in_address }}
      agent_socket_path: >-
        {{ hetzner_baremetal_onepassword.ssh_agent.agent_socket_path }}
      authorized_user_uuids: >-
        {{ hetzner_baremetal_onepassword.authorized_user_uuids }}
      cli_path: "{{ hetzner_baremetal_onepassword.cli_path }}"
      cli_sha256: "{{ hetzner_baremetal_onepassword.cli_sha256 }}"
      cli_version: "{{ hetzner_baremetal_onepassword.cli_version }}"
      category: "{{ hetzner_baremetal_onepassword.ssh_key_item.category }}"
      expected_fingerprint: >-
        {{ hetzner_baremetal_onepassword.ssh_key_item.expected_fingerprint }}
      item_id: "{{ hetzner_baremetal_onepassword.ssh_key_item.item_id }}"
      item_title: "{{ hetzner_baremetal_onepassword.ssh_key_item.item_title }}"
      item_version: >-
        {{ hetzner_baremetal_onepassword.ssh_key_item.item_version | int }}
      key_type: "{{ hetzner_baremetal_onepassword.ssh_key_item.key_type }}"
      schema_version: "{{ hetzner_baremetal_onepassword.schema_version | int }}"
      ssh_add_path: "{{ hetzner_baremetal_onepassword.ssh_agent.ssh_add_path }}"
      ssh_add_sha256: >-
        {{ hetzner_baremetal_onepassword.ssh_agent.ssh_add_sha256 }}
      ssh_keygen_path: >-
        {{ hetzner_baremetal_onepassword.ssh_agent.ssh_keygen_path }}
      ssh_keygen_sha256: >-
        {{ hetzner_baremetal_onepassword.ssh_agent.ssh_keygen_sha256 }}
      subject: "{{ inventory_hostname }}"
      tags: "{{ hetzner_baremetal_onepassword.ssh_key_item.tags }}"
      vault_id: "{{ hetzner_baremetal_onepassword.vault_id }}"

  pre_tasks:
    - name: Require the exact target and explicit credential-creation approval
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit | string | trim == inventory_hostname
          - not ansible_check_mode
          - >-
            onepassword_recovery_creation_confirmation
            | default('')
            == 'CREATE-ONEPASSWORD-RECOVERY:' ~ inventory_hostname
          - onepassword_recovery_commit_shas is mapping
          - onepassword_recovery_commit_shas.keys() | list | sort == [
              'automation',
              'foundational',
              'inventory',
              'operations',
              'ubuntu',
              'validation'
            ] | sort
          - >-
            onepassword_recovery_commit_shas.values()
            | select('match', '^[0-9a-f]{40}$') | list | length == 6
          - hetzner_baremetal_onepassword.password_item.item_id == ''
          - hetzner_baremetal_onepassword.password_item.item_version | int == 0
          - hetzner_baremetal_onepassword.ssh_key_item.item_id == ''
          - hetzner_baremetal_onepassword.ssh_key_item.item_version | int == 0
          - >-
            hetzner_baremetal_onepassword.ssh_key_item.expected_fingerprint == ''
        fail_msg: >-
          Creation requires one exact unpinned target, six frozen repository
          commits, the approved signing agent, and the exact target confirmation.
        quiet: true
      no_log: true

  tasks:
    - name: Sign the one-time Password-item creation approval
      lit.foundational.onepassword_approval:
        approval_authority: >-
          {{ hetzner_baremetal_onepassword.approval_authority }}
        binding: "{{ _password_contract }}"
        commit_shas: "{{ onepassword_recovery_commit_shas }}"
        execution_id_prefix: WBX-1P-PASSWORD
        operation: create-onepassword-secret
        signing_agent_socket_path: >-
          {{ hetzner_baremetal_onepassword.ssh_agent.agent_socket_path }}
        signing_ssh_add_path: >-
          {{ hetzner_baremetal_onepassword.ssh_agent.ssh_add_path }}
        signing_ssh_add_sha256: >-
          {{ hetzner_baremetal_onepassword.ssh_agent.ssh_add_sha256 }}
        target: "{{ inventory_hostname }}"
        validity_seconds: 600
      register: _wunderbox_password_approval
      no_log: true

    - name: Sign the one-time SSH-key creation approval
      lit.foundational.onepassword_approval:
        approval_authority: >-
          {{ hetzner_baremetal_onepassword.approval_authority }}
        binding: "{{ _ssh_key_contract }}"
        commit_shas: "{{ onepassword_recovery_commit_shas }}"
        execution_id_prefix: WBX-1P-SSH
        operation: create-onepassword-ssh-key
        signing_agent_socket_path: >-
          {{ hetzner_baremetal_onepassword.ssh_agent.agent_socket_path }}
        signing_ssh_add_path: >-
          {{ hetzner_baremetal_onepassword.ssh_agent.ssh_add_path }}
        signing_ssh_add_sha256: >-
          {{ hetzner_baremetal_onepassword.ssh_agent.ssh_add_sha256 }}
        target: "{{ inventory_hostname }}"
        validity_seconds: 600
      register: _wunderbox_ssh_key_approval
      no_log: true

    - name: Bind the verified approvals to the following creation plays
      ansible.builtin.set_fact:
        wunderbox_password_creation_approval: >-
          {{ _wunderbox_password_approval.approval }}
        wunderbox_ssh_key_creation_approval: >-
          {{ _wunderbox_ssh_key_approval.approval }}
      no_log: true

- name: Create the two externally held Wunderbox recovery credentials
  ansible.builtin.import_playbook: 08-recovery-secrets.yml
  vars:
    hetzner_baremetal_onepassword_password_action: apply
    hetzner_baremetal_onepassword_ssh_key_action: apply
    hetzner_baremetal_onepassword_password_approval: >-
      {{ hostvars[inventory_hostname].wunderbox_password_creation_approval }}
    hetzner_baremetal_onepassword_ssh_key_approval: >-
      {{ hostvars[inventory_hostname].wunderbox_ssh_key_creation_approval }}
