---
- name: Diagnose exact Goal 04 Rescue reachability without changing state
  hosts: hetzner_baremetal
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true
  serial: 1

  vars:
    _wbx_goal04_expected_host: wunderbox01.prd.edge.pub.l-it.io
    _wbx_goal04_expected_server: 3035773
    _wbx_goal04_expected_ipv4: 136.243.38.174

  pre_tasks:
    - name: Require the exact frozen Goal 04 target
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit | string | trim == _wbx_goal04_expected_host
          - inventory_hostname == _wbx_goal04_expected_host
          - hetzner_robot_server_number | int == _wbx_goal04_expected_server
          - ansible_host == _wbx_goal04_expected_ipv4
          - hostname_fqdn == _wbx_goal04_expected_host
        fail_msg: Rescue reachability observation requires the exact frozen target.
        quiet: true

    - name: Resolve Robot API credentials from the selected external backend
      ansible.builtin.include_tasks: tasks/resolve-robot-credentials.yml
      no_log: true

  tasks:
    - name: Read the exact server resetter status
      community.hrobot.reset_info:
        hetzner_user: "{{ _hetzner_robot_user }}"
        hetzner_password: "{{ _hetzner_robot_password }}"
        server_number: "{{ hetzner_robot_server_number }}"
      register: _wbx_goal04_resetter
      changed_when: false
      delegate_to: localhost
      become: false
      no_log: true

    - name: Report the non-secret resetter state
      ansible.builtin.debug:
        msg:
          server_number: "{{ _wbx_goal04_resetter.reset.server_number }}"
          server_ipv4: "{{ _wbx_goal04_resetter.reset.server_ip }}"
          supported_reset_types: "{{ _wbx_goal04_resetter.reset.type }}"
          operating_status: "{{ _wbx_goal04_resetter.reset.operating_status }}"

    - name: Observe the controller public egress IPv4
      ansible.builtin.uri:
        url: https://api.ipify.org?format=json
        method: GET
        return_content: true
        status_code: 200
      register: _wbx_goal04_egress
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Report the public egress and expected firewall source
      ansible.builtin.debug:
        msg:
          observed_controller_egress_ipv4: "{{ _wbx_goal04_egress.json.ip }}"
          expected_firewall_source_ipv4: 153.53.58.197
          source_matches: "{{ _wbx_goal04_egress.json.ip == '153.53.58.197' }}"

    - name: Wait briefly for the exact Rescue IPv4 SSH port
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        connect_timeout: 5
        timeout: 15
        state: started
      delegate_to: localhost
      become: false

    - name: Read the live Rescue Ed25519 host key
      ansible.builtin.command:
        argv:
          - /usr/bin/ssh-keyscan
          - -q
          - -4
          - -T
          - "10"
          - -t
          - ed25519
          - "{{ ansible_host }}"
      register: _wbx_goal04_rescue_keyscan
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Require one live key line for the exact IPv4
      ansible.builtin.assert:
        that:
          - _wbx_goal04_rescue_keyscan.rc == 0
          - _wbx_goal04_rescue_keyscan.stdout_lines | length == 1
          - >-
            _wbx_goal04_rescue_keyscan.stdout_lines[0]
            is match('^136\\.243\\.38\\.174 ssh-ed25519 [A-Za-z0-9+/=]+$')
        fail_msg: TCP/22 is reachable but did not return one exact Ed25519 host key.
        quiet: true

    - name: Derive the live Rescue Ed25519 SHA-256 fingerprint
      ansible.builtin.command:
        argv:
          - /usr/bin/ssh-keygen
          - -E
          - sha256
          - -lf
          - "-"
        stdin: "{{ _wbx_goal04_rescue_keyscan.stdout_lines[0] }}\n"
        stdin_add_newline: false
      register: _wbx_goal04_rescue_fingerprint
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Report old and live Rescue host fingerprints
      ansible.builtin.debug:
        msg:
          inventory_fingerprint: "{{ hetzner_rescue_ssh_ed25519_sha256 }}"
          live_fingerprint: >-
            {{
              _wbx_goal04_rescue_fingerprint.stdout
              | regex_findall('SHA256:[A-Za-z0-9+/]{43}')
              | first
            }}
          fingerprints_match: >-
            {{
              (_wbx_goal04_rescue_fingerprint.stdout
               | regex_findall('SHA256:[A-Za-z0-9+/]{43}') | first)
              == hetzner_rescue_ssh_ed25519_sha256
            }}
