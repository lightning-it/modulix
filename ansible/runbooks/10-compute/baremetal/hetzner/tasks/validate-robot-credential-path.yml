---
# Validate the inventory-owned controller path before creating or resolving
# encrypted Hetzner Robot credentials. Callers must include this file under
# no_log so the contract cannot become a secret-disclosure side channel.
- name: Validate the encrypted Robot credential contract
  ansible.builtin.assert:
    that:
      - hetzner_baremetal_robot_credentials is mapping
      - >-
        hetzner_baremetal_robot_credentials.keys() | list | sort
        ==
        [
          'ansible_vault_path',
          'max_ciphertext_bytes',
          'password_max_length',
          'schema_version',
          'subject',
          'username_max_length'
        ] | sort
      - >-
        hetzner_baremetal_robot_credentials.schema_version is integer
      - hetzner_baremetal_robot_credentials.schema_version == 1
      - hetzner_baremetal_robot_credentials.subject is string
      - >-
        hetzner_baremetal_robot_credentials.subject
        == 'robot-ws.your-server.de'
      - >-
        hetzner_baremetal_robot_credentials.max_ciphertext_bytes is integer
      - >-
        hetzner_baremetal_robot_credentials.max_ciphertext_bytes >= 65536
      - >-
        hetzner_baremetal_robot_credentials.max_ciphertext_bytes <= 1048576
      - >-
        hetzner_baremetal_robot_credentials.username_max_length is integer
      - >-
        hetzner_baremetal_robot_credentials.username_max_length > 0
      - >-
        hetzner_baremetal_robot_credentials.username_max_length <= 320
      - >-
        hetzner_baremetal_robot_credentials.password_max_length is integer
      - >-
        hetzner_baremetal_robot_credentials.password_max_length > 0
      - >-
        hetzner_baremetal_robot_credentials.password_max_length <= 1024
      - >-
        hetzner_baremetal_robot_credentials.ansible_vault_path is string
      - >-
        hetzner_baremetal_robot_credentials.ansible_vault_path
        | length > 0
      - hetzner_baremetal_ansible_vault is mapping
      - hetzner_baremetal_ansible_vault.vault_id is string
      - >-
        hetzner_baremetal_ansible_vault.vault_id
        is match('^[A-Za-z0-9_.-]+$')
      - lookup('ansible.builtin.env', 'PWD') | length > 0
      - >-
        lookup('ansible.builtin.env', 'ANSIBLE_VAULT_PASSWORD_FILE')
        | length > 0
    fail_msg: >-
      The inventory-declared encrypted Robot credential contract and strict
      Ansible Vault ID are invalid or incomplete.
    quiet: true
  no_log: true

- name: Resolve canonical encrypted Robot credential paths
  ansible.builtin.set_fact:
    _hetzner_robot_credentials_root_expected: >-
      {{ (lookup('ansible.builtin.env', 'PWD') ~ '/.secrets') | normpath }}
    _hetzner_robot_credentials_root_canonical: >-
      {{ (lookup('ansible.builtin.env', 'PWD') ~ '/.secrets') | realpath }}
    _hetzner_robot_credentials_path_normalized: >-
      {{
        hetzner_baremetal_robot_credentials.ansible_vault_path
        | normpath
      }}
    _hetzner_robot_credentials_path_canonical: >-
      {{
        hetzner_baremetal_robot_credentials.ansible_vault_path
        | realpath
      }}
    _hetzner_robot_credentials_password_path_normalized: >-
      {{
        lookup('ansible.builtin.env', 'ANSIBLE_VAULT_PASSWORD_FILE')
        | normpath
      }}
    _hetzner_robot_credentials_password_path_canonical: >-
      {{
        lookup('ansible.builtin.env', 'ANSIBLE_VAULT_PASSWORD_FILE')
        | realpath
      }}
    _hetzner_robot_credentials_controller_uid: >-
      {{ lookup('ansible.builtin.pipe', 'id -u') | int }}
  no_log: true

- name: Require a canonical Robot credential path below project .secrets
  ansible.builtin.assert:
    that:
      - _hetzner_robot_credentials_root_expected is match('^/')
      - _hetzner_robot_credentials_root_expected | length > 1
      - >-
        _hetzner_robot_credentials_root_canonical
        == _hetzner_robot_credentials_root_expected
      - >-
        hetzner_baremetal_robot_credentials.ansible_vault_path
        == _hetzner_robot_credentials_path_normalized
      - >-
        _hetzner_robot_credentials_path_canonical
        == _hetzner_robot_credentials_path_normalized
      - >-
        _hetzner_robot_credentials_path_canonical
        != _hetzner_robot_credentials_root_canonical
      - >-
        _hetzner_robot_credentials_path_canonical.startswith(
          _hetzner_robot_credentials_root_canonical ~ '/'
        )
      - >-
        _hetzner_robot_credentials_password_path_normalized is match('^/')
      - >-
        lookup('ansible.builtin.env', 'ANSIBLE_VAULT_PASSWORD_FILE')
        == _hetzner_robot_credentials_password_path_normalized
      - >-
        _hetzner_robot_credentials_password_path_canonical
        == _hetzner_robot_credentials_password_path_normalized
      - >-
        _hetzner_robot_credentials_password_path_canonical
        != _hetzner_robot_credentials_path_canonical
    fail_msg: >-
      The encrypted Robot credential and Ansible Vault password paths must be
      absolute, canonical, distinct, and symlink-free; the credential must be
      strictly below the execution workspace .secrets directory.
    quiet: true
  no_log: true

- name: Resolve protected Robot credential parent paths
  ansible.builtin.set_fact:
    _hetzner_robot_credentials_parent_paths: >-
      {%- set parents = namespace(paths=['/']) -%}
      {%- for candidate in [
        _hetzner_robot_credentials_root_canonical,
        _hetzner_robot_credentials_path_canonical | dirname,
        _hetzner_robot_credentials_password_path_canonical | dirname
      ] -%}
        {%- set current = namespace(path='') -%}
        {%- for component in candidate.split('/') -%}
          {%- if component | length > 0 -%}
            {%- set current.path = current.path ~ '/' ~ component -%}
            {%- if current.path not in parents.paths -%}
              {%- set parents.paths = parents.paths + [current.path] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ parents.paths }}
  no_log: true

- name: Inspect protected Robot credential parent paths
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    follow: false
  loop: "{{ _hetzner_robot_credentials_parent_paths }}"
  delegate_to: localhost
  become: false
  register: _hetzner_robot_credentials_parent_stats
  changed_when: false
  no_log: true

- name: Require protected Robot credential parent paths
  ansible.builtin.assert:
    that:
      - >-
        _hetzner_robot_credentials_parent_stats.results | length
        == _hetzner_robot_credentials_parent_paths | length
      - item.stat.exists | default(false)
      - item.stat.isdir | default(false)
      - item.stat.executable | default(false)
      - not (item.stat.islnk | default(false))
      - >-
        item.stat.uid | default(-1) | int
        in [0, _hetzner_robot_credentials_controller_uid | int]
      - >-
        item.stat.mode | default('')
        is match('^[0-7][0-7][0145][0145]$')
    fail_msg: >-
      Every controller directory leading to Robot credential material must be
      a traversable, symlink-free directory owned by root or the controller
      user and not writable by its group or other users.
    quiet: true
  loop: "{{ _hetzner_robot_credentials_parent_stats.results }}"
  no_log: true

- name: Inspect the Robot Ansible Vault password file
  ansible.builtin.stat:
    path: "{{ _hetzner_robot_credentials_password_path_canonical }}"
    get_checksum: false
    follow: false
  delegate_to: localhost
  become: false
  register: _hetzner_robot_credentials_password_file
  changed_when: false
  no_log: true

- name: Require a protected Robot Ansible Vault password file
  ansible.builtin.assert:
    that:
      - _hetzner_robot_credentials_password_file.stat.exists | default(false)
      - _hetzner_robot_credentials_password_file.stat.isreg | default(false)
      - _hetzner_robot_credentials_password_file.stat.readable | default(false)
      - >-
        not (
          _hetzner_robot_credentials_password_file.stat.islnk
          | default(false)
        )
      - >-
        _hetzner_robot_credentials_password_file.stat.nlink
        | default(0) | int == 1
      - >-
        _hetzner_robot_credentials_password_file.stat.mode
        | default('') in ['0400', '0600']
      - >-
        _hetzner_robot_credentials_password_file.stat.uid
        | default(-1) | int
        in [0, _hetzner_robot_credentials_controller_uid | int]
      - >-
        _hetzner_robot_credentials_password_file.stat.size
        | default(0) | int > 0
      - >-
        _hetzner_robot_credentials_password_file.stat.size
        | default(0) | int <= 1048576
    fail_msg: >-
      The Robot Ansible Vault password must be a non-empty, readable,
      single-link, owner-only 0400 or 0600 regular file no larger than 1 MiB
      and owned by root or the controller user.
    quiet: true
  no_log: true
