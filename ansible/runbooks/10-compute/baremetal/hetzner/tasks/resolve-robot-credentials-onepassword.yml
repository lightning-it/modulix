---
- name: Validate the pinned 1Password Robot credential contract
  ansible.builtin.assert:
    that:
      - hetzner_baremetal_robot_onepassword is mapping
      - hetzner_baremetal_robot_onepassword.schema_version | int == 1
      - hetzner_baremetal_robot_onepassword.cli_path is match('^/')
      - >-
        hetzner_baremetal_robot_onepassword.cli_sha256
        is match('^[0-9a-f]{64}$')
      - >-
        hetzner_baremetal_robot_onepassword.account_id
        is match('^[A-Z0-9]{26}$')
      - >-
        hetzner_baremetal_robot_onepassword.vault_id
        is match('^[a-z0-9]{26}$')
      - >-
        hetzner_baremetal_robot_onepassword.item_id
        is match('^[a-z0-9]{26}$')
      - hetzner_baremetal_robot_onepassword.item_version | int > 0
      - hetzner_baremetal_robot_onepassword.username_field == 'username'
      - hetzner_baremetal_robot_onepassword.password_field == 'password'
      - >-
        hetzner_baremetal_robot_onepassword.expected_username
        is match('^#ws\\+[A-Za-z0-9]+$')
    fail_msg: The pinned 1Password Robot credential contract is invalid.
    quiet: true
  no_log: true

- name: Inspect the approved 1Password CLI executable
  ansible.builtin.stat:
    path: "{{ hetzner_baremetal_robot_onepassword.cli_path }}"
    checksum_algorithm: sha256
    follow: false
  delegate_to: localhost
  become: false
  register: _hetzner_robot_op_cli
  changed_when: false
  no_log: true

- name: Require the exact approved 1Password CLI executable
  ansible.builtin.assert:
    that:
      - _hetzner_robot_op_cli.stat.exists | default(false)
      - _hetzner_robot_op_cli.stat.isreg | default(false)
      - _hetzner_robot_op_cli.stat.executable | default(false)
      - not (_hetzner_robot_op_cli.stat.islnk | default(false))
      - >-
        _hetzner_robot_op_cli.stat.checksum
        == hetzner_baremetal_robot_onepassword.cli_sha256
    fail_msg: The approved 1Password CLI executable did not match its pin.
    quiet: true
  no_log: true

- name: Read pinned Robot item metadata from 1Password desktop integration
  ansible.builtin.command:
    argv:
      - "{{ hetzner_baremetal_robot_onepassword.cli_path }}"
      - item
      - get
      - "{{ hetzner_baremetal_robot_onepassword.item_id }}"
      - --account
      - "{{ hetzner_baremetal_robot_onepassword.account_id }}"
      - --vault
      - "{{ hetzner_baremetal_robot_onepassword.vault_id }}"
      - --format
      - json
  delegate_to: localhost
  become: false
  register: _hetzner_robot_onepassword_metadata_raw
  changed_when: false
  check_mode: false
  no_log: true

- name: Validate immutable Robot item metadata
  ansible.builtin.assert:
    that:
      - >-
        (_hetzner_robot_onepassword_metadata_raw.stdout | from_json).id
        == hetzner_baremetal_robot_onepassword.item_id
      - >-
        (_hetzner_robot_onepassword_metadata_raw.stdout | from_json).version
        | int == hetzner_baremetal_robot_onepassword.item_version | int
      - >-
        (_hetzner_robot_onepassword_metadata_raw.stdout | from_json).title
        == hetzner_baremetal_robot_onepassword.item_title
      - >-
        (_hetzner_robot_onepassword_metadata_raw.stdout | from_json).vault.id
        == hetzner_baremetal_robot_onepassword.vault_id
      - >-
        (_hetzner_robot_onepassword_metadata_raw.stdout | from_json).category
        == 'LOGIN'
    fail_msg: The 1Password Robot item metadata drifted from its inventory pin.
    quiet: true
  no_log: true

- name: Validate and publish protected Robot credentials
  ansible.builtin.set_fact:
    _hetzner_robot_user: >-
      {{
        (_hetzner_robot_onepassword_metadata_raw.stdout | from_json).fields
        | selectattr('id', 'equalto', hetzner_baremetal_robot_onepassword.username_field)
        | map(attribute='value')
        | first
      }}
    _hetzner_robot_password: >-
      {{
        (_hetzner_robot_onepassword_metadata_raw.stdout | from_json).fields
        | selectattr('id', 'equalto', hetzner_baremetal_robot_onepassword.password_field)
        | map(attribute='value')
        | first
      }}
  no_log: true

- name: Require exact pinned Robot identity and non-dummy password
  ansible.builtin.assert:
    that:
      - >-
        _hetzner_robot_user
        == hetzner_baremetal_robot_onepassword.expected_username
      - _hetzner_robot_password | length > 0
      - _hetzner_robot_password != 'pw1'
    fail_msg: The 1Password Robot credential did not match its pinned identity.
    quiet: true
  no_log: true
