---
# Load encrypted Hetzner Robot credentials into protected Ansible memory.
# Callers must keep this include and every credential consumer under no_log.
- name: Validate the encrypted Robot credential path
  ansible.builtin.include_tasks: validate-robot-credential-path.yml
  no_log: true

- name: Inspect the encrypted Robot credential document
  ansible.builtin.stat:
    path: "{{ _hetzner_robot_credentials_path_canonical }}"
    get_checksum: false
    follow: false
  delegate_to: localhost
  become: false
  register: _hetzner_robot_credentials_file
  changed_when: false
  no_log: true

- name: Require protected Robot credential ciphertext
  ansible.builtin.assert:
    that:
      - _hetzner_robot_credentials_file.stat.exists | default(false)
      - _hetzner_robot_credentials_file.stat.isreg | default(false)
      - _hetzner_robot_credentials_file.stat.readable | default(false)
      - not (_hetzner_robot_credentials_file.stat.islnk | default(false))
      - _hetzner_robot_credentials_file.stat.nlink | default(0) | int == 1
      - >-
        _hetzner_robot_credentials_file.stat.mode
        | default('') in ['0400', '0600']
      - >-
        _hetzner_robot_credentials_file.stat.uid
        | default(-1) | int
        in [0, _hetzner_robot_credentials_controller_uid | int]
      - _hetzner_robot_credentials_file.stat.size | default(0) | int > 0
      - >-
        _hetzner_robot_credentials_file.stat.size | default(0) | int
        <= hetzner_baremetal_robot_credentials.max_ciphertext_bytes
    fail_msg: >-
      The encrypted Robot credential document must be a non-empty, readable,
      single-link, owner-only 0400 or 0600 regular file owned by root or the
      effective controller user and within the inventory size ceiling.
    quiet: true
  no_log: true

- name: Read only the Ansible Vault ciphertext signature
  ansible.builtin.command:
    argv:
      - head
      - -c
      - "15"
      - "{{ _hetzner_robot_credentials_path_canonical }}"
  delegate_to: localhost
  become: false
  register: _hetzner_robot_credentials_ciphertext_signature
  changed_when: false
  check_mode: false
  no_log: true

- name: Reject a plaintext Robot credential document
  ansible.builtin.assert:
    that:
      - >-
        _hetzner_robot_credentials_ciphertext_signature.stdout
        == '$ANSIBLE_VAULT;'
    fail_msg: >-
      The Robot credential document is not Ansible Vault ciphertext.
    quiet: true
  no_log: true

- name: Decrypt the Robot credential document into Ansible memory
  ansible.builtin.include_vars:
    file: "{{ _hetzner_robot_credentials_path_canonical }}"
    name: _hetzner_robot_credentials_document
  no_log: true

- name: Validate the exact Robot credential document schema
  ansible.builtin.assert:
    that:
      - _hetzner_robot_credentials_document is mapping
      - >-
        _hetzner_robot_credentials_document.keys() | list | sort
        == ['password', 'schema_version', 'subject', 'username'] | sort
      - _hetzner_robot_credentials_document.schema_version is integer
      - >-
        _hetzner_robot_credentials_document.schema_version
        == hetzner_baremetal_robot_credentials.schema_version
      - _hetzner_robot_credentials_document.subject is string
      - >-
        _hetzner_robot_credentials_document.subject
        == hetzner_baremetal_robot_credentials.subject
      - _hetzner_robot_credentials_document.username is string
      - _hetzner_robot_credentials_document.username | length > 0
      - >-
        _hetzner_robot_credentials_document.username | length
        <= hetzner_baremetal_robot_credentials.username_max_length
      - >-
        _hetzner_robot_credentials_document.username
        == _hetzner_robot_credentials_document.username | trim
      - _hetzner_robot_credentials_document.password is string
      - _hetzner_robot_credentials_document.password | length > 0
      - >-
        _hetzner_robot_credentials_document.password | length
        <= hetzner_baremetal_robot_credentials.password_max_length
    fail_msg: >-
      The encrypted Robot credential document has an invalid schema or
      subject.
    quiet: true
  no_log: true

- name: Resolve Robot credentials for protected module calls
  ansible.builtin.set_fact:
    _hetzner_robot_user: "{{ _hetzner_robot_credentials_document.username }}"
    _hetzner_robot_password: >-
      {{ _hetzner_robot_credentials_document.password }}
  no_log: true
