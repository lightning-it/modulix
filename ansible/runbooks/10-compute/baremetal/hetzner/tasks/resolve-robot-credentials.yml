---
- name: Require one supported Robot credential backend
  ansible.builtin.assert:
    that:
      - hetzner_baremetal_robot_credentials_backend is defined
      - >-
        hetzner_baremetal_robot_credentials_backend
        in ['ansible_vault', 'onepassword_cli']
    fail_msg: >-
      hetzner_baremetal_robot_credentials_backend must be exactly
      ansible_vault or onepassword_cli.
    quiet: true
  no_log: true

- name: Resolve Robot credentials from controller-local Ansible Vault
  ansible.builtin.include_tasks: resolve-robot-credentials-ansible-vault.yml
  when: hetzner_baremetal_robot_credentials_backend == 'ansible_vault'
  no_log: true

- name: Resolve Robot credentials from external 1Password
  ansible.builtin.include_tasks: resolve-robot-credentials-onepassword.yml
  when: hetzner_baremetal_robot_credentials_backend == 'onepassword_cli'
  no_log: true
