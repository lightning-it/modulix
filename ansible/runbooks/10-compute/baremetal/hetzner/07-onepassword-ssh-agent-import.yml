---
- name: Import the existing controller key into the approved 1Password SSH Agent
  hosts: hetzner_baremetal
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true
  serial: 1

  vars:
    ansible_become: false

  pre_tasks:
    - name: Require one exact target and a closed import action
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit | string | trim == inventory_hostname
          - onepassword_approval_authority_import_action | default('plan') in ['plan', 'apply']
          - >-
            onepassword_approval_authority_import_action | default('plan') == 'plan'
            or not ansible_check_mode
        quiet: true

  tasks:
    - name: Import and verify the exact Approval Authority key
      lit.foundational.onepassword_ssh_key_import:
        action: "{{ onepassword_approval_authority_import_action | default('plan') }}"
        cli_path: "{{ hetzner_baremetal_onepassword.cli_path }}"
        cli_sha256: "{{ hetzner_baremetal_onepassword.cli_sha256 }}"
        cli_version: "{{ hetzner_baremetal_onepassword.cli_version }}"
        account_id: "{{ hetzner_baremetal_onepassword.account_id }}"
        account_sign_in_address: >-
          {{ hetzner_baremetal_onepassword.account_sign_in_address }}
        authorized_user_uuids: >-
          {{ hetzner_baremetal_onepassword.authorized_user_uuids }}
        vault_id: "{{ hetzner_baremetal_onepassword.vault_id }}"
        item_id: >-
          {{ wunderbox_controller_approval_authority_bootstrap.onepassword_item.item_id }}
        item_version: >-
          {{ wunderbox_controller_approval_authority_bootstrap.onepassword_item.item_version | int }}
        item_title: >-
          {{ wunderbox_controller_approval_authority_bootstrap.onepassword_item.item_title }}
        category: SSH Key
        tags: >-
          {{ wunderbox_controller_approval_authority_bootstrap.onepassword_item.tags }}
        subject: >-
          {{ wunderbox_controller_approval_authority_bootstrap.onepassword_item.subject }}
        schema_version: 1
        key_type: ed25519
        expected_fingerprint: >-
          {{ wunderbox_controller_approval_authority_bootstrap.onepassword_item.expected_fingerprint }}
        private_key_path: >-
          {{ wunderbox_controller_approval_authority_bootstrap.private_key_path }}
        allow_import: >-
          {{ onepassword_approval_authority_import_action | default('plan') == 'apply' }}
        confirmation: "{{ onepassword_approval_authority_import_confirmation | default('') }}"
        ssh_add_path: "{{ hetzner_baremetal_onepassword.ssh_agent.ssh_add_path }}"
        ssh_add_sha256: >-
          {{ hetzner_baremetal_onepassword.ssh_agent.ssh_add_sha256 }}
        ssh_keygen_path: >-
          {{ hetzner_baremetal_onepassword.ssh_agent.ssh_keygen_path }}
        ssh_keygen_sha256: >-
          {{ hetzner_baremetal_onepassword.ssh_agent.ssh_keygen_sha256 }}
        agent_socket_path: >-
          {{ hetzner_baremetal_onepassword.ssh_agent.agent_socket_path }}
      register: _onepassword_approval_authority_import
      no_log: true

    - name: Report the secret-free imported SSH identity
      ansible.builtin.debug:
        msg:
          action: >-
            {{ onepassword_approval_authority_import_action | default('plan') }}
          changed: "{{ _onepassword_approval_authority_import.changed }}"
          created: >-
            {{ _onepassword_approval_authority_import.created | default(false) }}
          exists: >-
            {{ _onepassword_approval_authority_import.exists | default(false) }}
          item_id: >-
            {{ _onepassword_approval_authority_import.item_id | default('') }}
          item_version: >-
            {{ _onepassword_approval_authority_import.item_version | default(0) }}
          fingerprint: >-
            {{ _onepassword_approval_authority_import.fingerprint }}
          agent_verified: >-
            {{ _onepassword_approval_authority_import.agent_verified | default(false) }}
