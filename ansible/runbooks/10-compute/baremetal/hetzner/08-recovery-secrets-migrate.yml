---
# Copy recovery passphrases from persistent Ansible Vault bootstrap documents
# to HashiCorp Vault KV v2 without deleting or rewriting the source escrow.
- name: PreCheck (require a safe target limit)
  hosts: hetzner_baremetal
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Require an explicit limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | string | trim | length > 0
        fail_msg: >-
          This runbook requires --limit with the intended host or group.
      tags: [always]

- name: Migrate recovery secrets to HashiCorp Vault
  hosts: hetzner_baremetal
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true
  serial: 1
  vars:
    # Do not inherit the installed host's remote /usr/bin/python3 for this
    # controller-local play; Vault modules require the EE Python dependencies.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  pre_tasks:
    - name: Require the bootstrap backend as the migration source
      ansible.builtin.assert:
        that:
          - >-
            hetzner_baremetal_secret_backend == 'ansible_vault_bootstrap'
          - hetzner_baremetal_ansible_vault is mapping
          - >-
            hetzner_baremetal_ansible_vault_secret_path
            | default('', true) | length > 0
          - hetzner_baremetal_vault is mapping
          - >-
            hetzner_baremetal_vault.engine_mount_point
            | default('', true) | length > 0
          - >-
            hetzner_baremetal_vault_secret_path
            | default('', true) | length > 0
          - >-
            hetzner_baremetal_vault.recovery_passphrase_field
            | default('', true) | length > 0
          - >-
            hetzner_baremetal_vault.recovery_source_field
            | default('', true) | length > 0
          - >-
            hetzner_baremetal_vault.recovery_subject_field
            | default('', true) | length > 0
          - >-
            hetzner_baremetal_vault.recovery_schema_version_field
            | default('', true) | length > 0
          - >-
            hetzner_baremetal_vault.recovery_source_ciphertext_sha256_field
            | default('', true) | length > 0
          - >-
            [
              hetzner_baremetal_vault.recovery_passphrase_field,
              hetzner_baremetal_vault.recovery_source_field,
              hetzner_baremetal_vault.recovery_subject_field,
              hetzner_baremetal_vault.recovery_schema_version_field,
              hetzner_baremetal_vault.recovery_source_ciphertext_sha256_field
            ] | unique | length == 5
        fail_msg: >-
          Migration requires ansible_vault_bootstrap as the selected source,
          and the complete inventory Ansible Vault and HashiCorp Vault
          contracts.
        quiet: true
      no_log: true
      tags: [always]

  tasks:
    - name: Migrate recovery secrets through an ephemeral Vault transport
      block:
        - name: Resolve scoped controller authentication for migration
          ansible.builtin.include_tasks: >-
            ../../../00-common/tasks/resolve-hashicorp-vault-auth.yml
          no_log: true
          tags: [always]

        - name: Decrypt and validate the bootstrap recovery document
          ansible.builtin.include_tasks: >-
            ../../../00-common/tasks/resolve-recovery-secret.yml
          no_log: true

        - name: Calculate the immutable bootstrap ciphertext SHA-256
          ansible.builtin.stat:
            path: "{{ _hetzner_recovery_resolver_path_normalized }}"
            get_checksum: true
            checksum_algorithm: sha256
          delegate_to: localhost
          become: false
          register: _hetzner_recovery_migration_source_stat
          changed_when: false
          no_log: true

        - name: Require a valid immutable bootstrap ciphertext digest
          ansible.builtin.assert:
            that:
              - _hetzner_recovery_migration_source_stat.stat.exists | default(false)
              - >-
                _hetzner_recovery_migration_source_stat.stat.checksum
                | default('') is match('^[0-9a-f]{64}$')
            fail_msg: >-
              The immutable Ansible Vault bootstrap ciphertext has no valid
              SHA-256 migration identity.
            quiet: true
          no_log: true

        - name: Build the exact recovery migration fields
          ansible.builtin.set_fact:
            _hetzner_recovery_migration_expected_fields: >-
              {{
                {
                  hetzner_baremetal_vault.recovery_passphrase_field:
                    _hetzner_baremetal_recovery_passphrase,
                  hetzner_baremetal_vault.recovery_source_field:
                    'ansible_vault_bootstrap',
                  hetzner_baremetal_vault.recovery_subject_field:
                    inventory_hostname,
                  hetzner_baremetal_vault.recovery_schema_version_field:
                    (hetzner_baremetal_ansible_vault.schema_version | int),
                  hetzner_baremetal_vault.recovery_source_ciphertext_sha256_field:
                    _hetzner_recovery_migration_source_stat.stat.checksum
                }
              }}
          no_log: true

        - name: Read the destination HashiCorp Vault document
          community.hashi_vault.vault_kv2_get:
            url: "{{ _hetzner_hashicorp_vault_auth.url }}"
            namespace: >-
              {{
                _hetzner_hashicorp_vault_auth.namespace
                if (_hetzner_hashicorp_vault_auth.namespace | length > 0)
                else omit
              }}
            validate_certs: "{{ _hetzner_hashicorp_vault_auth.validate_certs }}"
            ca_cert: "{{ _hetzner_hashicorp_vault_auth.ca_cert }}"
            timeout: "{{ _hetzner_hashicorp_vault_auth.timeout }}"
            retries: "{{ _hetzner_hashicorp_vault_auth.retries }}"
            auth_method: "{{ _hetzner_hashicorp_vault_auth.auth_method }}"
            mount_point: "{{ _hetzner_hashicorp_vault_auth.auth_mount_point }}"
            role_id: "{{ _hetzner_hashicorp_vault_auth.role_id }}"
            secret_id: "{{ _hetzner_hashicorp_vault_auth.secret_id }}"
            engine_mount_point: "{{ hetzner_baremetal_vault.engine_mount_point }}"
            path: "{{ hetzner_baremetal_vault_secret_path }}"
          register: _hetzner_recovery_migration_destination
          failed_when: false
          no_log: true

        - name: Classify the HashiCorp Vault destination read
          ansible.builtin.set_fact:
            _hetzner_recovery_migration_destination_missing: >-
              {{
                _hetzner_recovery_migration_destination.secret is not defined
                and
                _hetzner_recovery_migration_destination.msg
                | default('')
                is match('^Invalid or missing path ')
              }}
            _hetzner_recovery_migration_destination_present: >-
              {{ _hetzner_recovery_migration_destination.secret is defined }}
          no_log: true

        - name: Reject destination errors other than an absent KV path
          ansible.builtin.assert:
            that:
              - >-
                _hetzner_recovery_migration_destination_present
                or _hetzner_recovery_migration_destination_missing
            fail_msg: >-
              HashiCorp Vault destination read failed for a reason other than an
              absent KV path. Nothing was written.
            quiet: true
          no_log: true

        - name: Require equality when the destination already exists
          ansible.builtin.assert:
            that:
              - >-
                _hetzner_recovery_migration_destination_missing
                or
                _hetzner_recovery_migration_destination.secret[
                  hetzner_baremetal_vault.recovery_passphrase_field
                ] | default('')
                == _hetzner_baremetal_recovery_passphrase
              - >-
                _hetzner_recovery_migration_destination_missing
                or
                _hetzner_recovery_migration_destination.secret[
                  hetzner_baremetal_vault.recovery_source_field
                ] | default('') == 'ansible_vault_bootstrap'
              - >-
                _hetzner_recovery_migration_destination_missing
                or
                _hetzner_recovery_migration_destination.secret[
                  hetzner_baremetal_vault.recovery_subject_field
                ] | default('') == inventory_hostname
              - >-
                _hetzner_recovery_migration_destination_missing
                or
                _hetzner_recovery_migration_destination.secret[
                  hetzner_baremetal_vault.recovery_schema_version_field
                ] | default(0) | int
                == hetzner_baremetal_ansible_vault.schema_version | int
              - >-
                _hetzner_recovery_migration_destination_missing
                or
                _hetzner_recovery_migration_destination.secret[
                  hetzner_baremetal_vault.recovery_source_ciphertext_sha256_field
                ] | default('')
                == _hetzner_recovery_migration_source_stat.stat.checksum
            fail_msg: >-
              The destination document already exists with missing or different
              recovery material. It will not be overwritten.
            quiet: true
          no_log: true

        - name: Create the absent destination with CAS zero
          when:
            - _hetzner_recovery_migration_destination_missing
            - not ansible_check_mode
          no_log: true
          block:
            - name: Write the absent recovery document
              community.hashi_vault.vault_kv2_write:
                url: "{{ _hetzner_hashicorp_vault_auth.url }}"
                namespace: >-
                  {{
                    _hetzner_hashicorp_vault_auth.namespace
                    if (_hetzner_hashicorp_vault_auth.namespace | length > 0)
                    else omit
                  }}
                validate_certs: "{{ _hetzner_hashicorp_vault_auth.validate_certs }}"
                ca_cert: "{{ _hetzner_hashicorp_vault_auth.ca_cert }}"
                timeout: "{{ _hetzner_hashicorp_vault_auth.timeout }}"
                retries: "{{ _hetzner_hashicorp_vault_auth.retries }}"
                auth_method: "{{ _hetzner_hashicorp_vault_auth.auth_method }}"
                mount_point: >-
                  {{ _hetzner_hashicorp_vault_auth.auth_mount_point }}
                role_id: "{{ _hetzner_hashicorp_vault_auth.role_id }}"
                secret_id: "{{ _hetzner_hashicorp_vault_auth.secret_id }}"
                engine_mount_point: >-
                  {{ hetzner_baremetal_vault.engine_mount_point }}
                path: "{{ hetzner_baremetal_vault_secret_path }}"
                cas: 0
                data: "{{ _hetzner_recovery_migration_expected_fields }}"
          rescue:
            - name: Re-read the destination after a possible CAS-zero race
              community.hashi_vault.vault_kv2_get:
                url: "{{ _hetzner_hashicorp_vault_auth.url }}"
                namespace: >-
                  {{
                    _hetzner_hashicorp_vault_auth.namespace
                    if (_hetzner_hashicorp_vault_auth.namespace | length > 0)
                    else omit
                  }}
                validate_certs: "{{ _hetzner_hashicorp_vault_auth.validate_certs }}"
                ca_cert: "{{ _hetzner_hashicorp_vault_auth.ca_cert }}"
                timeout: "{{ _hetzner_hashicorp_vault_auth.timeout }}"
                retries: "{{ _hetzner_hashicorp_vault_auth.retries }}"
                auth_method: "{{ _hetzner_hashicorp_vault_auth.auth_method }}"
                mount_point: >-
                  {{ _hetzner_hashicorp_vault_auth.auth_mount_point }}
                role_id: "{{ _hetzner_hashicorp_vault_auth.role_id }}"
                secret_id: "{{ _hetzner_hashicorp_vault_auth.secret_id }}"
                engine_mount_point: >-
                  {{ hetzner_baremetal_vault.engine_mount_point }}
                path: "{{ hetzner_baremetal_vault_secret_path }}"
              register: _hetzner_recovery_migration_race_read

            - name: Accept a CAS-zero race only when the winner is identical
              ansible.builtin.assert:
                that:
                  - >-
                    _hetzner_recovery_migration_race_read.secret
                    == _hetzner_recovery_migration_expected_fields
                fail_msg: >-
                  The CAS-zero write lost a race and the entire winning document
                  does not exactly equal the expected bootstrap migration record.
                quiet: true
        - name: Read back the HashiCorp Vault destination
          community.hashi_vault.vault_kv2_get:
            url: "{{ _hetzner_hashicorp_vault_auth.url }}"
            namespace: >-
              {{
                _hetzner_hashicorp_vault_auth.namespace
                if (_hetzner_hashicorp_vault_auth.namespace | length > 0)
                else omit
              }}
            validate_certs: "{{ _hetzner_hashicorp_vault_auth.validate_certs }}"
            ca_cert: "{{ _hetzner_hashicorp_vault_auth.ca_cert }}"
            timeout: "{{ _hetzner_hashicorp_vault_auth.timeout }}"
            retries: "{{ _hetzner_hashicorp_vault_auth.retries }}"
            auth_method: "{{ _hetzner_hashicorp_vault_auth.auth_method }}"
            mount_point: "{{ _hetzner_hashicorp_vault_auth.auth_mount_point }}"
            role_id: "{{ _hetzner_hashicorp_vault_auth.role_id }}"
            secret_id: "{{ _hetzner_hashicorp_vault_auth.secret_id }}"
            engine_mount_point: "{{ hetzner_baremetal_vault.engine_mount_point }}"
            path: "{{ hetzner_baremetal_vault_secret_path }}"
          register: _hetzner_recovery_migration_verified
          when: >-
            not ansible_check_mode
            or _hetzner_recovery_migration_destination_present
          no_log: true

        - name: Require exact migrated recovery-secret equality
          ansible.builtin.assert:
            that:
              - >-
                _hetzner_recovery_migration_verified.secret[
                  hetzner_baremetal_vault.recovery_passphrase_field
                ] == _hetzner_baremetal_recovery_passphrase
              - >-
                _hetzner_recovery_migration_verified.secret[
                  hetzner_baremetal_vault.recovery_source_field
                ] == 'ansible_vault_bootstrap'
              - >-
                _hetzner_recovery_migration_verified.secret[
                  hetzner_baremetal_vault.recovery_subject_field
                ] == inventory_hostname
              - >-
                _hetzner_recovery_migration_verified.secret[
                  hetzner_baremetal_vault.recovery_schema_version_field
                ] | int
                == hetzner_baremetal_ansible_vault.schema_version | int
              - >-
                _hetzner_recovery_migration_verified.secret[
                  hetzner_baremetal_vault.recovery_source_ciphertext_sha256_field
                ] == _hetzner_recovery_migration_source_stat.stat.checksum
            fail_msg: >-
              HashiCorp Vault migration readback did not exactly match the
              Ansible Vault bootstrap escrow.
            quiet: true
          when: >-
            not ansible_check_mode
            or _hetzner_recovery_migration_destination_present
          no_log: true

        - name: Report successful migration without deleting bootstrap escrow
          ansible.builtin.debug:
            msg: >-
              Recovery-secret equality is verified in HashiCorp Vault. The
              encrypted Ansible Vault bootstrap escrow remains in place.
          when: >-
            not ansible_check_mode
            or _hetzner_recovery_migration_destination_present

      always:
        - name: Close the controller Vault recovery-migration transport
          ansible.builtin.include_tasks: >-
            ../../../00-common/tasks/close-hashicorp-vault-ssh-tunnel.yml
          tags: [always]
