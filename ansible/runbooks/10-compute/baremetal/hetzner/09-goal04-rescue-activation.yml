---
- name: Plan, apply, or roll back exact Goal 04 Rescue activation
  hosts: hetzner_baremetal
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true
  serial: 1

  vars:
    _wbx_goal04_expected_host: wunderbox01.prd.edge.pub.l-it.io
    _wbx_goal04_expected_server: 3035773
    _wbx_goal04_expected_ipv4: 136.243.38.174
    _wbx_goal04_rescue_public_key: >-
      {{ wunderbox_controller_approval_authority_bootstrap.public_key }}
    _wbx_goal04_confirmation_expected: >-
      {{
        (wbx_goal04_rescue_action | default('plan') | upper)
        ~ '-WBX-G04-RESCUE:' ~ _wbx_goal04_expected_host
        ~ ':' ~ (_wbx_goal04_expected_server | string)
        ~ ':' ~ _wbx_goal04_expected_ipv4
      }}

  pre_tasks:
    - name: Require the exact frozen Goal 04 target and action
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit | string | trim == _wbx_goal04_expected_host
          - inventory_hostname == _wbx_goal04_expected_host
          - hetzner_robot_server_number | int == _wbx_goal04_expected_server
          - ansible_host == _wbx_goal04_expected_ipv4
          - hostname_fqdn == _wbx_goal04_expected_host
          - wbx_goal04_rescue_action | default('plan') in ['plan', 'apply', 'rollback']
          - >-
            wbx_goal04_rescue_action | default('plan') != 'plan'
            or ansible_check_mode
          - >-
            wbx_goal04_rescue_action | default('plan') == 'plan'
            or wbx_goal04_rescue_confirmation | default('')
               == _wbx_goal04_confirmation_expected
          - >-
            _wbx_goal04_rescue_public_key
            == 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMZ6ifHb0Hy7OjUk5NI54DqLLFKNGP1ANWyx1c9mp8xI'
        fail_msg: >-
          Goal 04 Rescue activation requires the exact frozen target and key,
          check mode for planning, and a target-bound apply/rollback confirmation.
        quiet: true

    - name: Resolve Robot API credentials from the selected external backend
      ansible.builtin.include_tasks: tasks/resolve-robot-credentials.yml
      no_log: true

  roles:
    - role: lit.foundational.hetzner_robot_ops
      hetzner_robot_ops_action: >-
        {{
          'set_regular_boot'
          if wbx_goal04_rescue_action | default('plan') == 'rollback'
          else 'activate_rescue'
        }}
      hetzner_robot_ops_hetzner_user: "{{ _hetzner_robot_user }}"
      hetzner_robot_ops_hetzner_password: "{{ _hetzner_robot_password }}"
      hetzner_robot_ops_server_number: "{{ hetzner_robot_server_number }}"
      hetzner_robot_ops_server_ip: "{{ ansible_host }}"
      hetzner_robot_ops_boot_confirmation: "BOOT 3035773"
      hetzner_robot_ops_rescue_os: linux
      hetzner_robot_ops_rescue_authorized_keys:
        - "{{ _wbx_goal04_rescue_public_key }}"

  post_tasks:
    - name: Publish the sanitized Goal 04 Rescue operation result
      ansible.builtin.debug:
        msg:
          action: "{{ hetzner_robot_ops_result.action }}"
          changed: "{{ hetzner_robot_ops_result.changed }}"
          check_mode: "{{ hetzner_robot_ops_result.check_mode }}"
          configuration_type: "{{ hetzner_robot_ops_result.configuration_type }}"
          server_number: "{{ hetzner_robot_ops_result.server_number }}"
