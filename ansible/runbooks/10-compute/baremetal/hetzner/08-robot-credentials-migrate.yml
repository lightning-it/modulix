---
# Copy the immutable controller Robot credential document to Vault KV v2 with
# CAS-zero semantics. The Ansible Vault ciphertext remains authoritative for
# Robot and Wunderbox recovery and is never removed or rewritten.
- name: Migrate one shared Robot credential document to HashiCorp Vault
  hosts: hetzner_baremetal
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true
  vars:
    # Do not inherit the installed host's remote /usr/bin/python3 for this
    # controller-local play; Vault modules require the EE Python dependencies.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  pre_tasks:
    - name: Require the exact inventory-declared Vault host limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit | string | trim == inventory_hostname
          - inventory_hostname == hetzner_baremetal_vault.host
          - hetzner_baremetal_secret_backend == 'ansible_vault_bootstrap'
          - not ansible_check_mode
        fail_msg: >-
          Use --limit with the exact Vault host while ansible_vault_bootstrap
          remains selected. This CAS migration requires a real readback.
        quiet: true
      tags: [always]

    - name: Validate the Robot HashiCorp Vault destination contract
      ansible.builtin.assert:
        that:
          - hetzner_baremetal_vault.robot_secret_path is match('^[^/].*[^/]$')
          - >-
            [
              hetzner_baremetal_vault.robot_schema_version_field,
              hetzner_baremetal_vault.robot_subject_field,
              hetzner_baremetal_vault.robot_username_field,
              hetzner_baremetal_vault.robot_password_field,
              hetzner_baremetal_vault.robot_source_ciphertext_sha256_field
            ] | select('string') | reject('equalto', '') | unique | list
            | length == 5
        fail_msg: "The Robot HashiCorp Vault destination contract is incomplete."
        quiet: true
      no_log: true
      tags: [always]

    - name: Resolve and validate immutable Robot credential ciphertext
      ansible.builtin.include_tasks: tasks/resolve-robot-credentials.yml
      no_log: true
      tags: [always]

  tasks:
    - name: Migrate Robot credentials through an ephemeral Vault transport
      block:
        - name: Resolve scoped controller HashiCorp Vault authentication
          ansible.builtin.include_tasks: >-
            ../../../00-common/tasks/resolve-hashicorp-vault-auth.yml
          no_log: true
          tags: [always]

        - name: Calculate immutable Robot ciphertext identity
          ansible.builtin.stat:
            path: "{{ _hetzner_robot_credentials_path_normalized }}"
            follow: false
            get_checksum: true
            checksum_algorithm: sha256
            get_attributes: false
            get_mime: false
          register: _hetzner_robot_migration_source_stat
          delegate_to: localhost
          become: false
          changed_when: false
          no_log: true

        - name: Build exact Robot migration document
          ansible.builtin.set_fact:
            _hetzner_robot_migration_expected: >-
              {{
                {
                  hetzner_baremetal_vault.robot_schema_version_field:
                    _hetzner_robot_credentials_document.schema_version,
                  hetzner_baremetal_vault.robot_subject_field:
                    _hetzner_robot_credentials_document.subject,
                  hetzner_baremetal_vault.robot_username_field:
                    _hetzner_robot_credentials_document.username,
                  hetzner_baremetal_vault.robot_password_field:
                    _hetzner_robot_credentials_document.password,
                  hetzner_baremetal_vault.robot_source_ciphertext_sha256_field:
                    _hetzner_robot_migration_source_stat.stat.checksum
                }
              }}
          changed_when: false
          no_log: true

        - name: Read Robot HashiCorp Vault destination
          community.hashi_vault.vault_kv2_get:
            url: "{{ _hetzner_hashicorp_vault_auth.url }}"
            namespace: >-
              {{
                _hetzner_hashicorp_vault_auth.namespace
                if (_hetzner_hashicorp_vault_auth.namespace | length > 0)
                else omit
              }}
            validate_certs: "{{ _hetzner_hashicorp_vault_auth.validate_certs }}"
            ca_cert: "{{ _hetzner_hashicorp_vault_auth.ca_cert }}"
            timeout: "{{ _hetzner_hashicorp_vault_auth.timeout }}"
            retries: "{{ _hetzner_hashicorp_vault_auth.retries }}"
            auth_method: "{{ _hetzner_hashicorp_vault_auth.auth_method }}"
            mount_point: "{{ _hetzner_hashicorp_vault_auth.auth_mount_point }}"
            role_id: "{{ _hetzner_hashicorp_vault_auth.role_id }}"
            secret_id: "{{ _hetzner_hashicorp_vault_auth.secret_id }}"
            engine_mount_point: "{{ hetzner_baremetal_vault.engine_mount_point }}"
            path: "{{ hetzner_baremetal_vault.robot_secret_path }}"
          register: _hetzner_robot_migration_destination
          failed_when: false
          no_log: true

        - name: Classify Robot HashiCorp Vault destination
          ansible.builtin.set_fact:
            _hetzner_robot_migration_present: >-
              {{ _hetzner_robot_migration_destination.secret is defined }}
            _hetzner_robot_migration_missing: >-
              {{
                _hetzner_robot_migration_destination.secret is not defined
                and _hetzner_robot_migration_destination.msg
                    | default('') is match('^Invalid or missing path ')
              }}
          changed_when: false
          no_log: true

        - name: Reject Robot destination errors and drift
          ansible.builtin.assert:
            that:
              - >-
                _hetzner_robot_migration_present
                or _hetzner_robot_migration_missing
              - >-
                _hetzner_robot_migration_missing
                or _hetzner_robot_migration_destination.secret
                   == _hetzner_robot_migration_expected
            fail_msg: >-
              Robot Vault destination failed or contains a different document.
              Existing data will never be overwritten.
            quiet: true
          no_log: true

        - name: Persist absent Robot document with CAS zero
          when: _hetzner_robot_migration_missing | bool
          no_log: true
          block:
            - name: Create absent Robot HashiCorp Vault document
              community.hashi_vault.vault_kv2_write:
                url: "{{ _hetzner_hashicorp_vault_auth.url }}"
                namespace: >-
                  {{
                    _hetzner_hashicorp_vault_auth.namespace
                    if (_hetzner_hashicorp_vault_auth.namespace | length > 0)
                    else omit
                  }}
                validate_certs: "{{ _hetzner_hashicorp_vault_auth.validate_certs }}"
                ca_cert: "{{ _hetzner_hashicorp_vault_auth.ca_cert }}"
                timeout: "{{ _hetzner_hashicorp_vault_auth.timeout }}"
                retries: "{{ _hetzner_hashicorp_vault_auth.retries }}"
                auth_method: "{{ _hetzner_hashicorp_vault_auth.auth_method }}"
                mount_point: "{{ _hetzner_hashicorp_vault_auth.auth_mount_point }}"
                role_id: "{{ _hetzner_hashicorp_vault_auth.role_id }}"
                secret_id: "{{ _hetzner_hashicorp_vault_auth.secret_id }}"
                engine_mount_point: "{{ hetzner_baremetal_vault.engine_mount_point }}"
                path: "{{ hetzner_baremetal_vault.robot_secret_path }}"
                cas: 0
                data: "{{ _hetzner_robot_migration_expected }}"

          rescue:
            - name: Re-read Robot document after a possible CAS race
              community.hashi_vault.vault_kv2_get:
                url: "{{ _hetzner_hashicorp_vault_auth.url }}"
                namespace: >-
                  {{
                    _hetzner_hashicorp_vault_auth.namespace
                    if (_hetzner_hashicorp_vault_auth.namespace | length > 0)
                    else omit
                  }}
                validate_certs: "{{ _hetzner_hashicorp_vault_auth.validate_certs }}"
                ca_cert: "{{ _hetzner_hashicorp_vault_auth.ca_cert }}"
                timeout: "{{ _hetzner_hashicorp_vault_auth.timeout }}"
                retries: "{{ _hetzner_hashicorp_vault_auth.retries }}"
                auth_method: "{{ _hetzner_hashicorp_vault_auth.auth_method }}"
                mount_point: "{{ _hetzner_hashicorp_vault_auth.auth_mount_point }}"
                role_id: "{{ _hetzner_hashicorp_vault_auth.role_id }}"
                secret_id: "{{ _hetzner_hashicorp_vault_auth.secret_id }}"
                engine_mount_point: "{{ hetzner_baremetal_vault.engine_mount_point }}"
                path: "{{ hetzner_baremetal_vault.robot_secret_path }}"
              register: _hetzner_robot_migration_race_read

            - name: Accept Robot CAS race only for exact equality
              ansible.builtin.assert:
                that:
                  - >-
                    _hetzner_robot_migration_race_read.secret
                    == _hetzner_robot_migration_expected
                fail_msg: "Robot CAS-zero race winner is not the exact expected document."
                quiet: true

        - name: Read back migrated Robot document
          community.hashi_vault.vault_kv2_get:
            url: "{{ _hetzner_hashicorp_vault_auth.url }}"
            namespace: >-
              {{
                _hetzner_hashicorp_vault_auth.namespace
                if (_hetzner_hashicorp_vault_auth.namespace | length > 0)
                else omit
              }}
            validate_certs: "{{ _hetzner_hashicorp_vault_auth.validate_certs }}"
            ca_cert: "{{ _hetzner_hashicorp_vault_auth.ca_cert }}"
            timeout: "{{ _hetzner_hashicorp_vault_auth.timeout }}"
            retries: "{{ _hetzner_hashicorp_vault_auth.retries }}"
            auth_method: "{{ _hetzner_hashicorp_vault_auth.auth_method }}"
            mount_point: "{{ _hetzner_hashicorp_vault_auth.auth_mount_point }}"
            role_id: "{{ _hetzner_hashicorp_vault_auth.role_id }}"
            secret_id: "{{ _hetzner_hashicorp_vault_auth.secret_id }}"
            engine_mount_point: "{{ hetzner_baremetal_vault.engine_mount_point }}"
            path: "{{ hetzner_baremetal_vault.robot_secret_path }}"
          register: _hetzner_robot_migration_verified
          no_log: true

        - name: Require exact Robot migration readback
          ansible.builtin.assert:
            that:
              - >-
                _hetzner_robot_migration_verified.secret
                == _hetzner_robot_migration_expected
              - _hetzner_robot_credentials_file.stat.exists | default(false)
            fail_msg: >-
              Robot migration readback failed or the independent Ansible Vault
              ciphertext is no longer present.
            quiet: true
          no_log: true

        - name: Report verified Robot migration without exposing credentials
          ansible.builtin.debug:
            msg: >-
              Robot credential equality is verified in HashiCorp Vault; the
              independent Ansible Vault ciphertext remains retained.

      always:
        - name: Close the controller Vault Robot-migration transport
          ansible.builtin.include_tasks: >-
            ../../../00-common/tasks/close-hashicorp-vault-ssh-tunnel.yml
          tags: [always]
