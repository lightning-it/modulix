---
- name: Bootstrap Linux vSphere template through VMware Tools
  hosts: all
  connection: local
  gather_facts: false
  serial: 1

  pre_tasks:
    - name: Require --limit
      ansible.builtin.fail:
        msg: "This runbook cannot be run with no --limit (single template host required)."
      when: ansible_limit is not defined
      run_once: true

    - name: Require a single host in --limit
      ansible.builtin.assert:
        that:
          - ansible_limit is match('^[^,:&|!()]+$')
        fail_msg: >-
          ansible_limit must be a single template hostname. Example:
          --limit template-rhel-10-minimal
      when: ansible_limit is defined
      run_once: true

    - name: Show limit
      ansible.builtin.debug:
        msg: "Limit is {{ ansible_limit }}, continuing with template bootstrap."
      when: ansible_limit is defined
      run_once: true

  roles:
    - role: lit.foundational.vmware_vsphere_guest_bootstrap
