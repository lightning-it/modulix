---
# -----------------------------------------------------------------------------
# Ansible Automation Platform (AAP) hosts
#
# Purpose:
# - Enable required repos
# - Apply host firewall policy when provided
# - Install AAP packages
# - Apply AAP configuration-as-code objects
# - Expose day-2 operations (restart/status/upgrade/sync_hub_password)
# -----------------------------------------------------------------------------

- name: Configure AAP hosts
  hosts: aaps
  become: true
  gather_facts: true

  pre_tasks:
    - name: Resolve AAP public DNS precheck hostname
      ansible.builtin.set_fact:
        aap_public_dns_precheck_hostname: >-
          {{
            (
              aap_deploy_gateway_main_url
              | default('', true)
              | urlsplit('hostname')
            )
            if (aap_deploy_gateway_main_url | default('', true) | trim | length > 0)
            else
            (
              aap_cac_gateway_hostname
              | default('', true)
              | regex_replace('^https?://', '')
              | regex_replace('/.*$', '')
              | regex_replace(':.*$', '')
            )
          }}
      tags:
        - aap
        - aap_deploy
        - dns

    - name: Validate AAP public DNS precheck hostname
      ansible.builtin.assert:
        that:
          - aap_public_dns_precheck_hostname | trim | length > 0
          - aap_public_dns_precheck_hostname is not match('^https?://')
        fail_msg: >-
          AAP public DNS precheck requires a plain hostname. Set
          aap_deploy_gateway_main_url or aap_cac_gateway_hostname to the public
          AAP FQDN before running the AAP rollout.
        quiet: true
      tags:
        - aap
        - aap_deploy
        - dns

    - name: Resolve expected AAP public DNS addresses from inventory
      ansible.builtin.set_fact:
        aap_public_dns_expected_addresses: >-
          {{
            (
              net_ifaces
              | default([], true)
              | selectattr('role', 'equalto', 'uplink')
              | map(attribute='ipv4')
              | map('regex_replace', '/.*$', '')
              | list
            )
            | default([], true)
          }}
      tags:
        - aap
        - aap_deploy
        - dns

    - name: Validate AAP public DNS before AAP preparation
      ansible.builtin.command:
        argv:
          - getent
          - ahostsv4
          - "{{ aap_public_dns_precheck_hostname }}"
      register: aap_public_dns_precheck_getent
      changed_when: false
      failed_when: false
      tags:
        - aap
        - aap_deploy
        - dns

    - name: Build AAP public DNS address list
      ansible.builtin.set_fact:
        aap_public_dns_precheck_addresses: >-
          {{
            aap_public_dns_precheck_getent.stdout_lines
            | default([], true)
            | map('split')
            | map(attribute=0)
            | reject('equalto', '')
            | unique
            | list
          }}
        aap_public_dns_precheck_usable_addresses: >-
          {{
            aap_public_dns_precheck_getent.stdout_lines
            | default([], true)
            | map('split')
            | map(attribute=0)
            | reject('equalto', '')
            | reject('match', '^(fe80:|127\.|::1$)')
            | unique
            | list
          }}
      tags:
        - aap
        - aap_deploy
        - dns

    - name: Require usable AAP public DNS before AAP preparation
      ansible.builtin.assert:
        that:
          - aap_public_dns_precheck_addresses | length > 0
          - aap_public_dns_precheck_usable_addresses | length > 0
          - >-
            (
              aap_public_dns_precheck_usable_addresses
              | select('match', '^[0-9]+\.')
              | list
              | length
            ) > 0
          - >-
            (aap_public_dns_expected_addresses | length == 0)
            or
            (
              aap_public_dns_precheck_usable_addresses
              | intersect(aap_public_dns_expected_addresses)
              | length
            ) > 0
        fail_msg: >-
          AAP public hostname '{{ aap_public_dns_precheck_hostname }}' does not
          resolve to the expected IPv4 target address from the managed host.
          Resolved addresses:
          {{ aap_public_dns_precheck_addresses | default([]) | join(', ') | default('none', true) }}.
          Expected addresses:
          {{ aap_public_dns_expected_addresses | default([]) | join(', ') | default('none', true) }}.
          Fix DNS before running the AAP rollout.
        quiet: true
      tags:
        - aap
        - aap_deploy
        - dns

  tasks:
    - name: Register RHEL host with RHSM
      ansible.builtin.include_role:
        name: lit.rhel.rhsm
        apply:
          tags: [aap, aap_deploy, rhsm]
      tags:
        - aap
        - aap_deploy
        - rhsm

    - name: Enable RHEL repositories for AAP host
      ansible.builtin.include_role:
        name: lit.rhel.repos
        apply:
          tags: [aap, aap_deploy, repos]
      tags:
        - aap
        - aap_deploy
        - repos

    - name: Prepare AAP install user on RHEL host
      ansible.builtin.include_role:
        name: lit.rhel.users
        apply:
          tags: [aap, aap_deploy, users]
      vars:
        users_accounts:
          - name: "{{ aap_deploy_install_user | default('svc_aap', true) }}"
            gid: "{{ aap_deploy_install_user | default('svc_aap', true) }}"
            groups:
              - wheel
            home: >-
              {{
                aap_deploy_install_user_home
                | default(
                    (aap_deploy_install_dir | default('/opt/aap', true))
                    ~ '/'
                    ~ (aap_deploy_install_user | default('svc_aap', true)),
                    true
                  )
              }}
            shell: "{{ aap_deploy_install_user_shell | default('/bin/bash', true) }}"
            create_home: true
            passwordless_sudo: true
      tags:
        - aap
        - aap_deploy
        - users

    - name: Prepare Podman on AAP host
      ansible.builtin.include_role:
        name: lit.rhel.podman
        apply:
          tags: [aap, aap_deploy, podman]
      tags:
        - aap
        - aap_deploy
        - podman

    - name: Prepare AAP prerequisites and artifacts
      ansible.builtin.include_role:
        name: lit.supplementary.aap_prepare
        apply:
          tags: [aap, aap_prepare, aap_deploy, aap_cac, artifacts]
      tags:
        - aap
        - aap_prepare
        - aap_deploy
        - aap_cac
        - artifacts

    - name: Stage additional configured artifacts
      ansible.builtin.include_role:
        name: lit.supplementary.artifacts
        apply:
          tags: [aap, aap_deploy, artifacts]
      when: artifacts_items | default([]) | length > 0
      tags:
        - aap
        - aap_deploy
        - artifacts

    - name: Seed AAP passwords from Vault (optional, backend orchestration outside role)
      ansible.builtin.import_tasks: tasks/aap_seed_passwords_vault.yml
      when: aap_password_seed_enabled | default(false) | bool
      tags:
        - aap
        - aap_deploy
        - aap_passwords
        - vault
        - aap_cac
        - settings
        - organizations
        - gateway_users
        - gateway_teams
        - gateway_role_user_assignments
        - controller_license
        - controller_credential_types
        - labels
        - controller_credentials
        - controller_projects
        - controller_instance_groups
        - controller_inventories
        - controller_inventory_sources
        - controller_templates
        - hub_collection_remote
        - hub_collection_remotes
        - hub_collection_repository
        - hub_collection_repositories
        - hub_collection_repository_sync
        - hub_group_roles
        - filetree_create
        - filetree_read
        - bulk_host_create
        - hosts
        - groups
        - instances
        - ad_hoc_command
        - ad_hoc_command_cancel
        - bulk_job_launch
        - job_launch
        - jobs_cancel
        - workflow_job_templates
        - workflow_launch
        - applications
        - credential_input_sources
        - dispatch
        - execution_environments
        - global_vars
        - notification_templates
        - object_diff
        - project_update
        - roles
        - schedules
        - ee_builder

    - name: Prepare AAP shared context
      ansible.builtin.include_role:
        name: lit.supplementary.aap
        apply:
          tags: [aap, aap_deploy, aap_cac, aap_ops]
      tags: [aap, aap_deploy, aap_cac, aap_ops]

    - name: Deploy AAP
      ansible.builtin.include_role:
        name: lit.supplementary.aap_deploy
        apply:
          tags: [aap, aap_deploy]
      tags: [aap, aap_deploy]

    - name: AAP configuration-as-code
      ansible.builtin.include_role:
        name: lit.supplementary.aap_cac
        apply:
          tags: [aap, aap_cac]
      tags:
        - aap
        - aap_cac
        - settings
        - organizations
        - gateway_users
        - gateway_teams
        - gateway_role_user_assignments
        - controller_license
        - controller_credential_types
        - labels
        - controller_credentials
        - controller_projects
        - controller_instance_groups
        - controller_inventories
        - controller_inventory_sources
        - controller_templates
        - hub_collection_remote
        - hub_collection_remotes
        - hub_collection_repository
        - hub_collection_repositories
        - hub_collection_repository_sync
        - hub_group_roles
        - filetree_create
        - filetree_read
        - bulk_host_create
        - hosts
        - groups
        - instances
        - ad_hoc_command
        - ad_hoc_command_cancel
        - bulk_job_launch
        - job_launch
        - jobs_cancel
        - workflow_job_templates
        - workflow_launch
        - applications
        - credential_input_sources
        - dispatch
        - execution_environments
        - global_vars
        - notification_templates
        - object_diff
        - project_update
        - roles
        - schedules
        - ee_builder

    # Day-2 operations (default action is none; enables `-t aap_ops -e aap_ops_action=...`)
    - name: AAP ops
      ansible.builtin.include_role:
        name: lit.supplementary.aap_ops
        apply:
          tags: [aap, aap_ops]
      tags: [aap, aap_ops]
