---
# -----------------------------------------------------------------------------
# Ansible Automation Platform (AAP) preflight
#
# Purpose:
# - Verify the AAP host can be reached through the same SSH path used by the
#   execution environment.
# - Verify DNS, base OS tools, artifact source files, and Vault access before
#   the installer run.
# -----------------------------------------------------------------------------

- name: Run AAP deployment preflight
  hosts: aaps
  become: true
  gather_facts: false
  any_errors_fatal: true

  vars:
    aap_preflight_required_commands:
      - podman
      - git
      - openssl
      - python3
      - sudo
    aap_preflight_required_paths:
      - /appl/tmp
      - /appl/ansible-tmp
      - /appl/home
      - /appl/podman
    aap_preflight_vault_enabled: true
    aap_preflight_artifacts_enabled: true

  pre_tasks:
    - name: Wait for AAP SSH path
      ansible.builtin.wait_for_connection:
        timeout: "{{ aap_preflight_wait_for_connection_timeout | default(120) }}"
        sleep: 5

    - name: Gather minimal facts
      ansible.builtin.setup:
        gather_subset:
          - min

  tasks:
    - name: Verify AAP and Vault DNS
      ansible.builtin.getent:
        database: ahostsv4
        key: "{{ item }}"
      loop:
        - "{{ ansible_host | default(inventory_hostname) }}"
        - >-
          {{
            (
              hc_vault_addr
              | default(vault_address | default(lookup('ansible.builtin.env', 'VAULT_ADDR'), true), true)
              | regex_replace('^[a-zA-Z][a-zA-Z0-9+.-]*://', '')
              | regex_replace('/.*$', '')
              | regex_replace(':.*$', '')
            )
          }}
      when:
        - item | string | trim | length > 0
      tags:
        - aap
        - aap_preflight
        - dns

    - name: Verify required AAP host commands
      ansible.builtin.shell: "command -v {{ item | quote }}"
      args:
        executable: /bin/bash
      changed_when: false
      loop: "{{ aap_preflight_required_commands }}"
      tags:
        - aap
        - aap_preflight
        - packages

    - name: Verify required AAP host paths
      ansible.builtin.stat:
        path: "{{ item }}"
      register: aap_preflight_required_path_stats
      loop: "{{ aap_preflight_required_paths }}"
      tags:
        - aap
        - aap_preflight
        - filesystem

    - name: Assert required AAP host paths exist
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false)
          - item.stat.isdir | default(false)
        fail_msg: "Required AAP host path is missing or not a directory: {{ item.item }}"
        quiet: true
      loop: "{{ aap_preflight_required_path_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      tags:
        - aap
        - aap_preflight
        - filesystem

    - name: Verify Podman version
      ansible.builtin.command:
        argv:
          - podman
          - --version
      changed_when: false
      tags:
        - aap
        - aap_preflight
        - podman

    - name: Verify first-install runtime state
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -f /appl/aap/.aap_containerized_installed ]; then
          echo "Existing AAP marker found; leaving install user runtime untouched."
          pgrep -a -u "{{ aap_deploy_install_user | default('svc_aap', true) }}" || true
        else
          echo "No AAP marker found; install user runtime should be empty before first install."
          if pgrep -a -u "{{ aap_deploy_install_user | default('svc_aap', true) }}"; then
            echo "Stop stale install-user processes before first install." >&2
            exit 1
          fi
        fi
      args:
        executable: /bin/bash
      changed_when: false
      tags:
        - aap
        - aap_preflight
        - runtime

    - name: Verify remote AAP artifact source files
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: aap_preflight_artifact_stats
      loop:
        - name: bundle
          source: "{{ aap_prepare_bundle_source | default('auto', true) }}"
          path: "{{ aap_prepare_bundle_remote_src | default('', true) }}"
          required: "{{ aap_prepare_bundle_required | default(true) | bool }}"
        - name: manifest
          source: "{{ aap_prepare_manifest_source | default('auto', true) }}"
          path: "{{ aap_prepare_manifest_remote_src | default('', true) }}"
          required: "{{ aap_prepare_manifest_required | default(false) | bool }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - aap_preflight_artifacts_enabled | bool
        - item.required | bool
        - item.source == 'remote'
        - item.path | string | trim | length > 0
      tags:
        - aap
        - aap_preflight
        - artifacts

    - name: Assert remote AAP artifact source files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false)
          - item.stat.isreg | default(false)
          - (item.stat.size | int) > 0
        fail_msg: "Required AAP artifact source is missing or empty: {{ item.item.path }}"
        quiet: true
      loop: "{{ aap_preflight_artifact_stats.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - not item.skipped | default(false)
      tags:
        - aap
        - aap_preflight
        - artifacts

    - name: Resolve Vault preflight values
      ansible.builtin.set_fact:
        aap_preflight_vault_addr_effective: >-
          {{
            hc_vault_addr
            | default(vault_address | default(lookup('ansible.builtin.env', 'VAULT_ADDR'), true), true)
            | string
            | trim
          }}
        aap_preflight_vault_token_effective: >-
          {{
            hc_vault_token
            | default(vault_token | default(lookup('ansible.builtin.env', 'VAULT_TOKEN'), true), true)
            | string
            | trim
          }}
        aap_preflight_vault_mount_effective: >-
          {{
            hc_vault_engine_mount_point
            | default(vault_engine_mount_point | default(lookup('ansible.builtin.env', 'VAULT_ENGINE_MOUNT_POINT'), true), true)
            | string
            | trim
          }}
        aap_preflight_vault_validate_certs_effective: >-
          {{ hc_vault_validate_certs | default(vault_validate_certs | default(false, true), true) | bool }}
      no_log: true
      when: aap_preflight_vault_enabled | bool
      tags:
        - aap
        - aap_preflight
        - vault

    - name: Assert Vault preflight token values
      ansible.builtin.assert:
        that:
          - aap_preflight_vault_addr_effective | length > 0
          - aap_preflight_vault_token_effective | length > 0
          - aap_preflight_vault_mount_effective | length > 0
        fail_msg: >-
          Vault preflight requires Vault address, token, and KV mount. Export
          VAULT_TOKEN or provide vault_token through vaulted inventory.
        quiet: true
      no_log: true
      when: aap_preflight_vault_enabled | bool
      tags:
        - aap
        - aap_preflight
        - vault

    - name: Check Vault health
      ansible.builtin.uri:
        url: "{{ aap_preflight_vault_addr_effective }}/v1/sys/health"
        method: GET
        validate_certs: "{{ aap_preflight_vault_validate_certs_effective }}"
        status_code:
          - 200
          - 429
          - 472
          - 473
        return_content: false
      delegate_to: localhost
      become: false
      when: aap_preflight_vault_enabled | bool
      tags:
        - aap
        - aap_preflight
        - vault

    - name: Check Vault token
      ansible.builtin.uri:
        url: "{{ aap_preflight_vault_addr_effective }}/v1/auth/token/lookup-self"
        method: GET
        headers:
          X-Vault-Token: "{{ aap_preflight_vault_token_effective }}"
        validate_certs: "{{ aap_preflight_vault_validate_certs_effective }}"
        status_code: 200
        return_content: false
      delegate_to: localhost
      become: false
      no_log: true
      when: aap_preflight_vault_enabled | bool
      tags:
        - aap
        - aap_preflight
        - vault

    - name: Check required Vault KV paths
      ansible.builtin.uri:
        url: >-
          {{ aap_preflight_vault_addr_effective }}/v1/{{
            aap_preflight_vault_mount_effective
          }}/data/{{ item }}
        method: GET
        headers:
          X-Vault-Token: "{{ aap_preflight_vault_token_effective }}"
        validate_certs: "{{ aap_preflight_vault_validate_certs_effective }}"
        status_code: 200
        return_content: false
      delegate_to: localhost
      become: false
      no_log: true
      loop:
        - "{{ hc_vault_defaults_kv_path | default(lookup('ansible.builtin.env', 'AAP_VAULT_DEFAULTS_KV_PATH'), true) }}"
        - "{{ hc_vault_aap_admin_passwords_kv_path | default(lookup('ansible.builtin.env', 'AAP_VAULT_ADMIN_PASSWORDS_KV_PATH'), true) }}"
      when:
        - aap_preflight_vault_enabled | bool
        - item | string | trim | length > 0
      tags:
        - aap
        - aap_preflight
        - vault
