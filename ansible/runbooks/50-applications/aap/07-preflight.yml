---
# -----------------------------------------------------------------------------
# Ansible Automation Platform (AAP) preflight
#
# Purpose:
# - Keep the runbook thin and put reusable validation logic in
#   lit.supplementary.aap_preflight.
# -----------------------------------------------------------------------------

- name: Run AAP deployment preflight
  hosts: aaps
  become: true
  gather_facts: false
  any_errors_fatal: true

  pre_tasks:
    - name: Run optional self-hosted rollout gate
      ansible.builtin.include_role:
        name: aap_self_hosted_preflight
        apply:
          tags: [aap, aap_preflight, aap_self_hosted]
      when: aap_self_hosted_preflight_enabled | default(false) | bool
      tags:
        - aap
        - aap_preflight
        - aap_self_hosted

  roles:
    - role: lit.supplementary.aap_preflight
      tags:
        - aap
        - aap_preflight

  post_tasks:
    - name: Report AAP base OS preparation and preflight success
      ansible.builtin.debug:
        msg: AAP_BASE_OS_AND_PREFLIGHT_OK
      changed_when: false
