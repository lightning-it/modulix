---
# -----------------------------------------------------------------------------
# Ansible Automation Platform (AAP) artifacts
#
# Purpose:
# - Stage the AAP setup bundle and subscription manifest on the AAP host.
# - Reuse lit.supplementary.aap_prepare, which resolves URL, controller-local,
#   and managed-host artifact sources before delegating staging to
#   lit.supplementary.artifacts.
# -----------------------------------------------------------------------------

- name: Stage AAP artifacts
  hosts: aaps
  become: true
  gather_facts: true

  tasks:
    - name: Stage AAP setup bundle and manifest
      ansible.builtin.include_role:
        name: lit.supplementary.aap_prepare
        apply:
          tags: [aap, aap_prepare, artifacts, dns]
      tags:
        - aap
        - aap_prepare
        - artifacts
        - dns

