---
# -----------------------------------------------------------------------------
# Ansible Automation Platform (AAP) artifacts
#
# Purpose:
# - Stage the AAP setup bundle and subscription manifest on the AAP host.
# - Reuse lit.supplementary.aap_prepare, which resolves URL, controller-local,
#   and managed-host artifact sources before delegating staging to
#   lit.supplementary.artifacts.
# -----------------------------------------------------------------------------

- name: Stage AAP artifacts
  hosts: aaps
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify AAP setup account before artifact staging
      ansible.builtin.include_role:
        name: lit.supplementary.aap_preflight
        apply:
          tags: [aap, aap_preflight, aap_prepare, artifacts]
      vars:
        aap_preflight_check_dns: false
        aap_preflight_check_commands: false
        aap_preflight_check_paths: false
        aap_preflight_check_podman: false
        aap_preflight_check_runtime: false
        aap_preflight_check_artifacts: false
        aap_preflight_check_vault: false
        aap_preflight_check_ansible_vault: false
      tags:
        - aap
        - aap_preflight
        - aap_prepare
        - artifacts

  tasks:
    - name: Stage AAP setup bundle and manifest
      ansible.builtin.include_role:
        name: lit.supplementary.aap_prepare
        apply:
          tags: [aap, aap_prepare, artifacts, dns]
      tags:
        - aap
        - aap_prepare
        - artifacts
        - dns
