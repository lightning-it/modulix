---
# -----------------------------------------------------------------------------
# Ansible Automation Platform (AAP) base OS preparation
#
# Purpose:
# - Prepare the OS substrate required by the AAP containerized installer.
# - Keep this usable for customer-provided RHEL hosts where RHSM/repository
#   ownership stays outside this runbook, while still allowing lab/self-managed
#   hosts to opt in to RHSM and repository management.
# -----------------------------------------------------------------------------

- name: Prepare AAP base OS substrate
  hosts: aaps
  become: true
  gather_facts: false
  any_errors_fatal: true

  vars:
    aap_runbook_install_user_effective: >-
      {{ aap_deploy_install_user | default('svc_aap', true) }}
    aap_runbook_install_user_home_effective: >-
      {{
        aap_deploy_install_user_home
        | default('/appl/home/' ~ aap_runbook_install_user_effective, true)
      }}
    aap_runbook_install_user_shell_effective: >-
      {{ aap_deploy_install_user_shell | default('/bin/bash', true) }}

  pre_tasks:
    - name: Bootstrap custom Ansible remote tmp
      ansible.builtin.include_role:
        name: lit.foundational.ansible_remote_tmp
        apply:
          tags: [ansible_remote_tmp]
      vars:
        ansible_remote_tmp_path: "{{ ansible_remote_tmp | default('', true) }}"
      when:
        - ansible_remote_tmp | default('', true) | trim | length > 0
      tags:
        - aap
        - aap_base_os
        - ansible_remote_tmp
        - always

    - name: Reset SSH connection after remote tmp bootstrap
      ansible.builtin.meta: reset_connection

    - name: Wait for stable SSH
      ansible.builtin.wait_for_connection:
        timeout: "{{ aap_runbook_wait_for_connection_timeout | default(300) }}"
        sleep: 5
      register: aap_runbook_wait_result
      retries: "{{ aap_runbook_wait_retries | default(6) }}"
      delay: "{{ aap_runbook_wait_delay | default(10) }}"
      until: aap_runbook_wait_result is succeeded

    - name: Gather facts after SSH stabilization
      ansible.builtin.setup:

  tasks:
    - name: Register RHEL host with RHSM when requested
      ansible.builtin.include_role:
        name: lit.rhel.rhsm
        apply:
          tags: [aap, aap_base_os, os_prep, rhsm]
      when:
        - aap_runbook_manage_rhsm | default(false) | bool
      tags:
        - aap
        - aap_base_os
        - os_prep
        - rhsm

    - name: Enable RHEL repositories when requested
      ansible.builtin.include_role:
        name: lit.rhel.repos
        apply:
          tags: [aap, aap_base_os, os_prep, repos]
      when:
        - aap_runbook_manage_repos | default(false) | bool
      tags:
        - aap
        - aap_base_os
        - os_prep
        - repos

    - name: Install AAP host prerequisite packages
      ansible.builtin.package:
        name: >-
          {{
            aap_runbook_host_packages
            | default([
                'acl',
                'ansible-core',
                'git',
                'openssl',
                'python3',
                'rsync',
                'sudo'
              ])
          }}
        state: present
      when:
        - aap_runbook_manage_host_packages | default(true) | bool
        - >-
          (
            aap_runbook_host_packages
            | default([
                'acl',
                'ansible-core',
                'git',
                'openssl',
                'python3',
                'rsync',
                'sudo'
              ])
          ) | length > 0
      tags:
        - aap
        - aap_base_os
        - os_prep
        - packages

    - name: Ensure AAP filesystem directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode }}"
      loop: >-
        {{
          aap_runbook_base_os_directories
          | default([
              {'path': '/appl/tmp', 'mode': '1777'},
              {'path': '/appl/ansible-tmp', 'mode': '1777'},
              {'path': '/appl/home', 'mode': '0755'},
              {'path': '/appl/podman', 'mode': '0755'},
              {'path': '/appl/aap', 'mode': '0755'}
            ])
        }}
      loop_control:
        label: "{{ item.path }}"
      tags:
        - aap
        - aap_base_os
        - os_prep
        - filesystem

    - name: Prepare AAP install user on RHEL host
      ansible.builtin.include_role:
        name: lit.rhel.users
        apply:
          tags: [aap, aap_base_os, os_prep, users]
      vars:
        users_accounts:
          - name: "{{ aap_runbook_install_user_effective }}"
            gid: "{{ aap_runbook_install_user_effective }}"
            groups:
              - "{{ aap_runbook_install_user_effective }}"
              - wheel
            home: "{{ aap_runbook_install_user_home_effective }}"
            shell: "{{ aap_runbook_install_user_shell_effective }}"
            create_home: true
            passwordless_sudo: true
      when:
        - aap_runbook_manage_install_user | default(true) | bool
      tags:
        - aap
        - aap_base_os
        - os_prep
        - users

    - name: Allow Ansible login user to become AAP install user
      ansible.builtin.copy:
        dest: >-
          /etc/sudoers.d/91-aap-install-user-{{
            ansible_user | regex_replace('[^A-Za-z0-9_-]', '_')
          }}
        owner: root
        group: root
        mode: '0440'
        content: |
          {{ ansible_user }} ALL=({{ aap_runbook_install_user_effective }}) NOPASSWD: ALL
        validate: /usr/sbin/visudo -cf %s
      when:
        - aap_runbook_allow_ansible_user_sudo_to_install_user | default(false) | bool
        - ansible_user | default('', true) | trim | length > 0
        - ansible_user != aap_runbook_install_user_effective
      tags:
        - aap
        - aap_base_os
        - os_prep
        - sudoers

    - name: Prepare Podman on AAP host
      ansible.builtin.include_role:
        name: lit.rhel.podman
        apply:
          tags: [aap, aap_base_os, os_prep, podman]
      when:
        - aap_runbook_manage_podman | default(true) | bool
      tags:
        - aap
        - aap_base_os
        - os_prep
        - podman

    - name: Clean stale install-user runtime before first AAP install
      ansible.builtin.shell: |
        set -euo pipefail
        install_marker="{{ aap_deploy_installed_marker_path | default('/appl/aap/.aap_containerized_installed', true) }}"
        install_user="{{ aap_runbook_install_user_effective }}"

        if [ -f "${install_marker}" ]; then
          echo "installed-marker-present"
          exit 0
        fi

        if ! pgrep -u "${install_user}" >/dev/null 2>&1; then
          echo "no-stale-runtime"
          exit 0
        fi

        loginctl terminate-user "${install_user}" 2>/dev/null || true
        pkill -u "${install_user}" 2>/dev/null || true
        sleep 2

        if pgrep -a -u "${install_user}"; then
          echo "stale-runtime-still-running" >&2
          exit 1
        fi

        echo "stale-runtime-cleaned"
      args:
        executable: /bin/bash
      register: aap_runbook_install_user_runtime_cleanup
      changed_when: "'stale-runtime-cleaned' in aap_runbook_install_user_runtime_cleanup.stdout"
      when:
        - aap_runbook_cleanup_stale_install_user_runtime | default(true) | bool
      tags:
        - aap
        - aap_base_os
        - os_prep
        - runtime

    - name: Verify AAP base OS substrate
      ansible.builtin.shell: |
        set -euo pipefail
        command -v podman
        command -v git
        command -v openssl
        command -v python3
        command -v sudo
        podman --version
        test -d /appl/tmp
        test -d /appl/ansible-tmp
        test -d /appl/home
        test -d /appl/podman
      args:
        executable: /bin/bash
      changed_when: false
      tags:
        - aap
        - aap_base_os
        - verify
