---
# -----------------------------------------------------------------------------
# Ansible Automation Platform (AAP) day-2 operations
#
# Purpose:
# - Run explicit AAP operational actions such as status, restart, upgrade, or
#   hub password synchronization.
# -----------------------------------------------------------------------------

- name: Operate AAP hosts
  hosts: aaps
  become: true
  gather_facts: true

  vars:
    aap_ops_appl_root_effective: "{{ aap_appl_root | default('/appl/aap-local', true) }}"
    aap_ops_automation_ansible_dir_effective: >-
      {{
        aap_automation_ansible_dir
        | default(aap_ops_appl_root_effective ~ '/src/modulix-automation/ansible', true)
      }}
    aap_ops_inventory_name_effective: "{{ inventory_name | default('corp', true) }}"
    aap_ops_inventory_dir_effective: >-
      {{
        aap_ops_automation_ansible_dir_effective
        ~ '/inventories/'
        ~ aap_ops_inventory_name_effective
      }}
    aap_ops_podman_storage_conf_effective: >-
      {{
        aap_podman_storage_conf
        | default(aap_ops_appl_root_effective ~ '/etc/containers-storage.conf', true)
      }}
    aap_ops_podman_tmpdir_effective: "{{ aap_podman_tmpdir | default('/appl/tmp', true) }}"
    aap_ops_modulix_run_ee_image_effective: "{{ modulix_run_ee_image | default('', true) | string | trim }}"

  tasks:
    - name: Prepare AAP shared context
      ansible.builtin.include_role:
        name: lit.supplementary.aap
        apply:
          tags: [aap, aap_ops]
      tags: [aap, aap_ops]

    - name: Collect EDA diagnostics
      when: (aap_ops_action | default('status')) == 'eda_diagnostics'
      block:
        - name: Check EDA API status
          ansible.builtin.uri:
            url: "https://{{ ansible_host | default(inventory_hostname) }}/api/eda/v1/status/"
            method: GET
            validate_certs: false
            return_content: true
            status_code:
              - 200
              - 401
              - 403
              - 404
              - 500
              - 502
              - 503
          register: aap_eda_diagnostics_status
          failed_when: false

        - name: Read AAP installer log tail
          ansible.builtin.command:
            cmd: tail -n 80 /appl/aap/logs/aap_install.log
          register: aap_eda_diagnostics_install_log
          changed_when: false
          failed_when: false

        - name: Resolve install user UID
          ansible.builtin.command:
            argv:
              - id
              - -u
          become: true
          become_user: "{{ aap_deploy_install_user | default('svc_aap', true) }}"
          register: aap_eda_diagnostics_install_user_uid
          changed_when: false
          failed_when: false

        - name: List install user containers
          ansible.builtin.command:
            argv:
              - podman
              - ps
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ aap_eda_diagnostics_install_user_uid.stdout }}"
          become: true
          become_user: "{{ aap_deploy_install_user | default('svc_aap', true) }}"
          register: aap_eda_diagnostics_podman_ps
          changed_when: false
          failed_when: false

        - name: Show EDA diagnostics
          ansible.builtin.debug:
            msg:
              eda_status_code: "{{ aap_eda_diagnostics_status.status | default('unavailable') }}"
              eda_status_body: "{{ aap_eda_diagnostics_status.content | default('') }}"
              install_log_tail: "{{ aap_eda_diagnostics_install_log.stdout_lines | default([]) }}"
              podman_ps: "{{ aap_eda_diagnostics_podman_ps.stdout_lines | default([]) }}"

    - name: Collect local execution diagnostics
      when: (aap_ops_action | default('status')) == 'local_diagnostics'
      block:
        - name: Validate local diagnostics image value
          ansible.builtin.assert:
            that:
              - aap_ops_modulix_run_ee_image_effective | length > 0
            fail_msg: "local_diagnostics requires modulix_run_ee_image in inventory."
            quiet: true

        - name: Check root Podman image
          ansible.builtin.command:
            argv:
              - podman
              - image
              - exists
              - "{{ aap_ops_modulix_run_ee_image_effective }}"
          environment:
            CONTAINERS_STORAGE_CONF: "{{ aap_ops_podman_storage_conf_effective }}"
            TMPDIR: "{{ aap_ops_podman_tmpdir_effective }}"
          register: aap_local_diagnostics_image
          changed_when: false
          failed_when: false

        - name: Inspect root Podman image
          ansible.builtin.command:
            argv:
              - podman
              - image
              - inspect
              - "{{ aap_ops_modulix_run_ee_image_effective }}"
              - --format
              - "{{ '{{' }}.Id{{ '}}' }} {{ '{{' }}.Created{{ '}}' }}"
          environment:
            CONTAINERS_STORAGE_CONF: "{{ aap_ops_podman_storage_conf_effective }}"
            TMPDIR: "{{ aap_ops_podman_tmpdir_effective }}"
          register: aap_local_diagnostics_image_inspect
          changed_when: false
          failed_when: false

        - name: Check AAP filesystem usage
          ansible.builtin.command:
            argv:
              - df
              - -hT
              - /appl
              - /appl/tmp
              - /appl/ansible-tmp
              - /appl/home
              - /appl/podman
          register: aap_local_diagnostics_df
          changed_when: false
          failed_when: false

        - name: Check generated inventory paths
          ansible.builtin.find:
            paths: "{{ aap_ops_inventory_dir_effective }}"
            recurse: true
            file_type: file
            patterns:
              - "*.yml"
              - "*.yaml"
            contains: "/appl/(ansible-tmp|tmp|podman|home|aap)"
            read_whole_file: true
          register: aap_local_diagnostics_inventory_paths
          failed_when: false

        - name: Show local execution diagnostics
          ansible.builtin.debug:
            msg:
              image_exists_rc: "{{ aap_local_diagnostics_image.rc | default('unavailable') }}"
              image_exists_error: "{{ aap_local_diagnostics_image.stderr_lines | default([]) }}"
              image_inspect: "{{ aap_local_diagnostics_image_inspect.stdout_lines | default([]) }}"
              image_inspect_error: "{{ aap_local_diagnostics_image_inspect.stderr_lines | default([]) }}"
              filesystems: "{{ aap_local_diagnostics_df.stdout_lines | default([]) }}"
              inventory_path_files: >-
                {{
                  aap_local_diagnostics_inventory_paths.files
                  | default([])
                  | map(attribute='path')
                  | list
                }}

    - name: Run AAP day-2 operation
      ansible.builtin.include_role:
        name: lit.supplementary.aap_ops
        apply:
          tags: [aap, aap_ops]
      tags: [aap, aap_ops]
      when: (aap_ops_action | default('status')) not in ['eda_diagnostics', 'local_diagnostics']
