---
# -----------------------------------------------------------------------------
# Ansible Automation Platform (AAP) day-2 operations
#
# Purpose:
# - Run explicit AAP operational actions such as status, restart, upgrade, or
#   hub password synchronization.
# -----------------------------------------------------------------------------

- name: Operate AAP hosts
  hosts: aaps
  become: true
  gather_facts: true

  tasks:
    - name: Prepare AAP shared context
      ansible.builtin.include_role:
        name: lit.supplementary.aap
        apply:
          tags: [aap, aap_ops]
      tags: [aap, aap_ops]

    - name: Collect EDA diagnostics
      when: (aap_ops_action | default('status')) == 'eda_diagnostics'
      block:
        - name: Check EDA API status
          ansible.builtin.uri:
            url: "https://{{ ansible_host | default(inventory_hostname) }}/api/eda/v1/status/"
            method: GET
            validate_certs: false
            return_content: true
            status_code:
              - 200
              - 401
              - 403
              - 404
              - 500
              - 502
              - 503
          register: aap_eda_diagnostics_status
          failed_when: false

        - name: Read AAP installer log tail
          ansible.builtin.command:
            cmd: tail -n 80 /appl/aap/logs/aap_install.log
          register: aap_eda_diagnostics_install_log
          changed_when: false
          failed_when: false

        - name: List install user containers
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              export XDG_RUNTIME_DIR="/run/user/$(id -u)"
              podman ps
            executable: /bin/bash
          become: true
          become_user: "{{ aap_deploy_install_user | default('svc_aap', true) }}"
          register: aap_eda_diagnostics_podman_ps
          changed_when: false
          failed_when: false

        - name: Show EDA diagnostics
          ansible.builtin.debug:
            msg:
              eda_status_code: "{{ aap_eda_diagnostics_status.status | default('unavailable') }}"
              eda_status_body: "{{ aap_eda_diagnostics_status.content | default('') }}"
              install_log_tail: "{{ aap_eda_diagnostics_install_log.stdout_lines | default([]) }}"
              podman_ps: "{{ aap_eda_diagnostics_podman_ps.stdout_lines | default([]) }}"

    - name: Collect local execution diagnostics
      when: (aap_ops_action | default('status')) == 'local_diagnostics'
      block:
        - name: Check root Podman image
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              if [ -r /appl/modulix-aap/etc/aap-local.env ]; then
                . /appl/modulix-aap/etc/aap-local.env
              fi
              export CONTAINERS_STORAGE_CONF="${AAP_PODMAN_STORAGE_CONF:-/appl/modulix-aap/etc/containers-storage.conf}"
              export TMPDIR="${AAP_PODMAN_TMPDIR:-/appl/tmp}"
              podman image exists "${MODULIX_RUN_EE_IMAGE}"
              podman image inspect "${MODULIX_RUN_EE_IMAGE}" --format '{{ "{{" }}.Id{{ "}}" }} {{ "{{" }}.Created{{ "}}" }}'
            executable: /bin/bash
          register: aap_local_diagnostics_image
          changed_when: false
          failed_when: false

        - name: Check AAP filesystem usage
          ansible.builtin.command:
            argv:
              - df
              - -hT
              - /appl
              - /appl/tmp
              - /appl/ansible-tmp
              - /appl/home
              - /appl/podman
          register: aap_local_diagnostics_df
          changed_when: false
          failed_when: false

        - name: Check generated inventory paths
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              if [ -r /appl/modulix-aap/etc/aap-local.env ]; then
                . /appl/modulix-aap/etc/aap-local.env
              fi
              grep -RInE '/appl/(ansible-tmp|tmp|podman|home|aap)' \
                "${AUTOMATION_ANSIBLE_DIR}/inventories/${INVENTORY_NAME}" || true
            executable: /bin/bash
          register: aap_local_diagnostics_inventory_paths
          changed_when: false
          failed_when: false

        - name: Show local execution diagnostics
          ansible.builtin.debug:
            msg:
              image_check: "{{ aap_local_diagnostics_image.stdout_lines | default([]) }}"
              image_check_error: "{{ aap_local_diagnostics_image.stderr_lines | default([]) }}"
              filesystems: "{{ aap_local_diagnostics_df.stdout_lines | default([]) }}"
              inventory_paths: "{{ aap_local_diagnostics_inventory_paths.stdout_lines | default([]) }}"

    - name: Run AAP day-2 operation
      ansible.builtin.include_role:
        name: lit.supplementary.aap_ops
        apply:
          tags: [aap, aap_ops]
      tags: [aap, aap_ops]
      when: (aap_ops_action | default('status')) not in ['eda_diagnostics', 'local_diagnostics']
