---
- name: Deploy AIO Semaphore stack
  hosts: "{{ aio_target | default('aio') }}"
  become: true
  gather_facts: true
  vars:
    _aio_services_cfg: >-
      {{
        (
          services.aio
          if (
            services is defined and
            services is mapping and
            services.aio is defined and
            services.aio is mapping
          )
          else
          (aio_services | default({}))
        )
      }}
    _enabled_values:
      - enabled
      - "true"
      - "yes"
      - "on"
      - "1"
      - "y"

  tasks:
    - name: Configure Ubuntu netplan
      ansible.builtin.include_role:
        name: lit.ubuntu.netplan
        apply:
          tags:
            - network
            - netplan
            - aio
      when: >-
        (
          aio_service_netplan
          | default(_aio_services_cfg.netplan | default('enabled'))
          | string
          | lower
        ) in _enabled_values
      tags:
        - network
        - netplan
        - aio

    - name: Deploy shared PostgreSQL
      ansible.builtin.include_role:
        name: lit.supplementary.postgres_deploy
        apply:
          tags:
            - postgres
            - postgres_deploy
            - aio
      when: >-
        (
          aio_service_postgres_deploy
          | default(
              _aio_services_cfg.postgres_deploy
              | default(
                  (
                    not (semaphore_deploy_manage_postgres | default(true) | bool)
                  )
                  | ternary('enabled', 'disabled')
                )
            )
          | string
          | lower
        ) in _enabled_values
      tags:
        - postgres
        - postgres_deploy
        - aio

    - name: Deploy Semaphore
      ansible.builtin.include_role:
        name: lit.supplementary.semaphore_deploy
        apply:
          tags:
            - semaphore
            - semaphore_deploy
            - aio
      when: >-
        (
          aio_service_semaphore_deploy
          | default(_aio_services_cfg.semaphore_deploy | default('enabled'))
          | string
          | lower
        ) in _enabled_values
      tags:
        - semaphore
        - semaphore_deploy
        - aio

    - name: Configure Semaphore CaC
      ansible.builtin.include_role:
        name: lit.supplementary.semaphore_cac
        apply:
          tags:
            - semaphore
            - semaphore_cac
            - aio
      when: >-
        (
          aio_service_semaphore_cac
          | default(
              _aio_services_cfg.semaphore_cac
              | default(semaphore_cac_enabled | default(true))
            )
          | string
          | lower
        ) in _enabled_values
      tags:
        - semaphore
        - semaphore_cac
        - aio
