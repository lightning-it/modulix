---
- name: Run LIT Atlas deployment preflight
  hosts: atlas
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - vars/main.yml

  tasks:
    - name: Validate Atlas inventory contract
      ansible.builtin.assert:
        that:
          - _lit_atlas_enabled is boolean
          - _lit_atlas_domain is string
          - _lit_atlas_config_dir is string
          - _lit_atlas_state_dir is string
          - _lit_atlas_quadlet_dir is string
          - _lit_atlas_backup_dir is string
          - _atlas_services_cfg is mapping
          - >-
            _atlas_services_cfg.keys() | list | sort
            == ['alertmanager', 'alloy', 'checkmk', 'grafana', 'loki',
                'prometheus', 'rsyslog']
          - _atlas_services_cfg.values() | list | map('lower') | unique | list == ['enabled']
          - _lit_atlas_data_dir | trim | length > 0
          - _lit_atlas_bind_address | trim | length > 0
          - _lit_atlas_storage is mapping
          - _lit_atlas_storage.approved | bool
          - _lit_atlas_storage.mount_point == '/srv/atlas'
          - _lit_atlas_storage.filesystem == 'xfs'
          - _lit_atlas_storage.encryption == 'luks2'
          - _lit_atlas_storage.redundancy == 'raid1'
          - _lit_atlas_storage.minimum_devices | int == 2
          - _lit_atlas_storage.devices is sequence
          - _lit_atlas_storage.devices is not string
          - _lit_atlas_storage.devices | length == 2
          - _lit_atlas_storage.devices | unique | length == 2
          - >-
            _lit_atlas_storage.devices
            | select('match', '^/dev/disk/by-id/')
            | list | length == 2
          - _lit_atlas_retention is mapping
          - _lit_atlas_retention.keys() | list | sort == ['backup', 'loki', 'prometheus', 'rsyslog']
          - _lit_atlas_retention.values() | select('string') | list | length == 4
          - _lit_atlas_off_host_backup is mapping
          - _lit_atlas_off_host_backup.approved | default(false) | bool
          - _lit_atlas_off_host_backup.provisioned | default(false) | bool
          - _lit_atlas_off_host_backup.protocol | default('') == 's3'
          - _lit_atlas_off_host_backup.schedule | default('') == 'daily'
          - _lit_atlas_off_host_backup.rpo_hours | default(0) | int == 24
          - _lit_atlas_off_host_backup.rto_hours | default(0) | int == 8
          - >-
            _lit_atlas_off_host_backup.restore_test_interval_days
            | default(0) | int == 90
          - >-
            _lit_atlas_off_host_backup.restore_test_after_material_change
            | default(false) | bool
          - >-
            _lit_atlas_off_host_backup.client_side_encryption
            | default('') == 'required'
          - _lit_atlas_off_host_backup.versioning | default(false) | bool
          - >-
            (_lit_atlas_off_host_backup.object_lock | default({}))
            .enabled_at_creation | default(false) | bool
          - >-
            (_lit_atlas_off_host_backup.object_lock | default({}))
            .mode | default('') == 'governance'
          - >-
            (_lit_atlas_off_host_backup.object_lock | default({}))
            .retention_days | default(0) | int == 30
          - _lit_atlas_alerting is mapping
          - _lit_atlas_alerting.owner | default('') == 'platform_operations'
          - >-
            _lit_atlas_alerting.escalation | default([])
            == ['platform_operations', 'incident_commander',
                'information_security', 'atlas_service_owner']
          - >-
            _lit_atlas_alerting.receiver_secret_source | default('')
            == 'hashicorp_vault'
          - >-
            _lit_atlas_alerting.receiver_secret_kv_path | default('')
            | trim | length > 0
          - _lit_atlas_images is mapping
          - >-
            _lit_atlas_images.keys() | list | sort
            == ['alertmanager', 'alloy', 'checkmk', 'grafana', 'loki',
                'prometheus', 'rsyslog']
          - >-
            _lit_atlas_images.values()
            | select('match', '^[^\\s]+@sha256:[0-9a-f]{64}$')
            | list | length == 7
          - _lit_atlas_ports is mapping
          - >-
            _lit_atlas_ports.keys() | list | sort
            == ['alertmanager', 'alloy', 'checkmk', 'grafana', 'loki',
                'prometheus', 'rsyslog_tcp', 'rsyslog_udp']
          - _lit_atlas_ports.values() | map('int') | min >= 1
          - _lit_atlas_ports.values() | map('int') | max <= 65535
        fail_msg: >-
          Atlas inventory is incomplete or storage approval is absent. Provide
          the complete lit_atlas_* and services.atlas contracts before rollout.
        quiet: true
      tags: [atlas, atlas_preflight]

    - name: Inspect the approved Atlas data mount
      ansible.builtin.command:
        argv:
          - findmnt
          - --json
          - --target
          - "{{ _lit_atlas_storage.mount_point }}"
      changed_when: false
      failed_when: false
      register: _lit_atlas_findmnt
      tags: [atlas, atlas_preflight]

    - name: Parse the Atlas data mount
      ansible.builtin.set_fact:
        _lit_atlas_mount: >-
          {{
            (
              _lit_atlas_findmnt.stdout | from_json
            ).filesystems | first
          }}
      changed_when: false
      when:
        - _lit_atlas_findmnt.rc == 0
        - _lit_atlas_findmnt.stdout | trim | length > 0
      tags: [atlas, atlas_preflight]

    - name: Require the approved Atlas filesystem and hardening options
      ansible.builtin.assert:
        that:
          - _lit_atlas_findmnt.rc == 0
          - _lit_atlas_mount | default({}) is mapping
          - _lit_atlas_mount.target | default('') == _lit_atlas_storage.mount_point
          - _lit_atlas_mount.fstype | default('') == _lit_atlas_storage.filesystem
          - >-
            _lit_atlas_storage.mount_options
            | difference((_lit_atlas_mount.options | default('') | string).split(','))
            | length == 0
        fail_msg: The approved and hardened Atlas data filesystem is not mounted.
        quiet: true
      tags: [atlas, atlas_preflight]

    - name: Verify required runtime commands are available
      ansible.builtin.command:
        argv:
          - "{{ item }}"
          - --version
      changed_when: false
      loop:
        - podman
      tags: [atlas, atlas_preflight]
