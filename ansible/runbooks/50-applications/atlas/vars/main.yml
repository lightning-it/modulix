---
_lit_atlas_enabled: "{{ lit_atlas_enabled | default(none) }}"
_lit_atlas_domain: "{{ lit_atlas_domain | default(none) }}"
_lit_atlas_data_dir: "{{ lit_atlas_data_dir | default(none) }}"
_lit_atlas_config_dir: "{{ lit_atlas_config_dir | default(none) }}"
_lit_atlas_state_dir: "{{ lit_atlas_state_dir | default(none) }}"
_lit_atlas_quadlet_dir: "{{ lit_atlas_quadlet_dir | default(none) }}"
_lit_atlas_backup_dir: "{{ lit_atlas_backup_dir | default(none) }}"
_lit_atlas_bind_address: "{{ lit_atlas_bind_address | default(none) }}"
_lit_atlas_storage: "{{ lit_atlas_storage | default({}) }}"
_lit_atlas_retention: "{{ lit_atlas_retention | default({}) }}"
_lit_atlas_off_host_backup: "{{ lit_atlas_off_host_backup | default({}) }}"
_lit_atlas_alerting: "{{ lit_atlas_alerting | default({}) }}"
_lit_atlas_images: "{{ lit_atlas_images | default({}) }}"
_lit_atlas_ports: "{{ lit_atlas_ports | default({}) }}"

_lit_atlas_prepare_ubuntu_enabled: "{{ lit_atlas_prepare_ubuntu_enabled | default(true) }}"
_lit_atlas_podman_enabled: "{{ lit_atlas_podman_enabled | default(true) }}"
_lit_atlas_firewall_enabled: "{{ lit_atlas_firewall_enabled | default(false) }}"
_lit_atlas_grafana_enabled: "{{ lit_atlas_grafana_enabled | default(true) }}"
_lit_atlas_prometheus_enabled: "{{ lit_atlas_prometheus_enabled | default(true) }}"
_lit_atlas_loki_enabled: "{{ lit_atlas_loki_enabled | default(true) }}"
_lit_atlas_alloy_enabled: "{{ lit_atlas_alloy_enabled | default(true) }}"
_lit_atlas_alertmanager_enabled: "{{ lit_atlas_alertmanager_enabled | default(true) }}"
_lit_atlas_rsyslog_enabled: "{{ lit_atlas_rsyslog_enabled | default(true) }}"
_lit_atlas_checkmk_enabled: "{{ lit_atlas_checkmk_enabled | default(true) }}"

_lit_atlas_grafana_port: "{{ _lit_atlas_ports.grafana | default(none) }}"
_lit_atlas_prometheus_port: "{{ _lit_atlas_ports.prometheus | default(none) }}"
_lit_atlas_alertmanager_port: "{{ _lit_atlas_ports.alertmanager | default(none) }}"
_lit_atlas_loki_port: "{{ _lit_atlas_ports.loki | default(none) }}"
_lit_atlas_alloy_port: "{{ _lit_atlas_ports.alloy | default(none) }}"
_lit_atlas_rsyslog_tcp_port: "{{ _lit_atlas_ports.rsyslog_tcp | default(none) }}"
_lit_atlas_rsyslog_udp_port: "{{ _lit_atlas_ports.rsyslog_udp | default(none) }}"
_lit_atlas_checkmk_port: "{{ _lit_atlas_ports.checkmk | default(none) }}"

_atlas_services_cfg: >-
  {{
    (
      services.atlas
      if (
        services is defined and
        services is mapping and
        services.atlas is defined and
        services.atlas is mapping
      )
      else {}
    )
  }}
_enabled_values: ['enabled', 'true', 'yes', 'on', '1', 'y']
