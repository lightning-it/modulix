---
_lit_atlas_enabled: "{{ lit_atlas_enabled }}"
_lit_atlas_domain: "{{ lit_atlas_domain }}"
_lit_atlas_data_dir: "{{ lit_atlas_data_dir }}"
_lit_atlas_config_dir: "{{ lit_atlas_config_dir }}"
_lit_atlas_state_dir: "{{ lit_atlas_state_dir }}"
_lit_atlas_quadlet_dir: "{{ lit_atlas_quadlet_dir }}"
_lit_atlas_backup_dir: "{{ lit_atlas_backup_dir }}"
_lit_atlas_bind_address: "{{ lit_atlas_bind_address }}"
_lit_atlas_storage: "{{ lit_atlas_storage }}"
_lit_atlas_retention: "{{ lit_atlas_retention }}"
_lit_atlas_images: "{{ lit_atlas_images }}"
_lit_atlas_ports: "{{ lit_atlas_ports }}"

_lit_atlas_prepare_ubuntu_enabled: "{{ lit_atlas_prepare_ubuntu_enabled | default(true) }}"
_lit_atlas_podman_enabled: "{{ lit_atlas_podman_enabled | default(true) }}"
_lit_atlas_firewall_enabled: "{{ lit_atlas_firewall_enabled | default(false) }}"
_lit_atlas_grafana_enabled: "{{ lit_atlas_grafana_enabled | default(true) }}"
_lit_atlas_prometheus_enabled: "{{ lit_atlas_prometheus_enabled | default(true) }}"
_lit_atlas_loki_enabled: "{{ lit_atlas_loki_enabled | default(true) }}"
_lit_atlas_alloy_enabled: "{{ lit_atlas_alloy_enabled | default(true) }}"
_lit_atlas_alertmanager_enabled: "{{ lit_atlas_alertmanager_enabled | default(true) }}"
_lit_atlas_rsyslog_enabled: "{{ lit_atlas_rsyslog_enabled | default(true) }}"
_lit_atlas_checkmk_enabled: "{{ lit_atlas_checkmk_enabled | default(true) }}"

_lit_atlas_grafana_port: "{{ _lit_atlas_ports.grafana }}"
_lit_atlas_prometheus_port: "{{ _lit_atlas_ports.prometheus }}"
_lit_atlas_alertmanager_port: "{{ _lit_atlas_ports.alertmanager }}"
_lit_atlas_loki_port: "{{ _lit_atlas_ports.loki }}"
_lit_atlas_alloy_port: "{{ _lit_atlas_ports.alloy }}"
_lit_atlas_rsyslog_tcp_port: "{{ _lit_atlas_ports.rsyslog_tcp }}"
_lit_atlas_rsyslog_udp_port: "{{ _lit_atlas_ports.rsyslog_udp }}"
_lit_atlas_checkmk_port: "{{ _lit_atlas_ports.checkmk }}"

_atlas_services_cfg: >-
  {{
    (
      services.atlas
      if (
        services is defined and
        services is mapping and
        services.atlas is defined and
        services.atlas is mapping
      )
      else {}
    )
  }}
_enabled_values: ['enabled', 'true', 'yes', 'on', '1', 'y']
