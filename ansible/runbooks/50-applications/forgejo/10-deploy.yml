---
- name: Deploy Forgejo
  become: true
  hosts: "{{ forgejo_target | default('forgejo') }}"
  gather_facts: true
  roles:
    - role: lit.supplementary.forgejo_deploy
      tags:
        - forgejo
        - forgejo_deploy

    - role: lit.supplementary.forgejo_cac
      when: forgejo_cac_enabled | default(true) | bool
      tags:
        - forgejo
        - forgejo_cac
