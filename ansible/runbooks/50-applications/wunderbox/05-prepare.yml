---
- name: Prepare Wunderbox hosts
  hosts: wunderboxes
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  vars:
    _wunderbox_orchestration_phase: prepare
    _wunderbox_orchestration_mutating: true
    _wunderbox_services_cfg: >-
      {{
        (
          services.wunderbox
          if (
            services is defined and
            services is mapping and
            services.wunderbox is defined and
            services.wunderbox is mapping
          )
          else
          (wunderbox_services | default({}))
        )
      }}
    _enabled_values: ['enabled', 'true', 'yes', 'on', '1', 'y']

  pre_tasks:
    - name: Enforce the Wunderbox orchestration boundary
      ansible.builtin.import_tasks: tasks/orchestration-guard.yml
      tags: [always]

    - name: End after the read-only Wunderbox preparation plan
      ansible.builtin.meta: end_play
      when: >-
        ansible_check_mode
        or wunderbox_orchestration_action | default('plan') == 'plan'
      tags: [always]

  tasks:
    - name: Enable required repos
      ansible.builtin.include_role:
        name: lit.rhel.repos
        apply:
          tags: [wunderbox, wunderbox_prepare, repos]
      when: >-
        (
          wunderbox_service_repos
          | default(_wunderbox_services_cfg.repos | default('disabled'))
          | string | lower
        ) in _enabled_values
      tags: [wunderbox, wunderbox_prepare, repos]

    - name: Apply firewall policy
      ansible.builtin.include_role:
        name: fedora.linux_system_roles.firewall
        apply:
          tags: [wunderbox, wunderbox_prepare, firewall]
      when: >-
        (
          wunderbox_service_firewall
          | default('disabled')
          | string | lower
        ) in _enabled_values
      tags: [wunderbox, wunderbox_prepare, firewall]
