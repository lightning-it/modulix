---
- name: Operate Wunderbox hosts
  hosts: wunderboxes
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  vars:
    _wunderbox_orchestration_phase: ops
    _wunderbox_orchestration_mutating: false

  pre_tasks:
    - name: Enforce the Wunderbox orchestration boundary
      ansible.builtin.import_tasks: tasks/orchestration-guard.yml
      tags: [always]

  tasks:
    - name: Show Wunderbox container runtime status
      ansible.builtin.command:
        argv:
          - podman
          - ps
          - -a
      changed_when: false
      tags: [wunderbox, wunderbox_ops]

    - name: Show Wunderbox kube systemd units
      ansible.builtin.command:
        argv:
          - systemctl
          - list-units
          - "podman-kube@*"
          - --no-pager
      changed_when: false
      failed_when: false
      tags: [wunderbox, wunderbox_ops]
