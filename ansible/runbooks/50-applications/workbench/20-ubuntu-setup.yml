---
# Inventory-driven Ubuntu Workbench application setup.
#
# The operating-system installation, Ubuntu baseline, CIS remediation,
# networking, update policy, and encrypted boot lifecycle are deliberately out
# of scope here. This play may only run for the single inventory-declared
# Workbench selected by an exact --limit.

- name: Configure the selected Ubuntu Workbench
  hosts: ubuntu_workbenches
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1

  pre_tasks:
    - name: Validate the exact Workbench target and component contract
      ansible.builtin.import_tasks: tasks/target-contract.yml
      tags: [always]

    - name: Prepare the dedicated Incus logical volume
      ansible.builtin.import_tasks: tasks/incus-storage.yml
      when: workbench_components.incus_storage | bool
      tags: [workbench, workbench_incus_storage, incus, storage]

  roles:
    - role: lit.ubuntu.repos
      when: workbench_components.repos | bool
      tags: [workbench, workbench_repos, repos]

    - role: lit.ubuntu.users
      when: workbench_components.users | bool
      tags: [workbench, workbench_users, users]

    - role: lit.ubuntu.openssh_server
      when: workbench_components.openssh | bool
      tags: [workbench, workbench_openssh, openssh]

    - role: lit.ubuntu.podman
      when: workbench_components.podman | bool
      tags: [workbench, workbench_podman, podman, containers]

    - role: lit.ubuntu.incus
      when: workbench_components.incus | bool
      tags: [workbench, workbench_incus, incus, virtualization]

    - role: lit.ubuntu.developer_tools
      when: workbench_components.developer_tools | bool
      tags: [workbench, workbench_developer_tools, developer_tools]
