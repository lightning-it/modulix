---
- name: Validate declared tool probes before executing them
  ansible.builtin.assert:
    that:
      - item.name | default('') | length > 0
      - item.argv | default([]) is sequence
      - item.argv | default([]) is not string
      - item.argv | length > 0
      - item.version_regex | default('') | length > 0
    fail_msg: >-
      Tool probe definition is malformed for
      {{ item.name | default('unnamed tool') }} from
      {{ item.source | default('an undeclared source') }}.
    quiet: true
  loop: "{{ workbench_acceptance.tools }}"
  loop_control:
    label: "{{ item.name | default('unnamed tool') }}"
  changed_when: false

- name: Run declared tool version probes
  ansible.builtin.command:
    argv: "{{ item.argv }}"
  become: false
  loop: "{{ workbench_acceptance.tools }}"
  loop_control:
    label: "{{ item.name | default('unnamed tool') }}"
  register: workbench_validation_tool_probes
  become: false
  changed_when: false
  failed_when: false
  check_mode: false
- name: Require every declared tool and version
  ansible.builtin.assert:
    that:
      - item.item.name | default('') | length > 0
      - item.item.argv | default([]) is sequence
      - item.item.argv | default([]) is not string
      - item.item.argv | length > 0
      - item.item.version_regex | default('') | length > 0
      - item.rc == 0
      - (item.stdout ~ "\n" ~ item.stderr) is search(item.item.version_regex)
    fail_msg: >-
      Tool probe failed or returned an unexpected version for
      {{ item.item.name | default('unnamed tool') }} from
      {{ item.item.source | default('an undeclared source') }}.
    quiet: true
  loop: "{{ workbench_validation_tool_probes.results }}"
  loop_control:
    label: "{{ item.item.name | default('unnamed tool') }}"
  changed_when: false

- name: Read isolated Python environment package inventory
  ansible.builtin.command:
    argv:
      - "{{ workbench_acceptance.python_environment.path }}/bin/python"
      - -m
      - pip
      - list
      - --format=json
  register: workbench_validation_python_packages
  become: false
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require isolated Python environment package inventory
  ansible.builtin.assert:
    that:
      - workbench_validation_python_packages.rc == 0
    fail_msg: "Could not read the isolated Python package inventory."
    quiet: true
  changed_when: false

- name: Initialize normalized Python package map
  ansible.builtin.set_fact:
    workbench_validation_python_package_map: {}
  changed_when: false
- name: Build normalized Python package map
  ansible.builtin.set_fact:
    workbench_validation_python_package_map: >-
      {{
        workbench_validation_python_package_map
        | combine({(item.name | lower): (item.version | string)})
      }}
  loop: "{{ workbench_validation_python_packages.stdout | from_json }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Require declared isolated Python package versions
  ansible.builtin.assert:
    that:
      - item.key | lower in workbench_validation_python_package_map
      - workbench_validation_python_package_map.get(item.key | lower, '') == (item.value | string)
    fail_msg: "Python package {{ item.key }} is absent or has version drift."
    quiet: true
  loop: "{{ workbench_acceptance.python_environment.packages | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false

- name: Read global npm package inventory
  ansible.builtin.command:
    argv: [npm, list, --global, --depth=0, --json]
  register: workbench_validation_npm_packages
  become: false
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require global npm package inventory
  ansible.builtin.assert:
    that:
      - workbench_validation_npm_packages.rc in [0, 1]
      - workbench_validation_npm_packages.stdout | default('') | length > 0
    fail_msg: "Could not read the global npm package inventory."
    quiet: true
  changed_when: false

- name: Decode global npm package inventory
  ansible.builtin.set_fact:
    workbench_validation_npm_package_map: >-
      {%- set npm_inventory = workbench_validation_npm_packages.stdout | from_json -%}
      {%- set npm_dependencies = npm_inventory.get('dependencies', {})
          if npm_inventory is mapping else {} -%}
      {{ npm_dependencies if npm_dependencies is mapping else {} }}
  changed_when: false
- name: Require declared global npm package versions
  ansible.builtin.assert:
    that:
      - item.key in workbench_validation_npm_package_map
      - >-
        workbench_validation_npm_package_map.get(item.key, {}).get('version', '')
        == item.value | string
    fail_msg: "Global npm package {{ item.key }} is absent or has version drift."
    quiet: true
  loop: "{{ workbench_acceptance.npm_packages | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
