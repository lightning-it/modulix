---
- name: Read uid for Podman user {{ workbench_validation_podman_user }}
  ansible.builtin.command:
    argv: [id, --user, "{{ workbench_validation_podman_user }}"]
  register: workbench_validation_podman_uid
  changed_when: false
  check_mode: false

- name: Read passwd entry for Podman user {{ workbench_validation_podman_user }}
  ansible.builtin.command:
    argv: [getent, passwd, "{{ workbench_validation_podman_user }}"]
  register: workbench_validation_podman_passwd
  changed_when: false
  check_mode: false

- name: Require the Podman user in the developer acceptance contract
  ansible.builtin.assert:
    that:
      - >-
        workbench_acceptance.users
        | selectattr('name', 'equalto', workbench_validation_podman_user)
        | list | length == 1
      - workbench_validation_podman_passwd.stdout.split(':') | length == 7
    fail_msg: >-
      Each rootless Podman user must be one declared Workbench developer.
    quiet: true
  changed_when: false

- name: Read rootless Podman state for {{ workbench_validation_podman_user }}
  ansible.builtin.command:
    argv: [podman, info, --format, json]
  become: true
  become_user: "{{ workbench_validation_podman_user }}"
  environment:
    HOME: "{{ workbench_validation_podman_passwd.stdout.split(':')[5] }}"
    XDG_RUNTIME_DIR: "/run/user/{{ workbench_validation_podman_uid.stdout | trim }}"
  register: workbench_validation_podman_info
  changed_when: false
  failed_when: false
  check_mode: false
- name: Read rootless Podman socket enablement for {{ workbench_validation_podman_user }}
  ansible.builtin.command:
    argv: [systemctl, --user, is-enabled, podman.socket]
  become: true
  become_user: "{{ workbench_validation_podman_user }}"
  environment:
    HOME: "{{ workbench_validation_podman_passwd.stdout.split(':')[5] }}"
    XDG_RUNTIME_DIR: "/run/user/{{ workbench_validation_podman_uid.stdout | trim }}"
  register: workbench_validation_podman_socket_enabled
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read rootless Podman socket activity for {{ workbench_validation_podman_user }}
  ansible.builtin.command:
    argv: [systemctl, --user, is-active, podman.socket]
  become: true
  become_user: "{{ workbench_validation_podman_user }}"
  environment:
    HOME: "{{ workbench_validation_podman_passwd.stdout.split(':')[5] }}"
    XDG_RUNTIME_DIR: "/run/user/{{ workbench_validation_podman_uid.stdout | trim }}"
  register: workbench_validation_podman_socket_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require rootless Podman info evidence for {{ workbench_validation_podman_user }}
  ansible.builtin.assert:
    that:
      - workbench_validation_podman_info.rc == 0
      - workbench_validation_podman_info.stdout | default('') | trim | length > 0
    fail_msg: >-
      Could not read rootless Podman info for {{ workbench_validation_podman_user }}.
    quiet: true
  changed_when: false

- name: Decode rootless Podman info for {{ workbench_validation_podman_user }}
  ansible.builtin.set_fact:
    workbench_validation_podman_info_data: "{{ workbench_validation_podman_info.stdout | from_json }}"
  changed_when: false

- name: Require rootless Podman state for {{ workbench_validation_podman_user }}
  ansible.builtin.assert:
    that:
      - >-
        workbench_validation_podman_info_data.get('host', {}).get('security', {}).get('rootless', false)
        | bool
      - >-
        workbench_validation_podman_info_data.get('store', {}).get('graphDriverName', '')
        == workbench_acceptance.podman.storage_driver
      - workbench_validation_podman_socket_enabled.stdout | trim == 'enabled'
      - workbench_validation_podman_socket_active.stdout | trim == 'active'
    fail_msg: >-
      Rootless Podman storage or user socket drift detected for
      {{ workbench_validation_podman_user }}.
    quiet: true
  changed_when: false
