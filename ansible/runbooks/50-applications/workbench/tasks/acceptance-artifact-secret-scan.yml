---
- name: Inspect Heavy evidence and scanner helpers
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
  loop:
    - "{{ workbench_acceptance_artifacts }}"
    - "{{ workbench_acceptance_workspace }}/workbench-secret-scan.py"
    - "{{ workbench_acceptance_workspace }}/workbench-sanitize-log.py"
  loop_control:
    label: "{{ item }}"
  register: workbench_heavy_secret_scan_paths
  changed_when: false

- name: Find temporary raw Heavy guest logs
  ansible.builtin.find:
    paths: "{{ workbench_acceptance_artifacts }}"
    patterns: "*.raw.log"
    file_type: file
    recurse: false
  register: workbench_heavy_raw_logs
  changed_when: false
  when: workbench_heavy_secret_scan_paths.results[0].stat.isdir | default(false)

- name: Scan and sanitize Heavy evidence before deleting every raw copy
  block:
    - name: Require Heavy evidence and both redaction helpers
      ansible.builtin.assert:
        that:
          - workbench_heavy_secret_scan_paths.results[0].stat.isdir | default(false)
          - workbench_heavy_secret_scan_paths.results[1].stat.isreg | default(false)
          - workbench_heavy_secret_scan_paths.results[2].stat.isreg | default(false)
        fail_msg: "Heavy evidence cannot be finalized without both bounded redaction helpers."
        quiet: true
      changed_when: false

    - name: Scan raw Heavy evidence without returning matched values
      ansible.builtin.command:
        argv:
          - "{{ workbench_acceptance_workspace }}/workbench-secret-scan.py"
          - "{{ workbench_acceptance_artifacts }}"
      become: true
      become_user: "{{ workbench_acceptance_operator }}"
      environment:
        HOME: "{{ workbench_acceptance_operator_home }}"
      register: workbench_heavy_secret_scan
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Write sanitized Heavy guest log
      ansible.builtin.command:
        argv:
          - "{{ workbench_acceptance_workspace }}/workbench-sanitize-log.py"
          - "{{ item.path }}"
          - "{{ item.path | regex_replace('\\.raw\\.log$', '.log') }}"
          - --replace
          - "{{ workbench_acceptance_workspace }}"
          - --replace
          - "{{ workbench_acceptance_operator_home }}"
      become: true
      become_user: "{{ workbench_acceptance_operator }}"
      environment:
        HOME: "{{ workbench_acceptance_operator_home }}"
      loop: "{{ workbench_heavy_raw_logs.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      changed_when: true
      no_log: true

    - name: Persist Heavy secret-scan result without matched values
      ansible.builtin.copy:
        dest: "{{ workbench_acceptance_artifacts }}/secret-scan.json"
        owner: "{{ workbench_acceptance_operator }}"
        mode: "0600"
        content: "{{ workbench_heavy_secret_scan.stdout }}\n"
      no_log: true

    - name: Require clean Heavy evidence
      ansible.builtin.assert:
        that:
          - workbench_heavy_secret_scan.rc == 0
          - (workbench_heavy_secret_scan.stdout | from_json).status == 'passed'
        fail_msg: >-
          Heavy evidence contains high-confidence credential material. Raw guest
          logs were removed and match values were not returned; inspect only the
          pattern names and locations securely.
        quiet: true
      changed_when: false
  always:
    - name: Delete every temporary raw Heavy guest log
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ workbench_heavy_raw_logs.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      no_log: true
