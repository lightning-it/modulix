    fail_msg: "Refusing to delete a Heavy image without exact run ownership."
    quiet: true
  changed_when: false
  when: workbench_heavy_cleanup_image_exists.rc == 0

- name: Delete exact run-owned Heavy image
  ansible.builtin.command:
    argv: [podman, image, rm, --force, "{{ workbench_heavy_image }}"]
  become: true
  become_user: "{{ workbench_acceptance_operator }}"
  environment:
    HOME: "{{ workbench_acceptance_operator_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ workbench_heavy_operator_uid.stdout | trim }}"
  changed_when: true
  when: workbench_heavy_cleanup_image_exists.rc == 0
