      - workbench_heavy_cleanup_image_exists.rc in [0, 1]
    fail_msg: "Rootless Podman could not determine the exact Heavy image state."
    quiet: true
  changed_when: false

- name: Inspect exact Heavy image owner labels
  ansible.builtin.command:
    argv: [podman, image, inspect, --format=json, "{{ workbench_heavy_image }}"]
  become: true
  become_user: "{{ workbench_acceptance_operator }}"
  environment:
    HOME: "{{ workbench_acceptance_operator_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ workbench_heavy_operator_uid.stdout | trim }}"
  register: workbench_heavy_cleanup_image_inspect
  changed_when: false
  check_mode: false
  when: workbench_heavy_cleanup_image_exists.rc == 0

- name: Decode exact Heavy image owner labels
  ansible.builtin.set_fact:
    workbench_heavy_cleanup_image_labels: >-
      {{
        (workbench_heavy_cleanup_image_inspect.stdout | from_json | first)
        .get(
          'Labels',
          (workbench_heavy_cleanup_image_inspect.stdout | from_json | first)
          .get('Config', {}).get('Labels', {})
        )
      }}
  changed_when: false
  when: workbench_heavy_cleanup_image_exists.rc == 0

- name: Require exact Heavy image ownership before deletion
  ansible.builtin.assert:
    that:
      - >-
        workbench_heavy_cleanup_image_labels.get('io.lit.managed-by', '')
        == 'modulix-automation'
      - >-
        workbench_heavy_cleanup_image_labels.get('io.lit.run-id', '')
