---
- name: Require an explicit safe acceptance profile and run identifier
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - workbench_acceptance_profile is defined
      - workbench_acceptance_profile is string
      - workbench_acceptance_profile in ['tiny', 'heavy', 'application']
      - workbench_acceptance_run_id is defined
      - workbench_acceptance_run_id is string
      - workbench_acceptance_run_id is match('^[a-z0-9][a-z0-9-]{2,23}$')
    fail_msg: >-
      Acceptance requires normal mode plus
      workbench_acceptance_profile=tiny|heavy|application and a lowercase,
      3-to-24-character workbench_acceptance_run_id.
    quiet: true
  changed_when: false

- name: Require the Workbench acceptance contract root before profile resolution
  ansible.builtin.assert:
    that:
      - workbench_acceptance is defined
      - workbench_acceptance | default({}) is mapping
    fail_msg: "The selected host does not define a Workbench acceptance contract."
    quiet: true
  changed_when: false

- name: Require structured sections for the selected acceptance profile
  ansible.builtin.assert:
    that:
      - workbench_acceptance.get('incus', none) is mapping
      - workbench_acceptance.get(workbench_acceptance_profile, none) is mapping
    fail_msg: >-
      The Workbench acceptance contract must define structured Incus and
      selected-profile sections.
    quiet: true
  changed_when: false

- name: Resolve requested acceptance profile
  ansible.builtin.set_fact:
    workbench_acceptance_profile_config: >-
      {{ workbench_acceptance.get(workbench_acceptance_profile, {}) }}
    workbench_acceptance_cleanup_config: >-
      {{ workbench_acceptance.get('incus', {}).get('cleanup', none) }}
    workbench_acceptance_project_config: >-
      {{ workbench_acceptance.get('incus', {}).get('project', none) }}
    workbench_acceptance_incus_profile_config: >-
      {{ workbench_acceptance.get('incus', {}).get('profile', none) }}
  changed_when: false

- name: Require structured resources for the selected acceptance profile
  ansible.builtin.assert:
    that:
      - workbench_acceptance_cleanup_config is mapping
      - workbench_acceptance_project_config is mapping
      - workbench_acceptance_incus_profile_config is mapping
      - workbench_acceptance_profile_config.get('limits', none) is mapping
    fail_msg: >-
      The selected acceptance profile requires structured cleanup, project,
      profile, and resource-limit sections.
    quiet: true
  changed_when: false

- name: Require a safe selected acceptance profile identity
  ansible.builtin.assert:
    that:
      - workbench_acceptance_cleanup_config.get('managed_name_prefix', '') is string
      - >-
        workbench_acceptance_cleanup_config.get('managed_name_prefix', '')
        is match('^[a-z0-9][a-z0-9-]+-$')
      - workbench_acceptance_profile_config.get('name', '') is string
      - >-
        workbench_acceptance_profile_config.get('name', '')
        is match(
          '^'
          ~ workbench_acceptance_cleanup_config.get('managed_name_prefix', '')
          ~ '[a-z0-9-]+$'
        )
    fail_msg: >-
      The selected acceptance profile must have a safe name inside the
      inventory-declared cleanup namespace.
    quiet: true
  changed_when: false

- name: Resolve requested acceptance instance base name
  ansible.builtin.set_fact:
    workbench_acceptance_base_instance_name: >-
      {{
        workbench_acceptance_profile_config.get('name', '')
        ~ '-' ~ workbench_acceptance_run_id
      }}
  changed_when: false

- name: Require isolated ephemeral acceptance resources
  ansible.builtin.assert:
    that:
      - >-
        workbench_acceptance_profile_config.get('name', '')
        is match(
          '^'
          ~ workbench_acceptance_cleanup_config.get('managed_name_prefix', '')
          ~ '[a-z0-9-]+$'
        )
      - >-
        workbench_acceptance_profile_config.get('project', '')
        == workbench_acceptance_project_config.get('name', '')
      - >-
        workbench_acceptance_profile_config.get('profile', '')
        == workbench_acceptance_incus_profile_config.get('name', '')
      - >-
        workbench_acceptance_profile_config.get('instance_type', '')
        in ['container', 'virtual-machine']
      - workbench_acceptance_profile_config.get('image', '') is string
      - workbench_acceptance_profile_config.get('image', '') | trim | length > 0
      - workbench_acceptance_profile_config.get('image', '') is not search('\\s')
      - workbench_acceptance_profile_config.get('image', '') is match('^images:[0-9a-f]{64}$')
      - workbench_acceptance_profile_config.get('limits', {}).get('cpu', 0) | int > 0
      - >-
        workbench_acceptance_profile_config.get('limits', {}).get('memory', '')
        is match('^[1-9][0-9]*GiB$')
      - >-
        workbench_acceptance_profile_config.get('limits', {}).get('root_disk', '')
        is match('^[1-9][0-9]*GiB$')
      - workbench_acceptance_profile_config.get('ephemeral', none) is boolean
      - workbench_acceptance_profile_config.get('ephemeral', false) | bool
    fail_msg: >-
      Acceptance profile resources must stay inside the declared Incus
      project/profile and the managed-name namespace, and must be ephemeral.
    quiet: true
  changed_when: false

- name: Initialize exact acceptance instance names
  ansible.builtin.set_fact:
    workbench_acceptance_instance_names: []
  changed_when: false

- name: Resolve one Tiny or Application instance name
  ansible.builtin.set_fact:
    workbench_acceptance_instance_names:
      - "{{ workbench_acceptance_base_instance_name }}"
  changed_when: false
  when: workbench_acceptance_profile != 'heavy'

- name: Require structured Heavy acceptance resources
  ansible.builtin.assert:
    that:
      - workbench_acceptance_profile_config.get('container', none) is mapping
    fail_msg: "Heavy acceptance requires a structured container fixture."
    quiet: true
  changed_when: false
  when: workbench_acceptance_profile == 'heavy'

- name: Resolve structured Heavy acceptance resources
  ansible.builtin.set_fact:
    workbench_acceptance_container_config: >-
      {{ workbench_acceptance_profile_config.get('container', {}) }}
  changed_when: false
  when: workbench_acceptance_profile == 'heavy'

- name: Validate Heavy acceptance contract
  ansible.builtin.assert:
    that:
      - workbench_acceptance_profile_config.get('instance_count', 0) | int >= 2
      - workbench_acceptance_profile_config.get('instance_count', 0) | int <= 4
      - >-
        workbench_acceptance_profile_config.get('operator_user', '')
        is match('^[a-z_][a-z0-9_-]*$')
      - >-
        workbench_acceptance_profile_config.get('guest_user', '')
        is match('^[a-z_][a-z0-9_-]*$')
      - >-
        workbench_acceptance_container_config.get('base_image', '')
        is match('^[A-Za-z0-9._/:+-]+@sha256:[0-9a-f]{64}$')
      - >-
        workbench_acceptance_container_config.get('base_image', '')
        == 'docker.io/library/alpine@sha256:eafc1edb577d2e9b458664a15f23ea1c370214193226069eb22921169fc7e43f'
      - >-
        workbench_acceptance_container_config.get('image_repository', '')
        is match('^localhost/[a-z0-9][a-z0-9._/-]+$')
      - workbench_acceptance_container_config.get('expected_stdout', '') is string
      - workbench_acceptance_container_config.get('expected_stdout', '') | length > 0
      - >-
        workbench_acceptance_container_config.get('expected_stdout', '')
        is not search('[\\r\\n]')
      - >-
        workbench_acceptance.users
        | selectattr(
          'name',
          'equalto',
          workbench_acceptance_profile_config.get('operator_user', '')
        )
        | list | length == 1
    fail_msg: >-
      Heavy acceptance requires at least two guests, one declared developer,
      a dedicated guest user, and a digest-pinned rootless container fixture.
    quiet: true
  changed_when: false
  when: workbench_acceptance_profile == 'heavy'

- name: Resolve run-unique Heavy instance names
  ansible.builtin.set_fact:
    workbench_acceptance_instance_names: >-
      {{
        workbench_acceptance_instance_names
        + [
          workbench_acceptance_base_instance_name
          ~ '-' ~ ('%02d' | format(item | int))
        ]
      }}
  loop: >-
    {{
      range(
        1,
        (workbench_acceptance_profile_config.get('instance_count', 0) | int) + 1
      ) | list
    }}
  loop_control:
    label: "{{ item }}"
  changed_when: false
  when: workbench_acceptance_profile == 'heavy'

- name: Require structured Application acceptance resources
  ansible.builtin.assert:
    that:
      - workbench_acceptance_profile_config.get('repository', none) is mapping
    fail_msg: "Application acceptance requires a structured repository fixture."
    quiet: true
  changed_when: false
  when: workbench_acceptance_profile == 'application'

- name: Resolve structured Application acceptance resources
  ansible.builtin.set_fact:
    workbench_acceptance_repository_config: >-
      {{ workbench_acceptance_profile_config.get('repository', {}) }}
  changed_when: false
  when: workbench_acceptance_profile == 'application'

- name: Validate Application acceptance contract
  ansible.builtin.assert:
    that:
      - >-
        workbench_acceptance_profile_config.get('operator_user', '')
        is match('^[a-z_][a-z0-9_-]*$')
      - >-
        workbench_acceptance_repository_config.get('url', '')
        == 'https://github.com/lightning-it/ansible-collection-ubuntu.git'
      - >-
        workbench_acceptance_repository_config.get('commit', '')
        is match('^[0-9a-f]{40}$')
      - >-
        workbench_acceptance_profile_config.get('molecule_scenario', '')
        is match('^[a-z0-9][a-z0-9_-]+$')
      - >-
        workbench_acceptance.users
        | selectattr(
          'name',
          'equalto',
          workbench_acceptance_profile_config.get('operator_user', '')
        )
        | list | length == 1
    fail_msg: >-
      Application acceptance is fail-closed without the approved public
      repository, its exact commit, a focused Molecule scenario, and one
      declared Workbench developer.
    quiet: true
  changed_when: false
  when: workbench_acceptance_profile == 'application'

- name: Require every derived instance name in the cleanup namespace
  ansible.builtin.assert:
    that:
      - item | length <= 63
      - >-
        item is match(
          '^'
          ~ workbench_acceptance_cleanup_config.get('managed_name_prefix', '')
          ~ '[a-z0-9-]+$'
        )
    fail_msg: "A derived acceptance instance name is outside the cleanup namespace."
    quiet: true
  loop: "{{ workbench_acceptance_instance_names }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false

- name: Resolve acceptance operator and safe paths
  ansible.builtin.set_fact:
    workbench_acceptance_operator: >-
      {{ workbench_acceptance_profile_config.get('operator_user', '') }}
    workbench_acceptance_operator_home: >-
      {{
        (
          workbench_acceptance.users
          | selectattr(
            'name',
            'equalto',
            workbench_acceptance_profile_config.get('operator_user', '')
          )
          | map(attribute='home')
          | first
        ) | default('')
      }}
    workbench_acceptance_workspace: >-
      {{
        '/tmp/lit-workbench-acceptance/' ~ workbench_acceptance_run_id
        ~ '/' ~ workbench_acceptance_profile
      }}
    workbench_acceptance_artifacts: >-
      {{
        (
          workbench_acceptance.users
          | selectattr(
            'name',
            'equalto',
            workbench_acceptance_profile_config.get('operator_user', '')
          )
          | map(attribute='home')
          | first
        ) | default('')
        ~ '/artifacts/workbench-acceptance/' ~ workbench_acceptance_run_id
        ~ '/' ~ workbench_acceptance_profile
      }}
  changed_when: false
  when: workbench_acceptance_profile in ['heavy', 'application']

- name: Require bounded operator workspace and evidence paths
  ansible.builtin.assert:
    that:
      - workbench_acceptance_operator_home is match('^/home/[a-z_][a-z0-9_-]*$')
      - >-
        workbench_acceptance_workspace
        == '/tmp/lit-workbench-acceptance/' ~ workbench_acceptance_run_id
        ~ '/' ~ workbench_acceptance_profile
      - >-
        workbench_acceptance_artifacts
        == workbench_acceptance_operator_home
        ~ '/artifacts/workbench-acceptance/' ~ workbench_acceptance_run_id
        ~ '/' ~ workbench_acceptance_profile
    fail_msg: >-
      Acceptance operator paths must stay in the fixed temporary workspace and
      developer artifact namespaces.
    quiet: true
  changed_when: false
  when: workbench_acceptance_profile in ['heavy', 'application']
