---
- name: Require an explicit safe acceptance profile and run identifier
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - workbench_acceptance_profile is defined
      - workbench_acceptance_profile is string
      - workbench_acceptance_profile in ['tiny', 'heavy', 'application']
      - workbench_acceptance_run_id is defined
      - workbench_acceptance_run_id is string
      - workbench_acceptance_run_id is match('^[a-z0-9][a-z0-9-]{2,23}$')
      - workbench_acceptance is mapping
      - workbench_acceptance.incus.cleanup.managed_name_prefix is match('^[a-z0-9][a-z0-9-]+-$')
    fail_msg: >-
      Acceptance requires normal mode plus
      workbench_acceptance_profile=tiny|heavy|application and a lowercase,
      3-to-24-character workbench_acceptance_run_id.
    quiet: true
  changed_when: false

- name: Resolve requested acceptance profile
  ansible.builtin.set_fact:
    workbench_acceptance_profile_config: "{{ workbench_acceptance[workbench_acceptance_profile] }}"
    workbench_acceptance_base_instance_name: >-
      {{
        workbench_acceptance[workbench_acceptance_profile].name
        ~ '-' ~ workbench_acceptance_run_id
      }}
  changed_when: false

- name: Require isolated ephemeral acceptance resources
  ansible.builtin.assert:
    that:
      - workbench_acceptance_profile_config is mapping
      - >-
        workbench_acceptance_profile_config.name
        is match('^' ~ workbench_acceptance.incus.cleanup.managed_name_prefix ~ '[a-z0-9-]+$')
      - >-
        workbench_acceptance_profile_config.project
        == workbench_acceptance.incus.project.name
      - >-
        workbench_acceptance_profile_config.profile
        == workbench_acceptance.incus.profile.name
      - workbench_acceptance_profile_config.instance_type in ['container', 'virtual-machine']
      - workbench_acceptance_profile_config.image is string
      - workbench_acceptance_profile_config.image | trim | length > 0
      - workbench_acceptance_profile_config.image is not search('\\s')
      - workbench_acceptance_profile_config.image is match('^images:[0-9a-f]{64}$')
      - workbench_acceptance_profile_config.limits is mapping
      - workbench_acceptance_profile_config.limits.cpu | int > 0
      - workbench_acceptance_profile_config.limits.memory is match('^[1-9][0-9]*GiB$')
      - workbench_acceptance_profile_config.limits.root_disk is match('^[1-9][0-9]*GiB$')
      - workbench_acceptance_profile_config.ephemeral | default(false) is boolean
      - workbench_acceptance_profile_config.ephemeral | bool
    fail_msg: >-
      Acceptance profile resources must stay inside the declared Incus
      project/profile and the managed-name namespace, and must be ephemeral.
    quiet: true
  changed_when: false

- name: Initialize exact acceptance instance names
  ansible.builtin.set_fact:
    workbench_acceptance_instance_names: []
  changed_when: false

- name: Resolve one Tiny or Application instance name
  ansible.builtin.set_fact:
    workbench_acceptance_instance_names:
      - "{{ workbench_acceptance_base_instance_name }}"
  changed_when: false
  when: workbench_acceptance_profile != 'heavy'

- name: Validate Heavy acceptance contract
  ansible.builtin.assert:
    that:
      - workbench_acceptance_profile_config.instance_count | default(0) | int >= 2
      - workbench_acceptance_profile_config.instance_count | int <= 4
      - workbench_acceptance_profile_config.operator_user | default('') is match('^[a-z_][a-z0-9_-]*$')
      - workbench_acceptance_profile_config.guest_user | default('') is match('^[a-z_][a-z0-9_-]*$')
      - workbench_acceptance_profile_config.container | default({}) is mapping
      - >-
        workbench_acceptance_profile_config.container.base_image | default('')
        is match('^[A-Za-z0-9._/:+-]+@sha256:[0-9a-f]{64}$')
      - >-
        workbench_acceptance_profile_config.container.base_image
        == 'docker.io/library/alpine@sha256:eafc1edb577d2e9b458664a15f23ea1c370214193226069eb22921169fc7e43f'
      - >-
        workbench_acceptance_profile_config.container.image_repository | default('')
        is match('^localhost/[a-z0-9][a-z0-9._/-]+$')
      - workbench_acceptance_profile_config.container.expected_stdout | default('') is string
      - workbench_acceptance_profile_config.container.expected_stdout | length > 0
      - workbench_acceptance_profile_config.container.expected_stdout is not search('[\\r\\n]')
      - >-
        workbench_acceptance.users
        | selectattr('name', 'equalto', workbench_acceptance_profile_config.operator_user)
        | list | length == 1
    fail_msg: >-
      Heavy acceptance requires at least two guests, one declared developer,
      a dedicated guest user, and a digest-pinned rootless container fixture.
    quiet: true
  changed_when: false
  when: workbench_acceptance_profile == 'heavy'

- name: Resolve run-unique Heavy instance names
  ansible.builtin.set_fact:
    workbench_acceptance_instance_names: >-
      {{
        workbench_acceptance_instance_names
        + [
          workbench_acceptance_base_instance_name
          ~ '-' ~ ('%02d' | format(item | int))
        ]
      }}
  loop: >-
    {{
      range(
        1,
        (workbench_acceptance_profile_config.instance_count | default(0) | int) + 1
      ) | list
    }}
  loop_control:
    label: "{{ item }}"
  changed_when: false
  when: workbench_acceptance_profile == 'heavy'

- name: Validate Application acceptance contract
  ansible.builtin.assert:
    that:
      - workbench_acceptance_profile_config.operator_user | default('') is match('^[a-z_][a-z0-9_-]*$')
      - workbench_acceptance_profile_config.repository | default({}) is mapping
      - >-
        workbench_acceptance_profile_config.repository.url | default('')
        == 'https://github.com/lightning-it/ansible-collection-ubuntu.git'
      - >-
        workbench_acceptance_profile_config.repository.commit | default('')
        is match('^[0-9a-f]{40}$')
      - >-
        workbench_acceptance_profile_config.molecule_scenario | default('')
        is match('^[a-z0-9][a-z0-9_-]+$')
      - >-
        workbench_acceptance.users
        | selectattr('name', 'equalto', workbench_acceptance_profile_config.operator_user)
        | list | length == 1
    fail_msg: >-
      Application acceptance is fail-closed without the approved public
      repository, its exact commit, a focused Molecule scenario, and one
      declared Workbench developer.
    quiet: true
  changed_when: false
  when: workbench_acceptance_profile == 'application'

- name: Require every derived instance name in the cleanup namespace
  ansible.builtin.assert:
    that:
      - item | length <= 63
      - >-
        item is match(
          '^' ~ workbench_acceptance.incus.cleanup.managed_name_prefix ~ '[a-z0-9-]+$'
        )
    fail_msg: "A derived acceptance instance name is outside the cleanup namespace."
    quiet: true
  loop: "{{ workbench_acceptance_instance_names }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false

- name: Resolve acceptance operator and safe paths
  ansible.builtin.set_fact:
    workbench_acceptance_operator: >-
      {{ workbench_acceptance_profile_config.operator_user | default('') }}
    workbench_acceptance_operator_home: >-
      {{
        (
          workbench_acceptance.users
          | selectattr(
            'name',
            'equalto',
            workbench_acceptance_profile_config.operator_user | default('')
          )
          | map(attribute='home')
          | first
        ) | default('')
      }}
    workbench_acceptance_workspace: >-
      {{
        '/tmp/lit-workbench-acceptance/' ~ workbench_acceptance_run_id
        ~ '/' ~ workbench_acceptance_profile
      }}
    workbench_acceptance_artifacts: >-
      {{
        (
          workbench_acceptance.users
          | selectattr(
            'name',
            'equalto',
            workbench_acceptance_profile_config.operator_user | default('')
          )
          | map(attribute='home')
          | first
        ) | default('')
        ~ '/artifacts/workbench-acceptance/' ~ workbench_acceptance_run_id
        ~ '/' ~ workbench_acceptance_profile
      }}
  changed_when: false
  when: workbench_acceptance_profile in ['heavy', 'application']

- name: Require bounded operator workspace and evidence paths
  ansible.builtin.assert:
    that:
      - workbench_acceptance_operator_home is match('^/home/[a-z_][a-z0-9_-]*$')
      - >-
        workbench_acceptance_workspace
        == '/tmp/lit-workbench-acceptance/' ~ workbench_acceptance_run_id
        ~ '/' ~ workbench_acceptance_profile
      - >-
        workbench_acceptance_artifacts
        == workbench_acceptance_operator_home
        ~ '/artifacts/workbench-acceptance/' ~ workbench_acceptance_run_id
        ~ '/' ~ workbench_acceptance_profile
    fail_msg: >-
      Acceptance operator paths must stay in the fixed temporary workspace and
      developer artifact namespaces.
    quiet: true
  changed_when: false
  when: workbench_acceptance_profile in ['heavy', 'application']
