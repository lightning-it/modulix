---
ansible-navigator:
  ansible-runner:
    artifact-dir: /runner/project/.ansible-runner
    rotate-artifacts-count: 10
  execution-environment:
    enabled: true
    container-engine: podman
    # Default image. Override at runtime with:
    # ANSIBLE_TOOLBOX_NAV_EE_IMAGE=<image:tag>
    image: quay.io/l-it/ee-wunder-ansible-ubi9:v1.23.2
    pull:
      policy: missing
    container-options:
      # Use host networking so EE sessions can reach services bound on the local host
      # (e.g. Vault on wunderbox02 at 10.34.71.113:8200).
      - "--network=host"
    environment-variables:
      pass:
        - ANSIBLE_VAULT_PASSWORD_FILE
        - ANSIBLE_REMOTE_TEMP
        - VAULT_ADDR
        - VAULT_SKIP_VERIFY
        - VAULT_TOKEN
      set:
        ANSIBLE_CONFIG: /runner/project/ansible.cfg
        ANSIBLE_LOCAL_TEMP: /tmp/.ansible/tmp
        ANSIBLE_COLLECTIONS_PATH: "/runner/project/collections-dev:/opt/modulix/ansible/collections:/runner/project/collections:/usr/share/ansible/collections:/usr/share/automation-controller/collections:/runner/collections"
