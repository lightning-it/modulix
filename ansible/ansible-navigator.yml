---
ansible-navigator:
  ansible-runner:
    artifact-dir: /tmp/.ansible-runner
    rotate-artifacts-count: 1
  execution-environment:
    enabled: true
    container-engine: podman
    # Default image. Override at runtime with:
    # ANSIBLE_TOOLBOX_NAV_EE_IMAGE=<image:tag>
    image: quay.io/l-it/ee-wunder-ansible-ubi9:v1.23.9
    pull:
      policy: missing
    container-options:
      # Use host networking so EE sessions can reach services bound on the local host
      # (e.g. Vault on wunderbox02 at 10.34.71.113:8200).
      - "--network=host"
    environment-variables:
      pass:
        - ANSIBLE_VAULT_PASSWORD_FILE
        - ANSIBLE_REMOTE_TEMP
        - ANSIBLE_NOCOLOR
        - ANSIBLE_DISPLAY_ARGS_TO_STDOUT
        - ANSIBLE_STDOUT_CALLBACK
        - ANSIBLE_CALLBACK_PLUGINS
        - ANSIBLE_COLLECTIONS_SCAN_SYS_PATH
        - LIT_GOVERNED_ACTION_ID
        - LIT_GOVERNED_EXECUTION_ID
        - LIT_GOVERNED_SAFE_TASKS
        - VAULT_ADDR
        - VAULT_SKIP_VERIFY
        - VAULT_TOKEN
      set:
        ANSIBLE_CONFIG: /runner/project/ansible.cfg
        ANSIBLE_LOCAL_TEMP: /tmp/.ansible/tmp
        ANSIBLE_COLLECTIONS_PATH: "/usr/share/ansible/collections:/usr/share/automation-controller/collections"
        ANSIBLE_COLLECTIONS_SCAN_SYS_PATH: "False"
  mode: stdout
  playbook-artifact:
    enable: false
