---
- name: Validate Incus profile definition
  ansible.builtin.assert:
    that:
      - incus_profile_item.name | default('') | trim | length > 0
      - incus_profile_item.project | default('') | trim | length > 0
      - incus_profile_item.config | default({}) is mapping
      - incus_profile_item.devices | default({}) is mapping
    fail_msg: "Each Incus profile needs a name, project, config mapping, and devices mapping."
    quiet: true

- name: Read current Incus profile
  ansible.builtin.command:
    argv:
      - incus
      - profile
      - show
      - "{{ incus_profile_item.name }}"
      - --project
      - "{{ incus_profile_item.project }}"
      - --format
      - json
  register: incus_profile_current_result
  changed_when: false
  failed_when: incus_profile_current_result.rc not in [0, 1]
  check_mode: false

- name: Create missing Incus profile
  ansible.builtin.command:
    argv:
      - incus
      - profile
      - create
      - "{{ incus_profile_item.name }}"
      - --project
      - "{{ incus_profile_item.project }}"
  when:
    - not ansible_check_mode
    - incus_profile_current_result.rc == 1
  changed_when: true

- name: Resolve desired and current Incus profile payloads
  ansible.builtin.set_fact:
    incus_profile_desired_payload:
      config: "{{ incus_profile_item.config | default({}) }}"
      description: "{{ incus_profile_item.description | default('') }}"
      devices: "{{ incus_profile_item.devices | default({}) }}"
    incus_profile_current_payload: >-
      {{
        (incus_profile_current_result.stdout | from_json)
        if incus_profile_current_result.rc == 0
        else {}
      }}
  changed_when: false

- name: Apply changed Incus profile payload
  ansible.builtin.command:
    argv:
      - incus
      - profile
      - edit
      - "{{ incus_profile_item.name }}"
      - --project
      - "{{ incus_profile_item.project }}"
    stdin: "{{ incus_profile_desired_payload | to_nice_json }}"
    stdin_add_newline: true
  when:
    - not ansible_check_mode
    - >-
      incus_profile_current_result.rc == 1
      or incus_profile_current_payload.config | default({}) != incus_profile_desired_payload.config
      or incus_profile_current_payload.description | default('') != incus_profile_desired_payload.description
      or incus_profile_current_payload.devices | default({}) != incus_profile_desired_payload.devices
  changed_when: true
...
