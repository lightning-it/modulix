---
name: RPM SRPM CI

'on':
  workflow_dispatch:
    inputs:
      version:
        description: RPM version override (default uses tag or repository state)
        required: false
        default: ""
      release:
        description: RPM release number
        required: false
        default: "1"
      build_script:
        description: Script path used to build SRPM
        required: false
        default: "packaging/rpm/build-srpm.sh"
      spec_path:
        description: Spec file path (passed to build script)
        required: false
        default: "packaging/rpm/modulix-automation-runtime.spec"
      output_dir:
        description: SRPM output directory
        required: false
        default: "packaging/rpm/dist"
      srpm_glob:
        description: Glob used to pick SRPM artifact from output_dir
        required: false
        default: "*.src.rpm"
      artifact_prefix:
        description: Uploaded artifact name prefix
        required: false
        default: "srpm"
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "packaging/rpm/**"
      - ".copr/Makefile"
      - ".github/workflows/rpm-srpm-ci.yml"

permissions:
  contents: read

jobs:
  build-srpm:
    outputs:
      artifact-name: ${{ steps.settings.outputs.artifact-name }}
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build tooling
        run: dnf -y install git rpm-build gzip

      - name: Refresh checkout with git metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve RPM settings
        id: settings
        shell: bash
        run: |
          set -euo pipefail

          version=""
          input_version="${{ github.event.inputs.version || '' }}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${input_version}" ]]; then
            version="${input_version}"
          else
            if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              version="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              version="${version#v}"
            fi
          fi
          if [[ -z "${version}" ]]; then
            version="0.1.0"
          fi
          version="${version//-/.}"

          release_input="${{ github.event.inputs.release || '1' }}"
          if [[ -z "${release_input}" ]]; then
            release_input="1"
          fi

          build_script_input="${{ github.event.inputs.build_script || 'packaging/rpm/build-srpm.sh' }}"
          spec_path_input="${{ github.event.inputs.spec_path || 'packaging/rpm/modulix-automation-runtime.spec' }}"
          output_dir_input="${{ github.event.inputs.output_dir || 'packaging/rpm/dist' }}"
          srpm_glob_input="${{ github.event.inputs.srpm_glob || '*.src.rpm' }}"
          artifact_prefix_input="${{ github.event.inputs.artifact_prefix || 'srpm' }}"
          artifact_name="${artifact_prefix_input}-${GITHUB_REPOSITORY##*/}-${version}-${release_input}"

          echo "RPM_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "RPM_RELEASE=${release_input}" >> "${GITHUB_ENV}"
          echo "RPM_BUILD_SCRIPT=${build_script_input}" >> "${GITHUB_ENV}"
          echo "RPM_SPEC_PATH=${spec_path_input}" >> "${GITHUB_ENV}"
          echo "RPM_OUTPUT_DIR=${output_dir_input}" >> "${GITHUB_ENV}"
          echo "RPM_SRPM_GLOB=${srpm_glob_input}" >> "${GITHUB_ENV}"
          echo "RPM_ARTIFACT_PREFIX=${artifact_prefix_input}" >> "${GITHUB_ENV}"
          echo "RPM_ARTIFACT_NAME=${artifact_name}" >> "${GITHUB_ENV}"
          echo "artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: Build source RPM
        shell: bash
        run: |
          set -euo pipefail
          build_script="${RPM_BUILD_SCRIPT}"
          if [[ "${build_script}" != /* ]]; then
            build_script="./${build_script#./}"
          fi
          if [[ ! -f "${build_script}" ]]; then
            echo "Build script not found: ${build_script}" >&2
            exit 1
          fi
          if [[ ! -x "${build_script}" ]]; then
            chmod +x "${build_script}"
          fi
          "${build_script}" \
            --version "${RPM_VERSION}" \
            --release "${RPM_RELEASE}" \
            --spec "${RPM_SPEC_PATH}" \
            --output-dir "${RPM_OUTPUT_DIR}"

      - name: Resolve SRPM artifact path
        shell: bash
        run: |
          set -euo pipefail
          srpm="$(find "${RPM_OUTPUT_DIR}" -maxdepth 1 -type f -name "${RPM_SRPM_GLOB}" | sort | tail -n 1)"
          if [[ -z "${srpm}" ]]; then
            echo "No SRPM generated in ${RPM_OUTPUT_DIR} matching ${RPM_SRPM_GLOB}." >&2
            exit 1
          fi
          echo "SRPM_PATH=${srpm}" >> "${GITHUB_ENV}"
          echo "SRPM_FILE=$(basename "${srpm}")" >> "${GITHUB_ENV}"

      - name: Verify declared SRPM license
        shell: bash
        run: |
          set -euo pipefail
          declared_license="$(rpm -qp --queryformat '%{LICENSE}\n' "${SRPM_PATH}")"
          test "${declared_license}" = "MIT"
          license_report="${RPM_OUTPUT_DIR}/license-report.json"
          printf '%s\n' \
            '{' \
            '  "schema_version": 1,' \
            '  "artifact": "'"${SRPM_FILE}"'",' \
            '  "version": "'"${RPM_VERSION}"'",' \
            '  "release": "'"${RPM_RELEASE}"'",' \
            '  "declared_license": "'"${declared_license}"'",' \
            '  "policy": "repository SPDX license must match SRPM license"' \
            '}' >"${license_report}"
          echo "RPM_LICENSE_REPORT=${license_report}" >>"${GITHUB_ENV}"

      - name: Upload SRPM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ${{ env.RPM_ARTIFACT_NAME }}
          path: |
            ${{ env.SRPM_PATH }}
            ${{ env.RPM_LICENSE_REPORT }}
          if-no-files-found: error

  supply-chain-evidence:
    name: SRPM supply-chain evidence
    needs: build-srpm
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:45
    permissions:
      contents: read
    steps:
      - name: Install SRPM extraction tooling
        run: dnf -y install cpio python3 rpm

      - name: Download exact SRPM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: ${{ needs.build-srpm.outputs.artifact-name }}
          path: dist

      - name: Resolve exact SRPM
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t srpms < <(find dist -maxdepth 1 -type f -name '*.src.rpm' -print)
          test "${#srpms[@]}" -eq 1
          printf 'SRPM_PATH=%s\n' "${srpms[0]}" >>"${GITHUB_ENV}"
          mkdir -p evidence
          (
            cd dist
            sha256sum "$(basename "${srpms[0]}")" >../evidence/SHA256SUMS
          )
          test -s dist/license-report.json
          cp dist/license-report.json evidence/license-report.json

      - name: Extract exact SRPM for component inventory
        shell: bash
        run: |
          set -euo pipefail
          rpm2cpio "${SRPM_PATH}" >"${RUNNER_TEMP}/candidate.cpio"
          mapfile -t members < <(cpio --list <"${RUNNER_TEMP}/candidate.cpio")
          test "${#members[@]}" -gt 0
          for member in "${members[@]}"; do
            case "${member}" in
              /*|../*|*/../*|*/..)
                echo "Unsafe SRPM archive member: ${member}" >&2
                exit 1
                ;;
            esac
          done
          mkdir -p candidate
          (
            cd candidate
            cpio --extract --make-directories --no-absolute-filenames \
              <"${RUNNER_TEMP}/candidate.cpio"
          )

      - name: Generate exact-SRPM CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          path: candidate
          format: cyclonedx-json
          output-file: evidence/sbom.cdx.json
          upload-artifact: false

      - name: Bind SBOM root component to exact SRPM identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path("evidence")
          report = json.loads((evidence / "license-report.json").read_text())
          checksum_line = (evidence / "SHA256SUMS").read_text().strip()
          digest, artifact = checksum_line.split(maxsplit=1)
          if artifact != report["artifact"]:
              raise SystemExit("checksum and license evidence identify different artifacts")
          if report["declared_license"] != "MIT":
              raise SystemExit("SRPM license is not the repository SPDX license")
          if len(digest) != 64 or any(ch not in "0123456789abcdef" for ch in digest):
              raise SystemExit("invalid SRPM SHA-256 evidence")

          sbom_path = evidence / "sbom.cdx.json"
          sbom = json.loads(sbom_path.read_text())
          component = {
              "type": "application",
              "bom-ref": f"urn:sha256:{digest}",
              "name": "modulix-automation-runtime",
              "version": f"{report['version']}-{report['release']}",
              "purl": (
                  "pkg:rpm/modulix-automation-runtime@"
                  f"{report['version']}-{report['release']}?arch=src"
              ),
              "hashes": [{"alg": "SHA-256", "content": digest}],
              "licenses": [{"license": {"id": "MIT"}}],
              "properties": [
                  {"name": "lightning-it:artifact", "value": artifact},
                  {
                      "name": "lightning-it:source-sha",
                      "value": os.environ["GITHUB_SHA"],
                  },
              ],
          }
          sbom.setdefault("metadata", {})["component"] = component
          components = sbom.setdefault("components", [])
          components[:] = [
              existing
              for existing in components
              if existing.get("bom-ref") != component["bom-ref"]
          ]
          components.insert(0, component)
          if not components or components[0]["hashes"][0]["content"] != digest:
              raise SystemExit("candidate-bound SBOM root component is missing")
          sbom_path.write_text(json.dumps(sbom, indent=2) + "\n")
          PY

      - name: Scan exact-SRPM SBOM for high-severity vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7
        with:
          sbom: evidence/sbom.cdx.json
          output-format: json
          output-file: evidence/vulnerability-report.json
          fail-build: true
          severity-cutoff: high

      - name: Upload immutable SRPM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: evidence-${{ needs.build-srpm.outputs.artifact-name }}
          path: evidence/
          if-no-files-found: error

  attest-release:
    name: Attest tagged SRPM
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-srpm, supply-chain-evidence]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download exact SRPM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: ${{ needs.build-srpm.outputs.artifact-name }}
          path: dist

      - name: Download exact SRPM evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: evidence-${{ needs.build-srpm.outputs.artifact-name }}
          path: evidence

      - name: Verify evidence checksum binds the exact SRPM
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check ../evidence/SHA256SUMS)

      - name: Attest exact SRPM build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: dist/*.src.rpm

      - name: Attest exact SRPM SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d  # v4
        with:
          subject-path: dist/*.src.rpm
          sbom-path: evidence/sbom.cdx.json

  publish-copr:
    name: Publish attested SRPM to COPR
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-srpm, supply-chain-evidence, attest-release]
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:45
    permissions:
      contents: read
    steps:
      - name: Download attested SRPM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: ${{ needs.build-srpm.outputs.artifact-name }}
          path: dist

      - name: Resolve attested SRPM
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t srpms < <(find dist -maxdepth 1 -type f -name '*.src.rpm' -print)
          test "${#srpms[@]}" -eq 1
          printf 'SRPM_PATH=%s\n' "${srpms[0]}" >>"${GITHUB_ENV}"

      - name: Publish SRPM to COPR
        shell: bash
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG || '' }}
          COPR_OWNER_VAR: ${{ vars.COPR_OWNER || '' }}
          COPR_PROJECT_VAR: ${{ vars.COPR_PROJECT || '' }}
        run: |
          set -euo pipefail
          if [[ -z "${COPR_CONFIG}" ]]; then
            echo "Missing COPR_CONFIG secret with copr-cli credentials." >&2
            exit 1
          fi

          copr_owner="${COPR_OWNER_VAR}"
          if [[ -z "${copr_owner}" ]]; then
            echo "Missing COPR owner. Set repository variable COPR_OWNER." >&2
            exit 1
          fi

          copr_project="${COPR_PROJECT_VAR}"
          if [[ -z "${copr_project}" ]]; then
            copr_project="${GITHUB_REPOSITORY##*/}"
          fi

          dnf -y install copr-cli >/dev/null
          mkdir -p "${HOME}/.config"
          umask 077
          printf '%s\n' "${COPR_CONFIG}" > "${HOME}/.config/copr"

          copr-cli build "${copr_owner}/${copr_project}" "${SRPM_PATH}"
