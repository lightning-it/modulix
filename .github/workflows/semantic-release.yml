# yamllint disable rule:truthy
---
name: Semantic Release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Setup pinned lint runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.14"

      - name: yamllint
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            --require-hashes \
            --requirement .github/requirements/semantic-release-lint.lock
          yamllint .github

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git user
        run: |
          git config user.name "lightning-it-release-automation[bot]"
          git config user.email "307565056+lightning-it-release-automation[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Mint release automation App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve release automation App bot identity
        id: release-bot
        env:
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bot_json="$(gh api "users/${APP_SLUG}%5Bbot%5D" 2>/dev/null || printf '{}')"
          login="$(jq -r '.login // ""' <<<"$bot_json")"
          bot_id="$(jq -r '.id // ""' <<<"$bot_json")"
          if [ "$login" != "${APP_SLUG}[bot]" ] || ! [[ "$bot_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to resolve the release automation App bot identity."
            exit 1
          fi
          echo "login=$login" >>"$GITHUB_OUTPUT"
          echo "email=${bot_id}+${login}@users.noreply.github.com" >>"$GITHUB_OUTPUT"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.release-app.outputs.token }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          set -euo pipefail
          auth_header="$(
            printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n'
          )"
          echo "::add-mask::${auth_header}"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic ${auth_header}"
          npx semantic-release

      - name: Generate release evidence
        env:
          GITHUB_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          set -euo pipefail
          auth_header="$(
            printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n'
          )"
          echo "::add-mask::${auth_header}"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic ${auth_header}"
          git fetch --tags --force
          tag="$(git describe --tags --abbrev=0)"
          version="${tag#v}"
          TESTED_MATRIX="pre-commit,playbook-syntax,rpm-srpm,release-validation" \
          PASSED_JOBS="Release" \
          BUILT_ARTIFACTS="modulix-automation-runtime-srpm" \
          PUBLISHED_ARTIFACTS="github-release:${tag}" \
          RELEASE_TAG="$tag" \
          RELEASE_VERSION="$version" \
          CHANGELOG_URL="https://github.com/${{ github.repository }}/releases/tag/${tag}" \
          python3 scripts/generate-release-evidence.py

      - name: Attach release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0)"
          gh release upload "$tag" \
            dist/release-evidence.json \
            dist/release-evidence.md \
            --clobber

      - name: Upload release evidence artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-evidence
          path: |
            dist/release-evidence.json
            dist/release-evidence.md
          if-no-files-found: error

  release-dry-run:
    name: Release Dry Run
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(
            printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n'
          )"
          echo "::add-mask::${auth_header}"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic ${auth_header}"
          npx semantic-release --dry-run --no-ci
