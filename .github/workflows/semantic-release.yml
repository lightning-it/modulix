# yamllint disable rule:truthy
---
name: Semantic Release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: yamllint
        run: |
          python -m pip install --no-cache-dir yamllint
          yamllint .github

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git user
        run: |
          git config user.name "litreleasebot"
          git config user.email "litreleasebot@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.LITRELEASEBOT_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.LITRELEASEBOT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          public_remote="https://github.com/${GITHUB_REPOSITORY}.git"
          trap 'git remote set-url origin "$public_remote"' EXIT
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npx semantic-release

      - name: Generate release evidence
        run: |
          set -euo pipefail
          git fetch --tags --force
          tag="$(git describe --tags --abbrev=0)"
          version="${tag#v}"
          TESTED_MATRIX="pre-commit,playbook-syntax,rpm-srpm,release-validation" \
          PASSED_JOBS="Release" \
          BUILT_ARTIFACTS="modulix-automation-runtime-srpm" \
          PUBLISHED_ARTIFACTS="github-release:${tag}" \
          RELEASE_TAG="$tag" \
          RELEASE_VERSION="$version" \
          CHANGELOG_URL="https://github.com/${{ github.repository }}/releases/tag/${tag}" \
          python3 scripts/generate-release-evidence.py

      - name: Attach release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0)"
          gh release upload "$tag" \
            dist/release-evidence.json \
            dist/release-evidence.md \
            --clobber

      - name: Upload release evidence artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-evidence
          path: |
            dist/release-evidence.json
            dist/release-evidence.md
          if-no-files-found: error

  release-dry-run:
    name: Release Dry Run
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: npx semantic-release --dry-run --no-ci
