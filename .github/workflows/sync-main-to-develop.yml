# Managed by lightning-it/shared-assets-lit.
# Keep this repository-local workflow aligned with the protected release policy.
# yamllint disable rule:truthy
---
name: Sync main back to develop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-main-to-develop
  cancel-in-progress: false

jobs:
  backmerge:
    if: github.repository_owner == 'lightning-it'
    runs-on: ubuntu-latest
    environment: shared-assets-sync
    timeout-minutes: 10

    steps:
      - name: Mint release automation App token
        id: release-app
        if: github.repository != 'lightning-it/.github'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Mint protected workflow-source App token
        id: workflow-source-app
        if: github.repository == 'lightning-it/.github'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SHARED_ASSETS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SHARED_ASSETS_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Validate ancestry bot token
        id: ancestry-bot
        env:
          APP_SLUG: >-
            ${{ steps.release-app.outputs.app-slug ||
            steps.workflow-source-app.outputs.app-slug }}
          GH_TOKEN: >-
            ${{ steps.release-app.outputs.token ||
            steps.workflow-source-app.outputs.token }}
          APP_INSTALLATION_ID: >-
            ${{ steps.release-app.outputs.installation-id ||
            steps.workflow-source-app.outputs.installation-id }}
          EXPECTED_APP_SLUG: >-
            ${{ github.repository == 'lightning-it/.github' &&
            'lightning-it-shared-assets-sync' ||
            'lightning-it-release-automation' }}
          EXPECTED_BOT_LOGIN: >-
            ${{ github.repository == 'lightning-it/.github' &&
            'lightning-it-shared-assets-sync[bot]' ||
            'lightning-it-release-automation[bot]' }}
          EXPECTED_BOT_PATH: >-
            ${{ github.repository == 'lightning-it/.github' &&
            'lightning-it-shared-assets-sync%5Bbot%5D' ||
            'lightning-it-release-automation%5Bbot%5D' }}
          EXPECTED_INSTALLATION_ID: >-
            ${{ github.repository == 'lightning-it/.github' &&
            '147922640' || '148019054' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "${APP_SLUG}" = "${EXPECTED_APP_SLUG}"
          test "${APP_INSTALLATION_ID}" = "${EXPECTED_INSTALLATION_ID}"
          installations="$(
            gh api --paginate --slurp \
              "installation/repositories?per_page=100"
          )"
          # GH_TOKEN is the downscoped token minted above. This endpoint returns
          # repositories visible to that token, not the App installation's full
          # organization-wide repository selection.
          # shellcheck disable=SC2016  # jq variables must not expand in the shell.
          repository_filter='
            [.[].repositories[]?] as $repositories
            | (($repositories | length) == 1
               and $repositories[0].full_name == $repository)
          '
          jq -e --arg repository "${REPOSITORY}" \
            "${repository_filter}" \
            <<<"${installations}" >/dev/null
          login="$(gh api "users/${EXPECTED_BOT_PATH}" --jq .login)"
          bot_id="$(gh api "users/${EXPECTED_BOT_PATH}" --jq .id)"
          if [ "${login}" != "${EXPECTED_BOT_LOGIN}" ] || ! [[ "${bot_id}" =~ ^[0-9]+$ ]]; then
            echo "::error::Ancestry App identity mismatch: expected ${EXPECTED_BOT_LOGIN}."
            exit 1
          fi
          {
            echo "email=${bot_id}+${login}@users.noreply.github.com"
            echo "login=${login}"
            echo "pr_author=app/${APP_SLUG}"
          } >>"${GITHUB_OUTPUT}"

      - name: Create reviewable ancestry backmerge
        id: exact-review-target
        env:
          BOT_EMAIL: ${{ steps.ancestry-bot.outputs.email }}
          BOT_LOGIN: ${{ steps.ancestry-bot.outputs.login }}
          EXPECTED_PR_AUTHOR: ${{ steps.ancestry-bot.outputs.pr_author }}
          GH_TOKEN: ${{ steps.release-app.outputs.token || steps.workflow-source-app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          token_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${token_header}"

          git init --quiet repository
          cd repository
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${token_header}" \
            fetch --quiet --no-tags origin main develop
          main_short="$(git rev-parse --short=12 origin/main)"
          develop_short="$(git rev-parse --short=12 origin/develop)"
          main_sha="$(git rev-parse origin/main)"
          develop_sha="$(git rev-parse origin/develop)"
          evidence_path='.lit/main-ancestry.json'
          repository_name="${REPOSITORY#*/}"
          repository_branch_name="${repository_name#.}"
          if ! [[ "${repository_branch_name}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Unsupported repository name for backmerge branch: ${repository_name}"
            exit 1
          fi
          branch="backmerge/${repository_branch_name}-${main_short}-${develop_short}-main"
          title="chore(governance): record main ancestry before ${main_short}"
          git config user.name "${BOT_LOGIN}"
          git config user.email "${BOT_EMAIL}"
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo 'develop already contains the current main ancestry.'
            exit 0
          fi

          git switch --create "${branch}" origin/develop
          # Bind the merge object to an existing Git timestamp so retries
          # reproduce the exact same commit and never require a force-update.
          merge_date="$(git show -s --format=%cI origin/main)"
          git merge --no-ff --no-commit --strategy=ours origin/main
          mkdir -p "${evidence_path%/*}"
          jq --null-input --sort-keys \
            --arg repository "${REPOSITORY}" \
            --arg main_sha "${main_sha}" \
            --arg develop_parent_sha "${develop_sha}" \
            '{
              schema_version: 1,
              repository: $repository,
              main_sha: $main_sha,
              develop_parent_sha: $develop_parent_sha,
              purpose: "Bind the reviewed main ancestry backmerge."
            }' >"${evidence_path}"
          git add -- "${evidence_path}"
          GIT_AUTHOR_DATE="${merge_date}" GIT_COMMITTER_DATE="${merge_date}" \
            git commit \
            --message 'merge: preserve develop tree and main ancestry'
          git merge-base --is-ancestor origin/main HEAD
          git merge-base --is-ancestor origin/develop HEAD
          [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]
          test "$(git diff --name-only origin/develop HEAD --)" = "${evidence_path}"
          git show "HEAD:${evidence_path}" | jq -e \
            --arg repository "${REPOSITORY}" \
            --arg main_sha "${main_sha}" \
            --arg develop_parent_sha "${develop_sha}" '
              .schema_version == 1
              and .repository == $repository
              and .main_sha == $main_sha
              and .develop_parent_sha == $develop_parent_sha
              and .purpose == "Bind the reviewed main ancestry backmerge."
            ' >/dev/null
          create_backmerge_branch() {
            local branch_name="$1"
            local desired_head="$2"
            local remote_head

            if git \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${token_header}" \
              push \
              --force-with-lease="refs/heads/${branch_name}:" \
              origin \
              "${desired_head}:refs/heads/${branch_name}"; then
              echo 'Created exact backmerge branch with a create-only lease.'
              return 0
            fi

            if ! remote_head="$(
              git \
                -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${token_header}" \
                ls-remote --exit-code --heads \
                origin "refs/heads/${branch_name}" \
                | awk '{print $1}'
            )"; then
              echo "::error::Unable to create or verify the backmerge branch."
              return 1
            fi
            if [ "${remote_head}" != "${desired_head}" ]; then
              echo "::error::Backmerge branch collision; refusing to overwrite existing history."
              return 1
            fi
            echo 'Exact backmerge branch already exists; no update required.'
          }

          local_head="$(git rev-parse HEAD)"
          create_backmerge_branch "${branch}" "${local_head}"

          pr_number="$(
            gh api --method GET "repos/${REPOSITORY}/pulls" \
              -f state=open \
              -f base=develop \
              -f "head=lightning-it:${branch}" \
              --jq '.[0].number // empty'
          )"
          if [ -z "${pr_number}" ]; then
            pr_url="$(
              gh pr create \
                --repo "${REPOSITORY}" \
                --base develop \
                --head "${branch}" \
                --title "${title}" \
                --body 'Automated ancestry backmerge with a deterministic, reviewable main binding.'
            )"
            pr_number="${pr_url##*/}"
          fi

          pr_details="$(gh pr view "${pr_number}" \
            --repo "${REPOSITORY}" \
            --json author,baseRefName,baseRefOid,headRefName,headRefOid,headRepositoryOwner,isDraft,title)"
          # shellcheck disable=SC2016  # jq variables must not expand in the shell.
          pr_filter='
            .author.login == $expected_author
            and .baseRefName == "develop"
            and .headRefName == $branch
            and .headRefOid == $expected_head
            and .headRepositoryOwner.login == "lightning-it"
            and .isDraft == false
            and .title == $title
          '
          jq -e \
              --arg branch "${branch}" \
              --arg expected_head "${local_head}" \
              --arg expected_author "${EXPECTED_PR_AUTHOR}" \
              --arg title "${title}" \
              "${pr_filter}" \
              <<<"${pr_details}" \
            | grep -qx true
          {
            echo "pr_number=${pr_number}"
            echo "base_ref=$(jq -r .baseRefName <<<"${pr_details}")"
            echo "expected_base=$(jq -r .baseRefOid <<<"${pr_details}")"
            echo "expected_head=$(jq -r .headRefOid <<<"${pr_details}")"
          } >>"${GITHUB_OUTPUT}"
          pr_id="$(gh pr view "${pr_number}" --repo "${REPOSITORY}" --json id --jq .id)"
          auto_merge_enabled="$(
            gh pr view "${pr_number}" --repo "${REPOSITORY}" \
              --json autoMergeRequest --jq '.autoMergeRequest != null'
          )"
          case "${auto_merge_enabled}" in
            true) ;;
            false)
              query="mutation(\$pr:ID!){enablePullRequestAutoMerge("
              query+="input:{pullRequestId:\$pr,mergeMethod:MERGE}){"
              query+="pullRequest{autoMergeRequest{enabledAt}}}}"
              gh api graphql \
                -f query="${query}" \
                -f pr="${pr_id}" \
                --jq '.data.enablePullRequestAutoMerge.pullRequest.autoMergeRequest != null' \
                | grep -qx true
              ;;
            *) echo "::error::Unable to determine auto-merge state."; exit 1 ;;
          esac
